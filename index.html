        </div>

        <div style="background:#fef3c7;color:#92400e;padding:12px 14px;border-radius:var(--radius);margin:14px 0;">
          <strong>⚠ Antes de continuar:</strong><br>
          Faça um <strong>backup</strong> agora, no botão "Exportar backup" mais acima. É uma medida de segurança caso algo dê errado.
        </div>

        <p style="font-size:12px;color:var(--ink-2);">
          Após criptografar, você não conseguirá mais ver as senhas — só validar quando alguém digitar a correta. Para resetar uma senha, edite o motorista.
        </p>
      </div>
    `,
    actions: [
      { label: 'Cancelar', cls: 'btn-secondary', onClick: fecharModal },
      { label: '🔒 Criptografar todas', cls: 'btn-primary', onClick: executarCriptografiaSenhas }
    ]
  });
}

/** Executa a criptografia em lote. */
async function executarCriptografiaSenhas() {
  if (!window.dcodeIO || !window.dcodeIO.bcrypt) {
    alert('❌ Biblioteca bcrypt não carregada. Verifique sua conexão com a internet e recarregue a página.');
    return;
  }

  fecharModal();

  let migradas = 0;
  let falhas = 0;

  // 1. Senha do gestor
  if (state.senhaGestor && !ehHashBcrypt(state.senhaGestor)) {
    try {
      const novoHash = hashSenha(state.senhaGestor);
      await dataLayer.config.setar('senha_gestor', novoHash);
      migradas++;
    } catch (e) {
      console.error('[Crypto] Falha ao criptografar senha do gestor:', e);
      falhas++;
    }
  }

  // 2. Senhas dos motoristas
  for (const m of (state.motoristasCadastrados || [])) {
    if (m.senha && !ehHashBcrypt(m.senha)) {
      try {
        m.senha = hashSenha(m.senha);
        await dataLayer.motoristas.salvar(m);
        migradas++;
      } catch (e) {
        console.error(`[Crypto] Falha ao criptografar senha de ${m.nome}:`, e);
        falhas++;
      }
    }
  }

  if (falhas === 0) {
    alert(`✓ Pronto! ${migradas} senha(s) criptografada(s) com sucesso.\n\nAs senhas em texto puro foram substituídas por hashes irreversíveis no banco. Os motoristas continuam logando com as mesmas senhas que já tinham.`);
  } else {
    alert(`⚠ Migração parcial:\n✓ ${migradas} criptografada(s)\n❌ ${falhas} falha(s)\n\nVerifique o console (F12) pra detalhes.`);
  }

  render();
}

async function alternarModoSupabase(entidade) {
  const ligando = !supabaseMode[entidade];

  if (ligando) {
    if (!supabaseClient) {
      alert('Biblioteca Supabase não carregada.');
      return;
    }

    // Para PEDIDOS: começa vazio (decisão do usuário na etapa 4.2)
    if (entidade === 'pedidos') {
      if (!confirm('Ativar modo Supabase para PEDIDOS?\n\nA partir de agora, novos pedidos importados ou criados serão salvos no banco online. Pedidos atuais do localStorage continuarão aqui mas não serão enviados automaticamente.')) {
        return;
      }
      supabaseMode.pedidos = true;
      salvarSupabaseMode();
      try {
        await dataLayer.pedidos.sincronizar();
      } catch (e) {
        alert('⚠ Erro ao carregar do banco: ' + e.message);
      }
    }

    // Para MOTORISTAS, VEÍCULOS, CONFIG, HISTÓRICO, CUSTOS: oferece migrar atuais
    else {
      const labels = {
        motoristas: 'MOTORISTAS',
        veiculos: 'VEÍCULOS',
        config: 'CONFIGURAÇÕES',
        historico: 'HISTÓRICO DE ENTREGAS',
        custos: 'CUSTOS MENSAIS'
      };
      const label = labels[entidade];

      // Aviso especial pra histórico se tiver muitos registros
      if (entidade === 'historico' && state.historicoEntregas.length > 100) {
        if (!confirm(`Ativar Supabase para ${label}?\n\nVocê tem ${state.historicoEntregas.length} entregas no histórico local. A migração pode demorar alguns segundos. Deseja continuar?`)) {
          return;
        }
      } else {
        if (!confirm(`Ativar modo Supabase para ${label}?\n\nO sistema vai migrar os dados atuais do navegador pro banco online. Se já existirem registros lá, serão mantidos como estão (não duplicados).\n\nDeseja continuar?`)) {
          return;
        }
      }

      // Migra primeiro (com modo ainda desligado, pra não criar loop)
      try {
        const resultado = await dataLayer[entidade].migrarLocaisParaBanco();
        // Liga o modo
        supabaseMode[entidade] = true;
        salvarSupabaseMode();
        // Sincroniza pra puxar de volta com IDs do banco
        await dataLayer[entidade].sincronizar();

        let msg = `✓ ${label} ativado!`;
        if (resultado.inseridos > 0) msg += `\n${resultado.inseridos} registro(s) migrado(s) pro banco.`;
        if (resultado.ignorados > 0) msg += `\n${resultado.ignorados} já existia(m) no banco — não duplicados.`;
        alert(msg);
      } catch (e) {
        alert('⚠ Erro durante a migração: ' + e.message + '\n\nO modo NÃO foi ativado. Tente novamente.');
        return;
      }
    }
  } else {
    if (!confirm(`Desativar modo Supabase para ${entidade}?\n\nO sistema voltará a usar apenas o localStorage. Os dados no servidor continuarão lá, mas não aparecerão até reativar.`)) {
      return;
    }
    supabaseMode[entidade] = false;
    salvarSupabaseMode();
  }

  render();
}

async function sincronizarTudoSupabase() {
  const resultado = document.getElementById('supabase_resultado');
  if (resultado) resultado.innerHTML = '<div style="padding:10px;color:var(--ink-2);font-size:13px;">⏳ Sincronizando...</div>';
  try {
    if (supabaseMode.pedidos)    await dataLayer.pedidos.sincronizar();
    if (supabaseMode.motoristas) await dataLayer.motoristas.sincronizar();
    if (supabaseMode.veiculos)   await dataLayer.veiculos.sincronizar();
    if (supabaseMode.config)     await dataLayer.config.sincronizar();
    if (supabaseMode.historico)  await dataLayer.historico.sincronizar();
    if (supabaseMode.custos)     await dataLayer.custos.sincronizar();
    // Entregas por motorista: depende de motoristas + custos, então sincroniza junto.
    // Sempre tentamos (mesmo que custos esteja off) — é silencioso se a tabela tiver vazia.
    try { await dataLayer.entregasMotoristas.sincronizar(); } catch (e) { console.warn('[entregasPorMotorista] skip:', e?.message); }
    if (resultado) resultado.innerHTML = `<div style="background:var(--ok-soft);color:var(--ok);padding:10px 14px;border-radius:var(--radius);font-size:13px;">✓ Sincronização concluída.</div>`;
    setTimeout(() => render(), 800);
  } catch (e) {
    if (resultado) resultado.innerHTML = `<div class="rota-warning">Erro: ${e.message}</div>`;
  }
}

/* ===== TESTE DE CONEXÃO COM SUPABASE (etapa 4.1) ===== */

async function testarConexaoSupabase() {
  const resultado = document.getElementById('supabase_resultado');
  resultado.innerHTML = '<div style="padding:14px;color:var(--ink-2);font-size:13px;">⏳ Testando conexão com o Supabase...</div>';

  // 1. Verifica se a biblioteca foi carregada
  if (!supabaseClient) {
    resultado.innerHTML = `
      <div class="rota-warning">
        <strong>❌ Biblioteca Supabase não carregada.</strong><br>
        Isso pode acontecer se você está sem internet, ou se um bloqueador de anúncios está bloqueando o CDN.
        <br><br>
        <strong>Tente:</strong>
        <br>1. Verifique sua conexão com a internet
        <br>2. Desative bloqueadores de anúncios (uBlock, AdBlock, etc.)
        <br>3. Abra o Console do navegador (F12) e veja se há erros em vermelho
      </div>
    `;
    return;
  }

  // 2. Tenta ler cada tabela do banco
  const tabelas = [
    { nome: 'pedidos',            label: 'Pedidos' },
    { nome: 'motoristas',         label: 'Motoristas' },
    { nome: 'veiculos',           label: 'Veículos' },
    { nome: 'historico_entregas', label: 'Histórico de entregas' },
    { nome: 'custos_mensais',     label: 'Custos mensais' },
    { nome: 'config',             label: 'Configurações' }
  ];

  const resultadosTabelas = [];

  for (const tabela of tabelas) {
    try {
      // O `head: true, count: 'exact'` faz uma chamada leve que só conta linhas, sem trazer dados
      const { count, error } = await supabaseClient
        .from(tabela.nome)
        .select('*', { count: 'exact', head: true });

      if (error) {
        resultadosTabelas.push({
          nome: tabela.label,
          status: 'erro',
          mensagem: error.message
        });
      } else {
        resultadosTabelas.push({
          nome: tabela.label,
          status: 'ok',
          mensagem: `${count || 0} registro(s)`
        });
      }
    } catch (e) {
      resultadosTabelas.push({
        nome: tabela.label,
        status: 'erro',
        mensagem: e.message || 'Erro desconhecido'
      });
    }
  }

  // 3. Renderiza o resultado
  const todosOk = resultadosTabelas.every(r => r.status === 'ok');
  const algumOk = resultadosTabelas.some(r => r.status === 'ok');

  let html;
  if (todosOk) {
    html = `
      <div style="background:var(--ok-soft);color:var(--ok);padding:12px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;margin-bottom:10px;">
        ✅ Conexão estabelecida com sucesso! Todas as 6 tabelas foram lidas.
      </div>
    `;
  } else if (algumOk) {
    html = `
      <div style="background:var(--warn-soft);color:var(--warn);padding:12px 16px;border-radius:var(--radius);font-size:14px;font-weight:500;margin-bottom:10px;">
        ⚠ Conexão funciona, mas algumas tabelas tiveram problema. Veja abaixo:
      </div>
    `;
  } else {
    html = `
      <div class="rota-warning" style="margin-bottom:10px;">
        ❌ Falha total na conexão. Veja os erros abaixo:
      </div>
    `;
  }

  html += `
    <div style="border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:13px;">
      <table>
        <thead>
          <tr><th>Tabela</th><th>Status</th><th>Resultado</th></tr>
        </thead>
        <tbody>
  `;
  for (const r of resultadosTabelas) {
    const icone = r.status === 'ok' ? '✓' : '✗';
    const cor = r.status === 'ok' ? 'var(--ok)' : 'var(--danger)';
    html += `
      <tr>
        <td><strong>${r.nome}</strong></td>
        <td style="color:${cor};font-weight:600;">${icone} ${r.status === 'ok' ? 'OK' : 'ERRO'}</td>
        <td class="muted" style="font-size:12px;">${r.mensagem}</td>
      </tr>
    `;
  }
  html += `</tbody></table></div>`;

  if (todosOk) {
    html += `
      <div style="margin-top:14px;padding:12px;background:var(--surface-2);border-radius:var(--radius);font-size:12px;color:var(--ink-2);line-height:1.6;">
        <strong>✓ Etapa 4.1 concluída.</strong> Estamos prontos para a próxima etapa: começar a usar o Supabase de verdade. Me avise no chat que está tudo verde!
      </div>
    `;
  }

  resultado.innerHTML = html;
}

/* ===== BACKUP / RESTORE — exportar e importar todos os dados ===== */

function exportarBackup() {
  // Pega o estado atual completo + metadados
  const backup = {
    versao: '1.0',
    geradoEm: new Date().toISOString(),
    sistema: 'Painel de Expedição Malba',
    dados: state
  };
  const json = JSON.stringify(backup, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dataStr = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `painel-malba-backup-${dataStr}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function abrirImportarBackup() {
  abrirModal({
    titulo: 'Importar backup',
    body: `
      <div style="font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:14px;">
        ⚠ <strong>Atenção:</strong> ao importar, todos os dados atuais do navegador serão <strong>SUBSTITUÍDOS</strong> pelos dados do arquivo. Recomendamos fazer um <strong>Exportar backup</strong> primeiro, caso queira voltar atrás.
      </div>
      <label class="pdf-dropzone" for="f_backup_arquivo" style="padding:24px;">
        <div style="font-size:24px;">💾</div>
        <div style="font-weight:600;color:var(--ink);margin-top:6px;">Clique para selecionar o arquivo</div>
        <div style="font-size:11px;color:var(--ink-3);margin-top:4px;">Arquivo .json gerado pelo "Exportar backup"</div>
        <input id="f_backup_arquivo" type="file" accept=".json,application/json" onchange="processarImportBackup(this)">
      </label>
      <div id="backup_preview" style="margin-top:14px;"></div>
    `,
    actions: [
      { label: 'Cancelar', cls: 'btn-secondary', onClick: fecharModal },
      { label: 'Confirmar importação', cls: 'btn-danger', onClick: confirmarImportBackup }
    ]
  });
}

let backupParaImportar = null;

async function processarImportBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const previewEl = document.getElementById('backup_preview');
  previewEl.innerHTML = '<div style="padding:14px;color:var(--ink-2);font-size:13px;">Lendo arquivo...</div>';

  try {
    const text = await file.text();
    const parsed = JSON.parse(text);

    // Validação básica: precisa ter "dados" com a estrutura esperada
    if (!parsed.dados || typeof parsed.dados !== 'object') {
      throw new Error('Arquivo não parece ser um backup válido (estrutura desconhecida).');
    }
    const d = parsed.dados;
    const numPedidos = (d.pedidos || []).length;
    const numMotoristas = (d.motoristasCadastrados || []).length;
    const numVeiculos = (d.veiculosCadastrados || []).length;
    const numHistorico = (d.historicoEntregas || []).length;
    const numCustos = (d.custosMensais || []).length;

    backupParaImportar = parsed;

    previewEl.innerHTML = `
      <div style="background:var(--ok-soft);color:var(--ok);padding:12px 16px;border-radius:var(--radius);font-size:13px;">
        ✓ <strong>Arquivo válido</strong> · gerado em ${parsed.geradoEm ? new Date(parsed.geradoEm).toLocaleString('pt-BR') : 'data desconhecida'}
      </div>
      <div style="background:var(--surface-2);padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-top:10px;line-height:1.8;">
        <strong>Dados que serão restaurados:</strong><br>
        • ${numPedidos} pedido(s)<br>
        • ${numMotoristas} motorista(s) cadastrado(s)<br>
        • ${numVeiculos} veículo(s) cadastrado(s)<br>
        • ${numHistorico} entrega(s) no histórico<br>
        • ${numCustos} mês(es) de custos
      </div>
    `;
  } catch (err) {
    backupParaImportar = null;
    previewEl.innerHTML = `<div class="rota-warning">Erro ao ler o arquivo: ${err.message}</div>`;
  }
}

function confirmarImportBackup() {
  if (!backupParaImportar) {
    alert('Selecione um arquivo de backup primeiro.');
    return;
  }
  if (!confirm('Tem certeza? Todos os dados atuais serão substituídos pelos do backup.')) return;

  state = backupParaImportar.dados;
  // Garantir compatibilidade de campos novos
  if (!state.historicoEntregas) state.historicoEntregas = [];
  if (!state.motoristasCadastrados) state.motoristasCadastrados = JSON.parse(JSON.stringify(defaultState.motoristasCadastrados));
  if (!state.veiculosCadastrados) state.veiculosCadastrados = JSON.parse(JSON.stringify(defaultState.veiculosCadastrados));
  if (!state.senhaGestor) state.senhaGestor = defaultState.senhaGestor;

  saveState();
  backupParaImportar = null;
  fecharModal();
  alert('Backup restaurado com sucesso!');
  render();
}

/* =====================================================================
   VIEW: HISTÓRICO (entregas concluídas, agregadas por motorista)
   ===================================================================== */

let filtroHistorico = { mes: 'todos', motorista: 'todos', busca: '' };

/* ============================================================
   BUSCA RÁPIDA DE COMPROVANTE (no Histórico)
   ============================================================
   Funcionalidade dedicada pro gestor encontrar a foto de uma
   entrega rapidamente, digitando só o número do pedido.
   É independente dos filtros gerais do Histórico abaixo. */

let buscaComprovante = { termo: '' };

/** Atualiza o termo digitado e re-renderiza só o resultado da busca,
 *  sem re-renderizar a página inteira (preserva foco do input). */
function atualizarBuscaComprovante(termo) {
  buscaComprovante.termo = termo || '';
  // Atualiza só o div de resultado pra não perder o foco do input
  const resultado = document.getElementById('busca_comprovante_resultado');
  if (resultado) {
    resultado.innerHTML = renderResultadoBuscaComprovante();
  }
  // Mostra/esconde botão Limpar conforme tem texto
  const wrap = document.querySelector('.busca-comprovante-row');
  if (wrap) {
    const temBtn = wrap.querySelector('button');
    const temTermo = !!buscaComprovante.termo;
    if (temTermo && !temBtn) {
      wrap.insertAdjacentHTML('beforeend',
        `<button class="btn btn-secondary btn-sm" onclick="atualizarBuscaComprovante('')">Limpar</button>`);
    } else if (!temTermo && temBtn) {
      temBtn.remove();
    }
  }
}

/** Procura no histórico um pedido cujo número bate com o termo digitado.
 *  Aceita formatos "13053", "P-13053", "p-13053", etc. */
function renderResultadoBuscaComprovante() {
  const termo = (buscaComprovante.termo || '').trim();
  if (!termo) return '';

  const termoUpper = termo.toUpperCase();
  const termoSemPrefixo = termoUpper.replace(/^P-/, '').replace(/^MTZ-|^RP-|^ITA-|^VE-|^FAB-/, '');

  const candidatos = (state.historicoEntregas || []).filter(h => {
    const idUpper = (h.pedidoId || '').toUpperCase();
    if (!idUpper) return false;
    return idUpper === termoUpper
      || idUpper === `P-${termoSemPrefixo}`
      || idUpper.replace(/^P-/, '').replace(/^MTZ-|^RP-|^ITA-|^VE-|^FAB-/, '') === termoSemPrefixo;
  });

  if (candidatos.length === 0) {
    return `
      <div class="busca-comprovante-vazio">
        Nenhuma entrega encontrada com esse número.
      </div>
    `;
  }

  return candidatos.map(h => {
    const dataFmt = h.data ? new Date(h.data).toLocaleString('pt-BR', {
      day: '2-digit', month: '2-digit', year: '2-digit',
      hour: '2-digit', minute: '2-digit'
    }) : '—';
    const temFoto = !!h.comprovanteUrl;
    const clienteEsc = (h.cliente || '').replace(/'/g, "\\'");

    return `
      <div class="busca-comprovante-card ${temFoto ? '' : 'sem-foto'}">
        <div class="busca-comprovante-info">
          <div class="busca-comprovante-id">${h.pedidoId}</div>
          <div class="busca-comprovante-cliente">${h.cliente || '—'}</div>
          <div class="busca-comprovante-meta">
            ${h.motorista || '—'} · ${dataFmt}
          </div>
        </div>
        <div class="busca-comprovante-acao">
          ${temFoto
            ? `<button class="btn btn-primary btn-sm" onclick="abrirComprovante('${encodeURIComponent(h.comprovanteUrl)}','${h.pedidoId}','${clienteEsc}')">📷 Ver foto</button>`
            : `<span style="font-size:12px;color:var(--ink-3);">sem foto registrada</span>`
          }
        </div>
      </div>
    `;
  }).join('');
}

const MESES_LABEL = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function renderHistorico() {
  const todas = state.historicoEntregas || [];

  // Identificar todos os meses únicos presentes no histórico (formato YYYY-MM)
  const mesesUnicos = Array.from(new Set(todas.map(h => h.data.slice(0, 7)))).sort().reverse();

  // Identificar todos os motoristas únicos
  const motoristasUnicos = Array.from(new Set(todas.map(h => h.motorista))).sort();

  // Aplicar filtros
  let filtradas = todas;
  if (filtroHistorico.mes !== 'todos') {
    filtradas = filtradas.filter(h => h.data.startsWith(filtroHistorico.mes));
  }
  if (filtroHistorico.motorista !== 'todos') {
    filtradas = filtradas.filter(h => h.motorista === filtroHistorico.motorista);
  }
  if (filtroHistorico.busca && filtroHistorico.busca.trim()) {
    const q = filtroHistorico.busca.toLowerCase().trim();
    filtradas = filtradas.filter(h =>
      (h.pedidoId || '').toLowerCase().includes(q) ||
      (h.cliente || '').toLowerCase().includes(q) ||
      (h.bairro || '').toLowerCase().includes(q) ||
      (h.cidade || '').toLowerCase().includes(q)
    );
  }

  // Agregar entregas por motorista
  const porMotorista = {};
  filtradas.forEach(h => {
    if (!porMotorista[h.motorista]) {
      porMotorista[h.motorista] = { total: 0, valor: 0, entregas: [] };
    }
    porMotorista[h.motorista].total++;
    porMotorista[h.motorista].valor += h.valor || 0;
    porMotorista[h.motorista].entregas.push(h);
  });

  const motoristasOrdenados = Object.keys(porMotorista).sort((a, b) =>
    porMotorista[b].total - porMotorista[a].total
  );

  const totalEntregas = filtradas.length;
  const totalValor = filtradas.reduce((s, h) => s + (h.valor || 0), 0);

  // Mês e ano atuais para destaque
  const hoje = new Date();
  const mesAtualKey = hoje.toISOString().slice(0, 7);

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Histórico de entregas</h1>
          <div class="page-subtitle">Registro permanente de entregas concluídas. Esses dados são preservados mesmo que pedidos sejam excluídos do painel.</div>
        </div>
        <div class="page-actions">
          ${todas.length > 0 ? `<button class="btn btn-secondary btn-sm" onclick="exportarHistoricoCSV()">↓ Exportar CSV</button>` : ''}
        </div>
      </div>

      ${todas.length === 0 ? `
        <div class="empty">
          <h3>Ainda não há entregas registradas</h3>
          <p>Quando um pedido for marcado como "Entregue", ele será automaticamente registrado aqui — e permanecerá no histórico mesmo que o pedido seja excluído depois.</p>
        </div>
      ` : `
        <div class="kpi-grid">
          <div class="kpi accent">
            <div class="kpi-label">Entregas registradas</div>
            <div class="kpi-value">${totalEntregas}</div>
            <div class="kpi-sub">${filtroHistorico.mes === 'todos' ? 'em todo o histórico' : 'no período selecionado'}</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Valor total entregue</div>
            <div class="kpi-value">${fmtBRL(totalValor)}</div>
            <div class="kpi-sub">soma dos pedidos</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Motoristas ativos</div>
            <div class="kpi-value">${motoristasOrdenados.length}</div>
            <div class="kpi-sub">com entregas no período</div>
          </div>
          ${(() => {
            const comFoto = filtradas.filter(h => h.comprovanteUrl).length;
            const pct = totalEntregas > 0 ? Math.round(comFoto / totalEntregas * 100) : 0;
            const kpiClass = pct === 100 ? 'success' : (pct >= 80 ? '' : 'alert');
            return `
              <div class="kpi ${kpiClass}">
                <div class="kpi-label">Com comprovante</div>
                <div class="kpi-value">${pct}%</div>
                <div class="kpi-sub">${comFoto} de ${totalEntregas}</div>
              </div>
            `;
          })()}
        </div>

        <!-- ===== Busca rápida de comprovante por número do pedido =====
             Pesquisa direta na lista do histórico procurando o pedidoId que
             casa com o número digitado. Mostra um cartão com o resultado e
             botão pra ver a foto. Não interfere nos outros filtros abaixo. -->
        <div class="busca-comprovante">
          <div class="busca-comprovante-titulo">
            🔍 Buscar comprovante por número do pedido
          </div>
          <div class="busca-comprovante-row">
            <input
              type="text"
              id="busca_comprovante_input"
              placeholder="Ex: 13053 ou P-13053"
              value="${buscaComprovante.termo}"
              oninput="atualizarBuscaComprovante(this.value)">
            ${buscaComprovante.termo ? `
              <button class="btn btn-secondary btn-sm" onclick="atualizarBuscaComprovante('')">Limpar</button>
            ` : ''}
          </div>
          <div id="busca_comprovante_resultado">
            ${renderResultadoBuscaComprovante()}
          </div>
        </div>

        <div class="toolbar">
          <select id="hist_mes" class="filter-chip" style="padding:7px 12px;">
            <option value="todos" ${filtroHistorico.mes==='todos'?'selected':''}>Todos os meses</option>
            ${mesesUnicos.map(m => {
              const [ano, mes] = m.split('-');
              const label = `${MESES_LABEL[parseInt(mes)-1]} / ${ano}`;
              const sufixo = m === mesAtualKey ? ' (atual)' : '';
              return `<option value="${m}" ${filtroHistorico.mes===m?'selected':''}>${label}${sufixo}</option>`;
            }).join('')}
          </select>
          <select id="hist_motorista" class="filter-chip" style="padding:7px 12px;">
            <option value="todos" ${filtroHistorico.motorista==='todos'?'selected':''}>Todos os motoristas</option>
            ${motoristasUnicos.map(m => `
              <option value="${m}" ${filtroHistorico.motorista===m?'selected':''}>${m}</option>
            `).join('')}
          </select>
          <div class="search-box" style="flex:1;min-width:240px;">
            <input id="hist_busca" type="text" placeholder="Buscar por pedido, cliente ou bairro..." value="${filtroHistorico.busca || ''}">
          </div>
          ${filtroHistorico.busca ? `<button class="filter-chip" onclick="limparBuscaHistorico()">Limpar busca</button>` : ''}
        </div>

        ${filtroHistorico.busca && filtradas.length === 0 ? `
          <div class="empty">
            <h3>Nada encontrado para "${filtroHistorico.busca}"</h3>
            <p>Tente buscar por outro termo, ou limpe a busca pra ver tudo.</p>
          </div>
        ` : ''}

        ${motoristasOrdenados.length === 0 ? `
          <div class="empty">
            <h3>Nenhuma entrega encontrada</h3>
            <p>Nenhuma entrega registrada no período/motorista selecionado.</p>
          </div>
        ` : `
          <div class="chart-card">
            <div class="chart-title">Entregas por motorista</div>
            <div class="bar-chart" style="height:200px;">
              ${(() => {
                const max = Math.max(...motoristasOrdenados.map(m => porMotorista[m].total), 1);
                return motoristasOrdenados.map(m => `
                  <div class="bar-group">
                    <div class="bar-value">${porMotorista[m].total}</div>
                    <div class="bar accent" style="height:${porMotorista[m].total / max * 100}%" title="${m}: ${porMotorista[m].total} entregas"></div>
                    <div class="bar-label">${m.length > 12 ? m.slice(0, 10) + '…' : m}</div>
                  </div>
                `).join('');
              })()}
            </div>
          </div>

          <div class="table-wrap">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Motorista</th>
                    <th class="num">Entregas</th>
                    <th class="num">Valor total</th>
                    <th class="num">Ticket médio</th>
                    <th class="num">% do total</th>
                  </tr>
                </thead>
                <tbody>
                  ${motoristasOrdenados.map(m => {
                    const stats = porMotorista[m];
                    const pct = totalEntregas > 0 ? (stats.total / totalEntregas * 100) : 0;
                    return `
                      <tr style="cursor:pointer;" onclick="toggleDetalheHistorico('${m.replace(/'/g,'\\\'')}')">
                        <td data-label="Motorista"><strong>${m}</strong></td>
                        <td data-label="Entregas" class="num mono"><strong>${stats.total}</strong></td>
                        <td data-label="Valor total" class="num mono">${fmtBRL(stats.valor)}</td>
                        <td data-label="Ticket médio" class="num mono">${fmtBRL(stats.valor / stats.total)}</td>
                        <td data-label="% do total" class="num mono">${pct.toFixed(1)}%</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <details style="margin-top:16px;" ${filtroHistorico.busca ? 'open' : ''}>
            <summary style="cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:500;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);">
              ${filtroHistorico.busca
                ? `Resultado da busca · ${filtradas.length} entrega(s) encontrada(s)`
                : `Ver lista detalhada de todas as ${filtradas.length} entrega(s) do período`}
            </summary>
            <div class="table-wrap" style="margin-top:8px;">
              <div class="table-scroll">
                <table>
                  <thead>
                    <tr>
                      <th>Data</th>
                      <th>Pedido</th>
                      <th>Cliente</th>
                      <th>Motorista</th>
                      <th>Veículo</th>
                      <th>Destino</th>
                      <th class="num">Valor</th>
                      <th>Comprovante</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtradas.slice().reverse().map(h => `
                      <tr>
                        <td data-label="Data" class="mono">${formatarData(h.data)}</td>
                        <td data-label="Pedido" class="mono">${h.pedidoId}</td>
                        <td data-label="Cliente">${h.cliente}</td>
                        <td data-label="Motorista">${h.motorista}</td>
                        <td data-label="Veículo">${h.veiculo ? veiculoTag(h.veiculo) : '<span class="muted">—</span>'}</td>
                        <td data-label="Destino" class="muted" style="font-size:11px;">${[h.bairro, h.cidade].filter(Boolean).join(', ') || '—'}</td>
                        <td data-label="Valor" class="num mono">${fmtBRL(h.valor)}</td>
                        <td data-label="Comprovante">
                          ${h.comprovanteUrl
                            ? `<button class="btn btn-secondary btn-sm" onclick="abrirComprovante('${encodeURIComponent(h.comprovanteUrl)}','${h.pedidoId}','${h.cliente.replace(/'/g, "\\'")}')">📷 Ver foto</button>`
                            : '<span style="color:var(--warn);font-size:11px;">⚠ Sem foto</span>'
                          }
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </details>
        `}

        <div class="footer-info">
          <strong>Como funciona o histórico:</strong> Cada vez que um pedido é marcado como "Entregue", o sistema cria automaticamente uma cópia permanente dos dados relevantes (motorista, cliente, valor, data, destino). Mesmo que o pedido seja excluído do Painel Logístico depois, esse registro permanece aqui pra cálculo de produtividade, bonificação dos motoristas e análises mensais. Você pode exportar pra CSV pra usar em outras ferramentas.
        </div>
      `}
    </div>
  `;
}

function bindHistoricoEvents() {
  const mesEl = document.getElementById('hist_mes');
  const motEl = document.getElementById('hist_motorista');
  const buscaEl = document.getElementById('hist_busca');
  if (mesEl) mesEl.addEventListener('change', () => {
    filtroHistorico.mes = mesEl.value;
    render();
  });
  if (motEl) motEl.addEventListener('change', () => {
    filtroHistorico.motorista = motEl.value;
    render();
  });
  if (buscaEl) {
    // Debounce: espera 300ms entre teclas pra não re-renderizar a cada caractere
    let timerBusca = null;
    buscaEl.addEventListener('input', (e) => {
      clearTimeout(timerBusca);
      timerBusca = setTimeout(() => {
        filtroHistorico.busca = e.target.value;
        render();
        // Restaura foco no input após re-render

          novoEl.focus();
          novoEl.setSelectionRange(novoEl.value.length, novoEl.value.length);
        }
      }, 300);
    });
  }
}

function formatarData(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch(e) { return iso.slice(0, 10); }
}

function exportarHistoricoCSV() {
  const linhas = [
    ['Data','Pedido','Cliente','Motorista','Veiculo','Bairro','Cidade','Valor','Comprovante'].join(';')
  ];
  state.historicoEntregas.forEach(h => {
    linhas.push([
      formatarData(h.data),
      h.pedidoId,
      `"${(h.cliente || '').replace(/"/g, '""')}"`,
      h.motorista,
      h.veiculo,
      h.bairro,
      h.cidade,
      String(h.valor).replace('.', ','),
      h.comprovanteUrl || ''
    ].join(';'));
  });
  const csv = '\uFEFF' + linhas.join('\n'); // BOM pra Excel reconhecer UTF-8
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `historico-entregas-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* =====================================================================
   VIEW: BASE DE DADOS (wrapper com sub-abas para Custos + Cadastros)
   ---------------------------------------------------------------------
   Esta view não tem conteúdo próprio — ela apenas mostra duas sub-abas
   no topo (Custos / Cadastros) e renderiza dentro a tela escolhida.
   O estado da sub-aba ativa fica em `baseDadosSubaba` (persistido
   em sessionStorage pra sobreviver a navegação na sessão).
   ===================================================================== */

let baseDadosSubaba = sessionStorage.getItem('malba_base_dados_subaba') || 'custos';

function renderBaseDados() {
  const app = document.getElementById('app');
  if (!app) return;

  // Garante valor válido (pode ter sido salvo errado em versão antiga)
  const subabasValidas = ['custos', 'cadastros', 'historico'];
  if (!subabasValidas.includes(baseDadosSubaba)) {
    baseDadosSubaba = 'custos';
  }

  // Renderiza o esqueleto: header com sub-abas + container do conteúdo
  app.innerHTML = `
    <div class="base-dados-wrap">
      <div class="base-dados-header">
        <h2 class="base-dados-titulo">Base de dados</h2>
        <div class="base-dados-subnav" role="tablist">
          <button class="base-dados-tab${baseDadosSubaba === 'custos' ? ' active' : ''}"
                  onclick="trocarSubabaBaseDados('custos')" role="tab" data-subaba="custos">
            💰 Custos
          </button>
          <button class="base-dados-tab${baseDadosSubaba === 'cadastros' ? ' active' : ''}"
                  onclick="trocarSubabaBaseDados('cadastros')" role="tab" data-subaba="cadastros">
            ⚙️ Cadastros
          </button>
          <button class="base-dados-tab${baseDadosSubaba === 'historico' ? ' active' : ''}"
                  onclick="trocarSubabaBaseDados('historico')" role="tab" data-subaba="historico">
            🕒 Histórico
          </button>
        </div>
      </div>
      <div id="base-dados-conteudo"></div>
    </div>
  `;

  // Renderiza o conteúdo da sub-aba ativa dentro do container
  renderConteudoSubabaBaseDados();
}

function renderConteudoSubabaBaseDados() {
  const cont = document.getElementById('base-dados-conteudo');
  if (!cont) return;
  if (baseDadosSubaba === 'custos') {
    cont.innerHTML = renderCustos();
    bindCustosEvents();
  } else if (baseDadosSubaba === 'historico') {
    cont.innerHTML = renderHistorico();
    if (typeof bindHistoricoEvents === 'function') bindHistoricoEvents();
  } else {
    cont.innerHTML = renderCadastros();
    bindCadastrosEvents();
  }
}

function trocarSubabaBaseDados(subaba) {
  const subabasValidas = ['custos', 'cadastros', 'historico'];
  if (!subabasValidas.includes(subaba)) return;
  baseDadosSubaba = subaba;
  sessionStorage.setItem('malba_base_dados_subaba', subaba);

  // Atualiza apenas o estado visual das abas (usando data-subaba pra
  // ficar independente do texto do botão) e re-renderiza o conteúdo
  document.querySelectorAll('.base-dados-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.subaba === subaba);
  });
  renderConteudoSubabaBaseDados();
}

/* =====================================================================
   VIEW: CUSTOS (substituir BASE DE DADOS)
   ===================================================================== */

function renderCustos() {
  // Lista de motoristas ativos (próprios + terceiros) ordenados — próprios primeiro
  const motoristasAtivos = (state.motoristasCadastrados || [])
    .filter(m => m.ativo)
    .sort((a, b) => {
      const tipoOrder = { proprio: 0, terceiro: 1 };
      const ta = tipoOrder[a.tipo] ?? 0;
      const tb = tipoOrder[b.tipo] ?? 0;
      if (ta !== tb) return ta - tb;
      return (a.nome || '').localeCompare(b.nome || '');
    });
  const proprios = motoristasAtivos.filter(m => m.tipo === 'proprio');
  const terceiros = motoristasAtivos.filter(m => m.tipo === 'terceiro');

  // Garantir que TODOS os meses até o mês atual aparecem na tabela.
  // Antes: só mostrava meses que tinham linha em state.custosMensais (criada manualmente
  // ou via ALTER TABLE). Agora: calcula a lista completa Janeiro→mês atual e mescla.
  // Quando um mês não tem linha em custosMensais, mostra com zero (mas se houver
  // entregas em entregas_por_motorista, elas aparecem).
  const NOMES_MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                       'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const mesAtualIdx = new Date().getMonth();
  const anoAtual = new Date().getFullYear();
  const mesesPraMostrar = [];
  for (let i = 0; i <= mesAtualIdx; i++) {
    const nomeMes = NOMES_MESES[i];
    const existente = (state.custosMensais || []).find(c => c.mes === nomeMes);
    if (existente) {
      mesesPraMostrar.push(existente);
    } else {
      // Cria linha "virtual" com zeros — gestor pode editar pra preencher
      mesesPraMostrar.push({
        mes: nomeMes, ano: anoAtual,
        combustivel: 0, manutencao: 0, fixo: 5146.77, extra: 0
      });
    }
  }

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Custos mensais</h1>
          <div class="page-subtitle">Lançamentos mensais de entregas e custos por motorista. Entregas dos próprios são preenchidas automaticamente a partir das entregas concluídas no histórico (Maio em diante). O gestor pode sobrescrever manualmente.</div>
        </div>
      </div>

      <div class="footer-info" style="margin-bottom: 16px;">
        <strong>Como funciona:</strong> Cada coluna de motorista próprio mostra automaticamente as entregas que ele concluiu no mês (a partir de Maio). Você pode sobrescrever editando o mês. Para terceiros, você lança o número de entregas e o custo total que eles cobraram. <strong>Bônus:</strong> R$ ${(motoristasAtivos[0]?.valorBonus || 4).toFixed(2)} por entrega para motoristas próprios (calculado automaticamente).
      </div>

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th rowspan="2" style="vertical-align:bottom;">Mês</th>
                ${proprios.length > 0 ? `<th colspan="${proprios.length}" style="text-align:center;background:#e8f0f8;">Motoristas próprios</th>` : ''}
                ${terceiros.length > 0 ? `<th colspan="${terceiros.length}" style="text-align:center;background:#f0f8e8;">Terceiros</th>` : ''}
                <th rowspan="2" style="vertical-align:bottom;">Combustível</th>
                <th rowspan="2" style="vertical-align:bottom;">Manutenção</th>
                <th rowspan="2" style="vertical-align:bottom;">Custo Terceiros Total</th>
                <th rowspan="2" style="vertical-align:bottom;">Bônus próprios</th>
                <th rowspan="2" style="vertical-align:bottom;">Total entregas</th>
                <th rowspan="2" style="vertical-align:bottom;">C. Próprio un.</th>
                <th rowspan="2" style="vertical-align:bottom;">C. Terceiro un.</th>
                <th rowspan="2" style="vertical-align:bottom;"></th>
              </tr>
              <tr>
                ${proprios.map(m => `<th style="background:#e8f0f8;">${m.nome}</th>`).join('')}
                ${terceiros.map(m => `<th style="background:#f0f8e8;">${m.nome}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${mesesPraMostrar.map((custosM, idx) => {
                // Pra cada motorista, pega entregas efetivas do mês
                const entregasPorMot = motoristasAtivos.map(mot => {
                  const linha = (state.entregasPorMotorista || []).find(e =>
                    e.mes === custosM.mes && e.motoristaNome === mot.nome
                  );
                  return {
                    motorista: mot,
                    linha,
                    entregas: linha ? entregasEfetivas(linha) : 0,
                    custoTerceiro: linha ? (linha.custoTerceiroTotal || 0) : 0,
                    isManual: linha && linha.entregasManuais !== null && linha.entregasManuais !== undefined,
                  };
                });

                const entregasProprio = entregasPorMot
                  .filter(e => e.motorista.tipo === 'proprio')
                  .reduce((s, e) => s + e.entregas, 0);
                const entregasTerceiro = entregasPorMot
                  .filter(e => e.motorista.tipo === 'terceiro')
                  .reduce((s, e) => s + e.entregas, 0);
                const entregasTotal = entregasProprio + entregasTerceiro;
                const custoTerceiroTotal = entregasPorMot
                  .filter(e => e.motorista.tipo === 'terceiro')
                  .reduce((s, e) => s + e.custoTerceiro, 0);

                // Bônus = entregas próprias × valor_bonus de cada um
                const bonusTotal = entregasPorMot
                  .filter(e => e.motorista.tipo === 'proprio')
                  .reduce((s, e) => s + (e.entregas * (e.motorista.valorBonus || 4)), 0);

                const custoProprioTotal = (custosM.fixo || 0) + (custosM.combustivel || 0)
                  + (custosM.manutencao || 0) + bonusTotal + (custosM.extra || 0);
                const custoProprioUn = entregasProprio > 0 ? custoProprioTotal / entregasProprio : 0;
                const custoTerceiroUn = entregasTerceiro > 0 ? custoTerceiroTotal / entregasTerceiro : 0;

                return `
                  <tr>
                    <td data-label="Mês"><strong>${custosM.mes}</strong></td>
                    ${entregasPorMot.map(e => `
                      <td data-label="${e.motorista.nome}" class="num mono"
                          style="background:${e.motorista.tipo === 'proprio' ? '#f4f8fc' : '#f7faf2'};"
                          title="${e.isManual ? 'Manual' : 'Calculado do histórico'}">
                        ${e.entregas}${e.isManual ? '<span style="color:#d97706;font-size:9px;margin-left:3px;" title="Sobrescrito manualmente">✎</span>' : ''}
                      </td>
                    `).join('')}
                    <td data-label="Combustível" class="num mono">${fmtBRL(custosM.combustivel || 0)}</td>
                    <td data-label="Manutenção" class="num mono">${fmtBRL(custosM.manutencao || 0)}</td>
                    <td data-label="C. Terceiros Total" class="num mono">${fmtBRL(custoTerceiroTotal)}</td>
                    <td data-label="Bônus" class="num mono">${fmtBRL(bonusTotal)}</td>
                    <td data-label="Total entregas" class="num mono"><strong>${entregasTotal}</strong></td>
                    <td data-label="C. Próprio un." class="num mono">${entregasProprio > 0 ? fmtBRL(custoProprioUn) : '—'}</td>
                    <td data-label="C. Terceiro un." class="num mono">${entregasTerceiro > 0 ? fmtBRL(custoTerceiroUn) : '—'}</td>
                    <td class="text-right">
                      <button class="btn btn-secondary btn-sm" onclick="editarCusto('${custosM.mes}')">Editar</button>
                      <button class="btn btn-secondary btn-sm" onclick="recalcularMesDoHistorico('${custosM.mes}')" title="Recalcular entregas dos motoristas próprios a partir do histórico real">🔄</button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="footer-info" style="margin-top: 20px;">
        <strong>Legendas:</strong> Coluna com <span style="color:#d97706;">✎</span> = valor sobrescrito manualmente pelo gestor. Botão 🔄 = recalcula as entregas dos motoristas próprios a partir do histórico real (Maio em diante).
        <br><br>
        <strong>Fórmulas:</strong> Custo Próprio Total = Custo Fixo (R$ ${(state.custosMensais[0]?.fixo || 5146.77).toFixed(2)}) + Combustível + Manutenção + Bônus + Extras. Custo Próprio Unitário = ÷ Entregas Próprias. Custo Terceiro Unitário = Custo Terceiros ÷ Entregas Terceiras.
      </div>
    </div>
  `;
}

/** Recalcula entregas dos motoristas próprios a partir do histórico real.
 *  Chama dataLayer.entregasMotoristas.recalcularMes() e re-renderiza. */
async function recalcularMesDoHistorico(mes) {
  if (!supabaseClient) {
    alert('Supabase precisa estar conectado pra recalcular do histórico.');
    return;
  }
  if (!confirm(`Recalcular entregas de ${mes} a partir do histórico real?\n\nIsso atualiza apenas os "calculados" — valores manuais que você já editou continuam.`)) {
    return;
  }
  try {
    const ano = new Date().getFullYear();
    const n = await dataLayer.entregasMotoristas.recalcularMes(mes, ano);
    alert(`✅ ${mes} recalculado (${n} motoristas atualizados).`);
    render();
  } catch (e) {
    alert('Erro ao recalcular: ' + e.message);
  }
}

function editarCusto(mesNome) {
  // Procura o mês existente. Se não tiver (mês virtual), cria um stub novo
  // que vai ser inserido em state.custosMensais ao salvar.
  let custosM = state.custosMensais.find(c => c.mes === mesNome);
  if (!custosM) {
    custosM = {
      mes: mesNome, ano: new Date().getFullYear(),
      combustivel: 0, manutencao: 0, fixo: 5146.77, extra: 0
    };
    state.custosMensais.push(custosM);
  }

  // Lista motoristas ativos (próprios primeiro)
  const motoristasAtivos = (state.motoristasCadastrados || [])
    .filter(m => m.ativo)
    .sort((a, b) => {
      const tipoOrder = { proprio: 0, terceiro: 1 };
      return (tipoOrder[a.tipo] ?? 0) - (tipoOrder[b.tipo] ?? 0);
    });

  // Entregas atuais por motorista (do state.entregasPorMotorista)
  const dadosAtuais = motoristasAtivos.map(mot => {
    const linha = (state.entregasPorMotorista || []).find(e =>
      e.mes === custosM.mes && e.motoristaNome === mot.nome
    );
    return {
      motorista: mot,
      entregasManuais: linha?.entregasManuais ?? null,
      entregasCalculadas: linha?.entregasCalculadas ?? 0,
      custoTerceiroTotal: linha?.custoTerceiroTotal ?? 0,
    };
  });

  // Body do modal
  const camposMotoristas = dadosAtuais.map(d => {
    const id = `c_mot_${d.motorista.id}`;
    const idCusto = `c_custoT_${d.motorista.id}`;
    const valorAtual = d.entregasManuais ?? d.entregasCalculadas;
    const labelExtra = (d.motorista.tipo === 'proprio' && d.entregasCalculadas > 0)
      ? `<span style="font-size:11px;color:var(--ink-3);">(do histórico: ${d.entregasCalculadas} — deixe vazio pra usar este)</span>`
      : '';
    return `
      <div class="field" style="border-left: 3px solid ${d.motorista.tipo === 'proprio' ? '#3b82f6' : '#16a34a'}; padding-left: 10px;">
        <label>Entregas ${d.motorista.nome} <span style="color:var(--ink-3);font-size:11px;">(${d.motorista.tipo})</span> ${labelExtra}</label>
        <input id="${id}" type="number" min="0"
               value="${d.entregasManuais !== null ? d.entregasManuais : ''}"
               placeholder="${d.motorista.tipo === 'proprio' ? `Vazio = usar ${d.entregasCalculadas}` : '0'}">
        ${d.motorista.tipo === 'terceiro' ? `
          <label style="margin-top:6px;">Custo total cobrado por ${d.motorista.nome} (R$)</label>
          <input id="${idCusto}" type="number" step="0.01" min="0" value="${d.custoTerceiroTotal}">
        ` : ''}
      </div>
    `;
  }).join('');

  abrirModal({
    titulo: `Custos · ${custosM.mes}`,
    body: `
      <div style="font-size:13px;color:var(--ink-2);margin-bottom:12px;">
        Edição completa do mês. Para motoristas próprios, deixe vazio pra usar o valor calculado automaticamente do histórico.
      </div>
      ${camposMotoristas}
      <hr style="border:none;border-top:1px solid var(--line);margin:16px 0;">
      <div class="field-row">
        <div class="field"><label>Combustível (R$)</label><input id="c_comb" type="number" step="0.01" value="${custosM.combustivel || 0}"></div>
        <div class="field"><label>Manutenção (R$)</label><input id="c_man" type="number" step="0.01" value="${custosM.manutencao || 0}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Custo Fixo (R$)</label><input id="c_fixo" type="number" step="0.01" value="${custosM.fixo || 5146.77}"></div>
        <div class="field"><label>Extras (R$)</label><input id="c_extra" type="number" step="0.01" value="${custosM.extra || 0}"></div>
      </div>
    `,
    actions: [
      { label: 'Cancelar', cls: 'btn-secondary', onClick: fecharModal },
      { label: 'Salvar', cls: 'btn-primary', onClick: async () => {
        try {
          // 1. Atualizar custos gerais do mês
          custosM.combustivel = parseFloat(document.getElementById('c_comb').value) || 0;
          custosM.manutencao = parseFloat(document.getElementById('c_man').value) || 0;
          custosM.fixo = parseFloat(document.getElementById('c_fixo').value) || 5146.77;
          custosM.extra = parseFloat(document.getElementById('c_extra').value) || 0;
          await dataLayer.custos.salvar(custosM);

          // 2. Atualizar entregas por motorista (estrutura nova)
          if (supabaseClient) {
            const ano = new Date().getFullYear();
            for (const d of dadosAtuais) {
              const inputEnt = document.getElementById(`c_mot_${d.motorista.id}`);
              const valorEnt = inputEnt.value.trim();
              const entregasManuais = valorEnt === '' ? null : parseInt(valorEnt) || 0;

              let custoTerceiroTotal;
              if (d.motorista.tipo === 'terceiro') {
                const inputCusto = document.getElementById(`c_custoT_${d.motorista.id}`);
                custoTerceiroTotal = parseFloat(inputCusto.value) || 0;
              }

              await dataLayer.entregasMotoristas.upsert({
                mes: custosM.mes,
                ano,
                motoristaId: d.motorista.id,
                entregasManuais,
                custoTerceiroTotal
              });
            }
            await dataLayer.entregasMotoristas.sincronizar();
          }

          fecharModal();
          render();
        } catch (e) {
          alert('Erro ao salvar: ' + e.message);
        }
      }}
    ]
  });
}

          ${p.observacao ? `<div style="background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:4px;font-size:12px;margin-bottom:10px;">⚠ ${p.observacao}</div>` : ''}
          <div class="driver-actions">
            ${p.status === 'expedicao' ? `<button class="btn btn-primary" onclick="motoristaUpdate('${p.id}','saiu')">Saí p/ entrega</button>` : ''}
            ${p.status === 'saiu' ? `
              <button class="btn btn-primary" onclick="motoristaUpdate('${p.id}','entregue')">✓ Entregue</button>
              <button class="btn btn-secondary" onclick="motoristaOcorrencia('${p.id}')">Ocorrência</button>
            ` : ''}
            ${p.status === 'ocorrencia' ? `<button class="btn btn-primary" onclick="motoristaUpdate('${p.id}','saiu')">Tentar novamente</button>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function bindMotoristaEvents() { /* nada por enquanto */ }

async function motoristaUpdate(id, status) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;

  // Caso especial: marcar como entregue exige foto do comprovante
  if (status === 'entregue') {
    abrirCapturaComprovante(p);
    return;
  }

  const statusAnterior = p.status;
  p.status = status;

  // Carimba o horário de saída quando o motorista clica "Saí p/ entrega"
  // (só na primeira vez — se voltar e clicar de novo, mantém o original).
  if (status === 'saiu' && !p.saiuEm) {
    p.saiuEm = new Date().toISOString();
  }

  await dataLayer.pedidos.salvar(p);

  // Notificação semanal de entregas: avisa o gestor pelo toast (no canto do app).
  // Só mostra se foi o motorista que mudou o status (não o gestor mexendo).
  if (status === 'saiu' && perfilAtivo === 'motorista') {
    mostrarToastMotorista('🚚 Saída registrada', `Pedido ${p.id}`);
  }

  render();
}

/* ===== CAPTURA DE COMPROVANTE (foto obrigatória ao entregar) ===== */

let comprovanteCapturado = null; // arquivo selecionado (antes do upload)

function abrirCapturaComprovante(pedido) {
  comprovanteCapturado = null;
  abrirModal({
    titulo: `Comprovante de entrega · ${pedido.id}`,
    body: `
      <div style="font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:14px;">
        Tire uma foto do <strong>pedido assinado</strong> ou <strong>do canhoto da nota</strong> pra confirmar a entrega de <strong>${pedido.cliente}</strong>.
      </div>

      <div id="comprovante_preview" style="margin-bottom:14px;">
        <label class="pdf-dropzone" for="f_foto_comprovante" style="padding:32px;text-align:center;">
          <div style="font-size:36px;">📷</div>
          <div style="font-weight:600;color:var(--ink);margin-top:8px;font-size:15px;">
            Tirar foto do comprovante
          </div>
          <div style="font-size:12px;color:var(--ink-3);margin-top:4px;">
            Toque pra abrir a câmera
          </div>
          <input id="f_foto_comprovante" type="file" accept="image/*" capture="environment" onchange="processarComprovante(this)">
        </label>
      </div>

      <div id="comprovante_status" style="font-size:12px;color:var(--ink-2);"></div>
    `,
    actions: [
      { label: 'Cancelar', cls: 'btn-secondary', onClick: () => {
        comprovanteCapturado = null;
        fecharModal();
      } },
      { label: 'Confirmar entrega', cls: 'btn-primary', onClick: () => confirmarEntregaComFoto(pedido.id) }
    ]
  });

function processarComprovante(input) {
  const file = input.files[0];
  if (!file) return;

  comprovanteCapturado = file;

  // Mostra preview imediato
  const preview = document.getElementById('comprovante_preview');
  const reader = new FileReader();
  reader.onload = (e) => {
    preview.innerHTML = `
      <div style="position:relative;border-radius:var(--radius-lg);overflow:hidden;border:2px solid var(--ok);">
        <img src="${e.target.result}" style="display:block;width:100%;max-height:320px;object-fit:contain;background:#000;">
        <div style="padding:8px 12px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:500;display:flex;justify-content:space-between;align-items:center;">
          <span>✓ Foto capturada (${(file.size / 1024).toFixed(0)} KB)</span>
          <label for="f_foto_comprovante" style="cursor:pointer;text-decoration:underline;">Tirar outra</label>
        </div>
      </div>
    `;
    // Re-criar o input invisível pra permitir trocar a foto
    const novoInput = document.createElement('input');
    novoInput.id = 'f_foto_comprovante';
    novoInput.type = 'file';
    novoInput.accept = 'image/*';
    novoInput.capture = 'environment';
    novoInput.style.display = 'none';
    novoInput.onchange = function() { processarComprovante(this); };
    preview.appendChild(novoInput);
  };
  reader.readAsDataURL(file);
}

async function confirmarEntregaComFoto(pedidoId) {
  if (!comprovanteCapturado) {
    alert('Você precisa tirar a foto do comprovante para confirmar a entrega.');
    return;
  }

  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;

  const status = document.getElementById('comprovante_status');
  const acoes = document.querySelectorAll('.modal-foot .btn');
  acoes.forEach(b => b.disabled = true);

  if (status) status.innerHTML = '<div style="padding:10px;background:var(--surface-2);border-radius:var(--radius);color:var(--ink-2);">⏳ Enviando foto...</div>';

  // Sempre lê o arquivo como base64 (precisamos disso pra fila offline)
  const fotoBase64 = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = (e) => resolve(e.target.result);
    r.onerror = () => reject(new Error('Falha ao ler arquivo'));
    r.readAsDataURL(comprovanteCapturado);
  });

  let comprovanteUrl = null;
  let envioFoiComSync = true; // se conseguiu enviar online ou se ficou pendente

  // Tenta enviar pro Supabase Storage
  if (supabaseClient) {
    try {
      comprovanteUrl = await dataLayer.fotos.upload(comprovanteCapturado, p.id);
      if (status) status.innerHTML = '<div style="padding:10px;background:var(--ok-soft);border-radius:var(--radius);color:var(--ok);">✓ Foto enviada · finalizando...</div>';
    } catch (e) {
      console.warn('[Supabase] Upload falhou, salvando na fila:', e);
      // FALHOU → salvar na fila pra sincronizar depois
      envioFoiComSync = false;
      comprovanteUrl = fotoBase64; // fica visível offline
      // Adiciona à fila de pendentes
      state.entregasPendentes.push({
        pedidoId: p.id,
        fotoBase64: fotoBase64,
        dataLocal: new Date().toISOString(),
        tentativas: 1
      });
    }
  } else {
    // Sem Supabase, fica salvo só localmente
    comprovanteUrl = fotoBase64;
    envioFoiComSync = false;
  }

  // Atualiza pedido (sempre marca como entregue, online ou não)
  const statusAnterior = p.status;
  p.status = 'entregue';
  if (statusAnterior !== 'entregue') {
    await registrarEntregaNoHistorico(p, comprovanteUrl);
  }
  await dataLayer.pedidos.salvar(p);

  comprovanteCapturado = null;
  fecharModal();

  // Mensagem diferente conforme conseguiu enviar ou ficou pendente
  if (!envioFoiComSync && supabaseClient) {
    alert(`✓ Pedido ${p.id} marcado como entregue!\n\n📦 Salvo localmente.\nA foto será enviada quando voltar online.`);
  }

  render();
}

/* ===== FILA DE ENTREGAS PENDENTES (modo offline) ===== */

/** Tenta enviar todas as entregas pendentes pro servidor.
 *  Retorna { sucesso, falha } - quantas conseguiu e quantas não. */
async function processarFilaPendentes(progressCallback) {
  if (!supabaseClient) {
    throw new Error('Sem conexão com o servidor. Verifique sua internet.');
  }

  const pendentes = [...(state.entregasPendentes || [])];
  if (pendentes.length === 0) return { sucesso: 0, falha: 0 };

  let sucesso = 0;
  let falha = 0;
  const aindaPendentes = [];

  for (let i = 0; i < pendentes.length; i++) {
    const item = pendentes[i];
    if (progressCallback) progressCallback(i + 1, pendentes.length, item.pedidoId);

    try {
      // Converte base64 de volta pra Blob
      const blob = await fetch(item.fotoBase64).then(r => r.blob());
      const file = new File([blob], `${item.pedidoId}.jpg`, { type: 'image/jpeg' });

      // Faz upload
      const url = await dataLayer.fotos.upload(file, item.pedidoId);

      // Atualiza histórico no banco com a URL real (substituindo o base64)
      if (supabaseMode.historico) {
        try {
          const { error } = await supabaseClient
            .from('historico_entregas')
            .update({ comprovante_url: url })
            .eq('pedido_id', item.pedidoId);
          if (error) throw error;
        } catch (e) {
          console.warn('[Sync] Erro ao atualizar histórico:', e);
        }
      }

      // Atualiza no estado local também
      const h = state.historicoEntregas.find(x => x.pedidoId === item.pedidoId);
      if (h) h.comprovanteUrl = url;
      saveState();

      sucesso++;
    } catch (e) {
      console.error(`[Sync] Falha ao enviar ${item.pedidoId}:`, e);
      falha++;
      aindaPendentes.push({ ...item, tentativas: (item.tentativas || 1) + 1 });
    }
  }

  // Atualiza fila — só fica os que falharam
  state.entregasPendentes = aindaPendentes;
  saveState();

  return { sucesso, falha };
}

/** Botão "Enviar pendentes agora" — chamado pela UI. */
async function enviarPendentes() {
  if (!supabaseClient) {
    alert('❌ Sem conexão com o servidor.\n\nVerifique sua internet e tente de novo.');
    return;
  }

  const total = (state.entregasPendentes || []).length;
  if (total === 0) {
    alert('Não há entregas pendentes.');
    return;
  }

  // Modal de progresso
  abrirModal({
    titulo: `Enviando ${total} entrega(s) pendente(s)...`,
    body: `
      <div id="sync_progress" style="text-align:center;padding:20px;">
        <div style="font-size:32px;">⏳</div>
        <div id="sync_msg" style="font-size:14px;color:var(--ink-2);margin-top:10px;">Iniciando...</div>
        <div style="margin-top:14px;background:var(--surface-2);border-radius:8px;height:8px;overflow:hidden;">
          <div id="sync_bar" style="height:100%;background:var(--accent);width:0%;transition:width 0.3s;"></div>
        </div>
      </div>
    `,
    actions: []
  });

  try {
    const resultado = await processarFilaPendentes((atual, totalProg, pedidoId) => {
      const pct = Math.round(atual / totalProg * 100);
      const msg = document.getElementById('sync_msg');
      const bar = document.getElementById('sync_bar');
      if (msg) msg.textContent = `Enviando ${pedidoId} (${atual} de ${totalProg})...`;
      if (bar) bar.style.width = pct + '%';
    });

    fecharModal();

    if (resultado.falha === 0) {
      alert(`✓ Tudo sincronizado!\n${resultado.sucesso} entrega(s) enviada(s) com sucesso.`);
    } else if (resultado.sucesso === 0) {
      alert(`❌ Falha ao enviar.\nTodas as ${resultado.falha} entrega(s) falharam.\n\nVerifique sua conexão e tente novamente.`);
    } else {
      alert(`⚠ Parcialmente enviado.\n✓ ${resultado.sucesso} enviada(s)\n❌ ${resultado.falha} ainda pendente(s)\n\nTente de novo em instantes.`);
    }

    render();
  } catch (e) {
    fecharModal();
    alert(`❌ Erro: ${e.message}`);
  }
}

/** Detecta quando o navegador volta a ficar online e sugere sync. */
window.addEventListener('online', () => {
  // Se há pendentes, mostra notificação
  if (state.entregasPendentes && state.entregasPendentes.length > 0) {
    setTimeout(() => render(), 500); // re-render pra atualizar banner
  }
});
window.addEventListener('offline', () => {
  setTimeout(() => render(), 500);
});

/** Captura retorno do OAuth Bling em pop-up.
 *  Quando o Bling redireciona pra raiz com ?code=...&state=malba2026|<contaId>,
 *  esta janela manda o code de volta pra janela mãe via postMessage e fecha sozinha.
 */
(function capturarRetornoOAuthBling() {
  try {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const stateParam = params.get('state');
    // Só age se for retorno do Bling E for um pop-up (tem opener)
    if (!code || !stateParam || !stateParam.startsWith('malba2026')) return;
    if (!window.opener || window.opener.closed) return;

    window.opener.postMessage({
      tipo: 'bling-oauth-code',
      code,
      state: stateParam
    }, window.location.origin);

    // Limpa a URL pra não confundir se o user atualizar
    document.body.innerHTML = '<div style="padding:40px;font-family:system-ui;text-align:center;"><h2>✅ Autorização recebida!</h2><p style="color:#666;">Pode fechar esta janela.</p></div>';
    setTimeout(() => { try { window.close(); } catch {} }, 600);
  } catch (e) {
    console.warn('[OAuth Bling] erro ao processar retorno:', e);
  }
})();

async function motoristaOcorrencia(id) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;

  abrirModal({
    titulo: `Ocorrência · ${p.id}`,
    body: `
      <div style="font-size:13px;color:var(--ink-2);margin-bottom:14px;line-height:1.5;">
        Descreva a ocorrência (o que aconteceu) e escolha como prosseguir com o pedido de <strong>${p.cliente}</strong>:
      </div>

      <div class="field">
        <label>Observação <span style="color:var(--danger);">*</span></label>
        <textarea id="ocor_obs" rows="4" placeholder="Ex: Cliente recebeu mas estava faltando 2 caixas. Aguardando reposição..." style="font-family:inherit;resize:vertical;">${p.observacao || ''}</textarea>
        <div style="font-size:11px;color:var(--ink-3);margin-top:4px;">
          Mínimo 5 caracteres. Esse texto fica registrado no histórico do pedido.
        </div>
      </div>

      <div id="ocor_erro" style="color:var(--danger);font-size:12px;display:none;margin-bottom:8px;"></div>

      <div style="font-size:12px;color:var(--ink-2);margin-top:12px;margin-bottom:8px;font-weight:600;">
        Como deseja prosseguir?
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn btn-primary" onclick="ocorrenciaEncerrarEntrega('${p.id}')" style="justify-content:flex-start;text-align:left;padding:12px 14px;">
          <div>
            <div style="font-weight:600;">✓ Encerrar entrega</div>
            <div style="font-size:11px;opacity:0.85;font-weight:400;margin-top:2px;">Foi entregue. Vai pedir foto do comprovante.</div>
          </div>
        </button>

        <button class="btn btn-secondary" onclick="ocorrenciaItensPendentes('${p.id}')" style="justify-content:flex-start;text-align:left;padding:12px 14px;">
          <div>
            <div style="font-weight:600;">📦 Itens pendentes</div>
            <div style="font-size:11px;color:var(--ink-2);font-weight:400;margin-top:2px;">Volta pra "Em expedição" sinalizando itens faltantes.</div>
          </div>
        </button>

        <button class="btn btn-secondary" onclick="ocorrenciaNaoEntregue('${p.id}')" style="justify-content:flex-start;text-align:left;padding:12px 14px;">
          <div>
            <div style="font-weight:600;">🚫 Não entregue</div>
            <div style="font-size:11px;color:var(--ink-2);font-weight:400;margin-top:2px;">Volta pra "Em expedição" pra reagendar.</div>
          </div>
        </button>
      </div>
    `,
    actions: [
      { label: 'Cancelar', cls: 'btn-secondary', onClick: fecharModal }
    ]
  });

  // Foco no textarea
  setTimeout(() => document.getElementById('ocor_obs')?.focus(), 100);
}

/** Valida observação obrigatória pra ocorrência. */
function validarObsOcorrencia() {
  const obs = (document.getElementById('ocor_obs')?.value || '').trim();
  const erro = document.getElementById('ocor_erro');
  if (!obs || obs.length < 5) {
    if (erro) {
      erro.textContent = 'Por favor, descreva a ocorrência (mínimo 5 caracteres).';
      erro.style.display = 'block';
    }
    return null;
  }
  return obs;
}

/** Caso A: Entregou COM observação → abre fluxo de foto, depois marca entregue + obs. */
async function ocorrenciaEncerrarEntrega(pedidoId) {
  const obs = validarObsOcorrencia();
  if (!obs) return;

  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;

  // Salva a observação no pedido antes de abrir captura
  p.observacao = obs;

  // Fecha o modal de ocorrência e abre o de captura de foto
  // (o fluxo de captura já cuida de marcar como entregue + foto)
  fecharModal();
  setTimeout(() => abrirCapturaComprovante(p), 200);
}

/** Caso B: Itens pendentes → volta pra expedição com flag. */
async function ocorrenciaItensPendentes(pedidoId) {
  const obs = validarObsOcorrencia();
  if (!obs) return;

  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;

  p.observacao = '[ITENS PENDENTES] ' + obs;
  p.status = 'expedicao';
  await dataLayer.pedidos.salvar(p);

  fecharModal();
  alert(`✓ Pedido ${p.id} voltou para "Em expedição" com aviso de itens pendentes. O gestor será notificado.`);
  render();
}

/** Caso C: Não entregue → volta pra expedição. */
async function ocorrenciaNaoEntregue(pedidoId) {
  const obs = validarObsOcorrencia();
  if (!obs) return;

  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;

  p.observacao = '[NÃO ENTREGUE] ' + obs;
  p.status = 'expedicao';
  await dataLayer.pedidos.salvar(p);

  fecharModal();
  alert(`✓ Pedido ${p.id} voltou para "Em expedição" para ser reagendado.`);
  render();
}

/* =====================================================================
   MODAL HELPER
   ===================================================================== */

function abrirModal({ titulo, body, actions }) {
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this)fecharModal()">
      <div class="modal">
        <div class="modal-head">
          <h3>${titulo}</h3>
          <button class="close-btn" onclick="fecharModal()">×</button>
        </div>
        <div class="modal-body">${body}</div>
        <div class="modal-foot">
          ${actions.map((a,i) => `<button class="btn ${a.cls}" data-act="${i}">${a.label}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
  root.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => actions[parseInt(btn.dataset.act)].onClick());
  });
}

function fecharModal() {
  document.getElementById('modalRoot').innerHTML = '';
}

/* =====================================================================
   INIT
   ===================================================================== */

// Renderiza a interface imediatamente com dados locais
render();

// Se algum modo Supabase está ativo, sincroniza em background
// (sem bloquear a renderização inicial — usuário vê dados locais primeiro,
// depois os do servidor sobrescrevem se houver atualização)
if (supabaseClient) {
  (async () => {
    try {
      if (supabaseMode.pedidos)    await dataLayer.pedidos.sincronizar();
      if (supabaseMode.motoristas) await dataLayer.motoristas.sincronizar();
      if (supabaseMode.veiculos)   await dataLayer.veiculos.sincronizar();
      if (supabaseMode.config)     await dataLayer.config.sincronizar();
      if (supabaseMode.historico)  await dataLayer.historico.sincronizar();
      if (supabaseMode.custos)     await dataLayer.custos.sincronizar();
      try { await dataLayer.entregasMotoristas.sincronizar(); } catch {}
      try { await circularesAPI.listar(); } catch {}
      // Re-render se algo mudou
      if (Object.values(supabaseMode).some(Boolean)) render();

      // Auto-sync: se o gestor deixou ligado, inicia o timer agora
      // (precisa esperar o supabaseClient + supabaseMode.pedidos estarem prontos)
      if (autoSyncEstaAtivo()) {
        iniciarAutoSyncBling();
      }
    } catch (e) {
      console.warn('Falha ao sincronizar com Supabase no boot:', e);
    }

    // Se está online e há pendências, oferece sync após 2 segundos
    // (pequeno delay pra não interromper o boot e dar tempo do user logar)
    setTimeout(() => {
      const pend = (state.entregasPendentes || []).length;
      if (pend > 0 && navigator.onLine && perfilAtivo) {
        if (confirm(`Você tem ${pend} entrega(s) pendente(s) de envio.\n\nDeseja enviar agora?`)) {
          enviarPendentes();
        }
      }
    }, 2000);
  })();
}

<!-- ===================== PWA — Registro do Service Worker =====================
     Registra o service-worker.js que torna o painel instalável como app.
     Estratégia network-first: sempre busca versão nova, cache só como fallback offline.
     Se o registro falhar (navegador antigo, etc), o painel funciona normalmente
     como site — PWA é progressivo, não quebra nada se não suportar.
-->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => {
          console.log('[PWA] Service Worker registrado:', reg.scope);
          // Detecta quando uma versão nova do SW está disponível
          reg.addEventListener('updatefound', () => {
            const novoSW = reg.installing;
            if (!novoSW) return;
            novoSW.addEventListener('statechange', () => {
              if (novoSW.state === 'activated') {
                console.log('[PWA] Nova versão do app ativada.');
              }
            });
          });
        })
        .catch(err => console.warn('[PWA] Falha ao registrar Service Worker:', err));
    });
  }
</script>

      </div>
      <div class="modal-circular-body">
        <label class="modal-circular-label">Título (opcional)</label>
        <input type="text" id="circ-titulo" class="modal-circular-input"
               placeholder="Ex: Reunião de equipe" value="${editando ? escapeHtml(editando.titulo || '') : ''}">

        <label class="modal-circular-label">Mensagem</label>
        <textarea id="circ-texto" class="modal-circular-textarea" rows="4"
                  placeholder="Escreva o aviso aqui...">${editando ? escapeHtml(editando.texto || '') : ''}</textarea>

        <label class="modal-circular-label">Tipo</label>
        <select id="circ-cor" class="modal-circular-input">
          <option value="normal" ${editando && editando.cor === 'normal' ? 'selected' : ''}>🔵 Aviso normal</option>
          <option value="urgente" ${editando && editando.cor === 'urgente' ? 'selected' : ''}>🔴 Urgente</option>
        </select>

        <div class="modal-circular-datas">
          <div>
            <label class="modal-circular-label">Data do aviso</label>
            <input type="date" id="circ-data" class="modal-circular-input"
                   value="${editando ? editando.data_aviso : hoje}">
          </div>
          <div>
            <label class="modal-circular-label">Disponível até</label>
            <input type="date" id="circ-expira" class="modal-circular-input"
                   value="${editando && editando.expira_em ? editando.expira_em : ''}">
          </div>
        </div>
        <p class="modal-circular-dica">Depois da data "disponível até", o aviso some do mural automaticamente. Deixe em branco para um aviso permanente.</p>
      </div>
      <div class="modal-circular-rodape">
        <button onclick="fecharFormCircular()" class="btn-modal-secondario">Cancelar</button>
        <button onclick="salvarCircular('${id || ''}')" class="btn-modal-primario">
          ${editando ? '<span class="btn-modal-icone">✓</span> Salvar alterações' : '<span class="btn-modal-icone">📣</span> Publicar aviso'}
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', ev => { if (ev.target === modal) fecharFormCircular(); });
}

function fecharFormCircular() {
  const m = document.getElementById('modal-circular');
  if (m) m.remove();
}

async function salvarCircular(id) {
  const titulo = document.getElementById('circ-titulo').value.trim();
  const texto = document.getElementById('circ-texto').value.trim();
  const cor = document.getElementById('circ-cor').value;
  const dataAviso = document.getElementById('circ-data').value;
  const expira = document.getElementById('circ-expira').value;

  if (!texto) {
    alert('Escreva a mensagem do aviso.');
    return;
  }
  if (!dataAviso) {
    alert('Informe a data do aviso.');
    return;
  }
  if (expira && expira < dataAviso) {
    alert('A data "disponível até" não pode ser antes da data do aviso.');
    return;
  }

  const circular = {
    id: id || undefined,
    titulo,
    texto,
    cor,
    data_aviso: dataAviso,
    expira_em: expira || null,
  };

  const ok = await circularesAPI.salvar(circular);
  if (ok) {
    fecharFormCircular();
    if (currentView === 'home') {
      const app = document.getElementById('app');
      if (app) { app.innerHTML = renderHome(); bindHomeEvents(); }
    }
  }
}

async function excluirCircular(id) {
  if (!confirm('Tem certeza que deseja excluir este aviso? Esta ação não pode ser desfeita.')) {
    return;
  }
  const ok = await circularesAPI.excluir(id);
  if (ok && currentView === 'home') {
    const app = document.getElementById('app');
    if (app) { app.innerHTML = renderHome(); bindHomeEvents(); }
  }
}

/** Filtro do Painel logístico.
 *  - busca: string de texto
 *  - status: filtrado por status do pedido
 *  - mesAno: 'AAAA-MM' — atualizado automaticamente pro mês vigente na 1a carga
 *  - foco: null (mostra tudo) | 'expedicao' | 'saiu' | 'entregue-hoje' | 'ocorrencia' | 'total'
 *    (foco vem de clique num card e restringe a lista a ele) */
let filtroExpedicao = {
  busca: '',
  status: 'todos',
  mesAno: (() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  })(),
  foco: null,
};
let pedidosSelecionados = new Set();

/** Helper: retorna true se `data` (ISO ou Date) cai no `mesAno` ('AAAA-MM'). */
function dataNoMesAno(data, mesAno) {
  if (!data || !mesAno) return false;
  const d = data instanceof Date ? data : new Date(data);
  if (isNaN(d.getTime())) return false;
  const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  return iso === mesAno;
}

/** Helper: retorna true se `data` (ISO ou Date) é HOJE. */
function ehHoje(data) {
  if (!data) return false;
  const d = data instanceof Date ? data : new Date(data);
  if (isNaN(d.getTime())) return false;
  const hoje = new Date();
  return d.getFullYear() === hoje.getFullYear() &&
         d.getMonth() === hoje.getMonth() &&
         d.getDate() === hoje.getDate();
}

/** Formata 'AAAA-MM' em label PT-BR: "Agosto 2026" */
function labelMesAno(mesAno) {
  const NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                 'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano, mes] = mesAno.split('-');
  return `${NOMES[parseInt(mes, 10) - 1]} ${ano}`;
}

/** Gera lista de meses pro dropdown: 6 meses anteriores + atual + 1 futuro. */
function mesesDropdownExpedicao() {
  const hoje = new Date();
  const meses = [];
  for (let offset = -6; offset <= 1; offset++) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() + offset, 1);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    meses.push({ iso, label: labelMesAno(iso) });
  }
  return meses.reverse(); // atual primeiro
}

/** Muda o mês selecionado no filtro. */
function trocarMesFiltroExpedicao(novoMesAno) {
  filtroExpedicao.mesAno = novoMesAno;
  filtroExpedicao.foco = null; // reset foco ao trocar mês
  render();
}

/** Toggle: clica num card → foca nele. Clica de novo → desfoca. */
function focarCardExpedicao(foco) {
  filtroExpedicao.foco = filtroExpedicao.foco === foco ? null : foco;
  render();
  // Após renderizar, faz scroll suave até a lista
  if (filtroExpedicao.foco) {
    setTimeout(() => {
      const alvo = document.querySelector('.expedicao-lista-titulo');
      if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

/** Renderiza o Kanban de 3 colunas do Painel logístico:
 *  1. Em expedição (aguardando saída)
 *  2. Em rota (motorista já saiu)
 *  3. Entregues (só do dia — evita lista crescer infinito) */
function renderKanbanExpedicao() {
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const amanha = new Date(hoje);
  amanha.setDate(hoje.getDate() + 1);

  const emExpedicao = state.pedidos.filter(p => p.status === 'expedicao');
  const emRota = state.pedidos.filter(p => p.status === 'saiu');
  // Entregues: só do dia atual, evita lista infinita
  const entreguesHoje = state.pedidos.filter(p => {
    if (p.status !== 'entregue') return false;
    // Se tem saiu_em ou dia definido, usamos pra filtrar
    return true; // por simplicidade, mostra todos os entregues em memória
  });

  const cardHtml = (p, incluiHora = false) => {
    const horaSaida = p.saiuEm ? new Date(p.saiuEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : null;
    return `
      <div class="kanban-exp-card" onclick="abrirEditarPedido('${p.id}')" title="Clique para editar">
        <div class="kanban-exp-num">${p.id}</div>
        <div class="kanban-exp-cliente">${escapeHtml(p.cliente || '(sem nome)')}</div>
        <div class="kanban-exp-meta">
          ${p.motorista ? `<span class="kanban-exp-badge badge-mot">${escapeHtml(p.motorista)}</span>` : ''}
          ${p.veiculo ? `<span class="kanban-exp-badge badge-veic">${getVeiculoLabel ? getVeiculoLabel(p.veiculo) : p.veiculo}</span>` : ''}
          ${horaSaida && incluiHora ? `<span class="kanban-exp-badge badge-hora">🕐 ${horaSaida}</span>` : ''}
          ${p.bairro && !p.motorista ? `<span class="kanban-exp-badge badge-loc">${escapeHtml(p.bairro)}</span>` : ''}
        </div>
      </div>
    `;
  };

  const truncar = (arr, n) => arr.slice(0, n);

  return `
    <div class="kanban-exp-wrap">
      <div class="kanban-exp-col col-expedicao">
        <div class="kanban-exp-header">
          <div class="kanban-exp-titulo">
            <span>📦</span> Em expedição
          </div>
          <span class="kanban-exp-count">${emExpedicao.length}</span>
        </div>
        <div class="kanban-exp-list">
          ${truncar(emExpedicao, 5).map(p => cardHtml(p, false)).join('') || '<div class="kanban-exp-vazio">Sem pedidos</div>'}
          ${emExpedicao.length > 5 ? `<div class="kanban-exp-mais">+ ${emExpedicao.length - 5} pedidos</div>` : ''}
        </div>
      </div>

      <div class="kanban-exp-col col-rota">
        <div class="kanban-exp-header">
          <div class="kanban-exp-titulo">
            <span>🚚</span> Em rota
          </div>
          <span class="kanban-exp-count">${emRota.length}</span>
        </div>
        <div class="kanban-exp-list">
          ${truncar(emRota, 5).map(p => cardHtml(p, true)).join('') || '<div class="kanban-exp-vazio">Ninguém em rota agora</div>'}
          ${emRota.length > 5 ? `<div class="kanban-exp-mais">+ ${emRota.length - 5} pedidos</div>` : ''}
        </div>
      </div>

      <div class="kanban-exp-col col-entregue">
        <div class="kanban-exp-header">
          <div class="kanban-exp-titulo">
            <span>✅</span> Entregues
          </div>
          <span class="kanban-exp-count">${entreguesHoje.length}</span>
        </div>
        <div class="kanban-exp-list">
          ${truncar(entreguesHoje, 5).map(p => cardHtml(p, true)).join('') || '<div class="kanban-exp-vazio">Nada entregue ainda</div>'}
          ${entreguesHoje.length > 5 ? `<div class="kanban-exp-mais">+ ${entreguesHoje.length - 5} entregas</div>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderExpedicao() {
  const mesAno = filtroExpedicao.mesAno;

  // ==== CÁLCULO DOS CARDS (regras que o usuário definiu) ====

  // 1. Em expedição: TODOS (independente de mês) — pedidos que ainda não saíram
  const listaEmExp = state.pedidos.filter(p => p.status === 'expedicao');
  const emExp = listaEmExp.length;

  // 2. Em rota (novo nome de "Saíram p/ entrega"): só do mês vigente
  //    Considera pedidos com status 'saiu' que tenham saido no mês selecionado.
  //    Se não tem saiu_em, usa criadoEm como fallback.
  const listaEmRota = state.pedidos.filter(p =>
    p.status === 'saiu' && dataNoMesAno(p.saiuEm || p.criadoEm, mesAno)
  );
  const emRota = listaEmRota.length;

  // 3. Entregues hoje: só do dia (usa histórico como fonte de verdade)
  //    O histórico registra a data real da entrega em `data`.
  const historicoHoje = (state.historicoEntregas || []).filter(h => ehHoje(h.data));
  const idsEntreguesHoje = new Set(historicoHoje.map(h => h.pedidoId));
  const listaEntreguesHoje = state.pedidos.filter(p => idsEntreguesHoje.has(p.id));
  const entreguesHoje = idsEntreguesHoje.size;

  // 4. Ocorrências: só do mês vigente
  const listaOcorrencias = state.pedidos.filter(p =>
    p.status === 'ocorrencia' && dataNoMesAno(p.criadoEm, mesAno)
  );
  const ocorrencias = listaOcorrencias.length;

  // 5. Total: total de entregas do mês vigente (histórico do mês)
  //    Fonte de verdade é o histórico, que registra todas as entregas concluídas.
  const listaTotalMes = (state.historicoEntregas || []).filter(h =>
    dataNoMesAno(h.data, mesAno)
  );
  const totalMes = listaTotalMes.length;

  // ==== LISTA DE PEDIDOS EMBAIXO ====
  // Regras:
  // - Se tem foco (clique em card), filtra pra aquela lista específica
  // - Senão, mostra TODOS os não-entregues (regra #5)
  // - Filtro de busca + status ainda funcionam
  let pedidos;
  if (filtroExpedicao.foco === 'expedicao') {
    pedidos = [...listaEmExp];
  } else if (filtroExpedicao.foco === 'saiu') {
    pedidos = [...listaEmRota];
  } else if (filtroExpedicao.foco === 'entregue-hoje') {
    pedidos = [...listaEntreguesHoje];
  } else if (filtroExpedicao.foco === 'ocorrencia') {
    pedidos = [...listaOcorrencias];
  } else if (filtroExpedicao.foco === 'total') {
    // Total = todos os pedidos que geraram entrega no mês
    const idsHist = new Set(listaTotalMes.map(h => h.pedidoId));
    pedidos = state.pedidos.filter(p => idsHist.has(p.id));
  } else {
    // Sem foco → mostra tudo exceto entregues (regra #5)
    pedidos = state.pedidos.filter(p => p.status !== 'entregue');
  }

  // Filtros adicionais (busca + status)
  if (filtroExpedicao.status !== 'todos') {
    pedidos = pedidos.filter(p => p.status === filtroExpedicao.status);
  }
  if (filtroExpedicao.busca) {
    const q = filtroExpedicao.busca.toLowerCase();
    pedidos = pedidos.filter(p =>
      p.id.toLowerCase().includes(q) ||
      p.cliente.toLowerCase().includes(q) ||
      (p.endereco || '').toLowerCase().includes(q)
    );
  }

  // Dropdown de mês/ano
  const meses = mesesDropdownExpedicao();
  const dropdown = `
    <div class="expedicao-mes-filtro">
      <label for="expedicao_mes" class="expedicao-mes-label">Mês vigente:</label>
      <select id="expedicao_mes" onchange="trocarMesFiltroExpedicao(this.value)">
        ${meses.map(m => `<option value="${m.iso}" ${m.iso === mesAno ? 'selected' : ''}>${m.label}</option>`).join('')}
      </select>
    </div>
  `;

  // Título dinâmico da lista embaixo (avisa qual foco tá ativo)
  const tituloLista = {
    'expedicao':      'Pedidos em expedição',
    'saiu':           'Pedidos em rota — ' + labelMesAno(mesAno),
    'entregue-hoje':  'Pedidos entregues hoje',
    'ocorrencia':     'Pedidos com ocorrência — ' + labelMesAno(mesAno),
    'total':          'Todas as entregas — ' + labelMesAno(mesAno),
  }[filtroExpedicao.foco] || 'Todos os pedidos ativos';

  return `
    <div class="page">
      <div class="page-header">
        <div>
          <h1 class="page-title">Painel logístico</h1>
          <div class="page-subtitle">Pedidos importados do Bling com situação "Expedição". Atribua motorista e atualize o status conforme o pedido sai e é entregue.</div>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary" onclick="abrirImportCSV()">↓ Importar do Bling</button>
          <button class="btn btn-primary" onclick="abrirNovoPedido()">+ Novo pedido</button>
        </div>
      </div>

      ${dropdown}

      <div class="kpi-grid">
        <div class="kpi accent ${filtroExpedicao.foco === 'expedicao' ? 'ativo' : ''}" onclick="focarCardExpedicao('expedicao')" style="cursor:pointer;">
          <div class="kpi-label">Em expedição</div>
          <div class="kpi-value">${emExp}</div>
          <div class="kpi-sub">aguardando saída</div>
        </div>
        <div class="kpi ${filtroExpedicao.foco === 'saiu' ? 'ativo' : ''}" onclick="focarCardExpedicao('saiu')" style="cursor:pointer;">
          <div class="kpi-label">Em rota</div>
          <div class="kpi-value">${emRota}</div>
          <div class="kpi-sub">em ${labelMesAno(mesAno)}</div>
        </div>
        <div class="kpi success ${filtroExpedicao.foco === 'entregue-hoje' ? 'ativo' : ''}" onclick="focarCardExpedicao('entregue-hoje')" style="cursor:pointer;">
          <div class="kpi-label">Entregues hoje</div>
          <div class="kpi-value">${entreguesHoje}</div>
          <div class="kpi-sub">só do dia</div>
        </div>
        <div class="kpi alert ${filtroExpedicao.foco === 'ocorrencia' ? 'ativo' : ''}" onclick="focarCardExpedicao('ocorrencia')" style="cursor:pointer;">
          <div class="kpi-label">Ocorrências</div>
          <div class="kpi-value">${ocorrencias}</div>
          <div class="kpi-sub">em ${labelMesAno(mesAno)}</div>
        </div>
        <div class="kpi ${filtroExpedicao.foco === 'total' ? 'ativo' : ''}" onclick="focarCardExpedicao('total')" style="cursor:pointer;">
          <div class="kpi-label">Total</div>
          <div class="kpi-value">${totalMes}</div>
          <div class="kpi-sub">entregas em ${labelMesAno(mesAno)}</div>
        </div>
      </div>

      <div class="expedicao-lista-titulo">
        <h2>${tituloLista}</h2>
        ${filtroExpedicao.foco ? `<button class="btn btn-secondary btn-sm" onclick="focarCardExpedicao(null)">✕ Limpar filtro</button>` : ''}
      </div>

      <div class="toolbar">
        <div class="search-box">
          <input id="buscaInput" type="text" placeholder="Buscar por cliente, pedido ou endereço..." value="${filtroExpedicao.busca}">
        </div>
        <button class="filter-chip ${filtroExpedicao.status==='todos'?'active':''}" data-status="todos">Todos</button>
        <button class="filter-chip ${filtroExpedicao.status==='expedicao'?'active':''}" data-status="expedicao">Em expedição</button>
        <button class="filter-chip ${filtroExpedicao.status==='saiu'?'active':''}" data-status="saiu">Em rota</button>
        <button class="filter-chip ${filtroExpedicao.status==='ocorrencia'?'active':''}" data-status="ocorrencia">Ocorrência</button>
      </div>

      ${pedidosSelecionados.size > 0 ? `
        <div class="bulk-bar">
          <div class="bulk-count">
            <strong>${pedidosSelecionados.size}</strong>
            pedido(s) selecionado(s)
            <button class="btn btn-clear btn-sm" onclick="limparSelecao()">Limpar seleção</button>
          </div>
          <div class="bulk-actions">
            <button class="btn btn-sm" onclick="bulkImprimirPDF()" title="Gerar PDF com os pedidos selecionados (1 por página)">📄 Imprimir PDF</button>
            <button class="btn btn-sm" onclick="bulkMarcarStatus('saiu')">→ Em rota</button>
            <button class="btn btn-sm" onclick="bulkMarcarStatus('entregue')">✓ Entregue</button>
            <button class="btn btn-danger btn-sm" onclick="bulkExcluir()">× Excluir selecionados</button>
          </div>
        </div>
      ` : ''}

      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="check-cell">

            </thead>
            <tbody>
              ${pedidos.length === 0 ? `

                  <h3>Nenhum pedido encontrado</h3>

              ` : pedidos.map(p => `
                <tr class="${pedidosSelecionados.has(p.id) ? 'selected' : ''}">
                  <td data-label="" class="check-cell">

      </div>

  `;

function bindExpedicaoEvents() {
  const buscaInput = document.getElementById('buscaInput');
  if (buscaInput) {
    buscaInput.addEventListener('input', (e) => {
      filtroExpedicao.busca = e.target.value;
      // re-render só do conteúdo da tabela seria ideal, mas full re-render é simples
      const app = document.getElementById('app');
      app.innerHTML = renderExpedicao();
      bindExpedicaoEvents();
      // restaura foco
      const inp = document.getElementById('buscaInput');
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
    });
  }
  document.querySelectorAll('.filter-chip[data-status]').forEach(b => {
    b.addEventListener('click', () => {
      filtroExpedicao.status = b.dataset.status;
      render();
    });
  });

  // Checkbox individual
  document.querySelectorAll('.row-check').forEach(chk => {
    chk.addEventListener('change', (e) => {
      e.stopPropagation();
      const id = chk.dataset.id;
      if (chk.checked) pedidosSelecionados.add(id);
      else pedidosSelecionados.delete(id);
      render();
    });
    // Não disparar abrirEditarPedido ao clicar no checkbox
    chk.addEventListener('click', (e) => e.stopPropagation());
  });

  // Checkbox "selecionar tudo" — seleciona apenas os filtrados visíveis
  const checkAll = document.getElementById('checkAll');
  if (checkAll) {
    checkAll.addEventListener('change', () => {
      const idsVisiveis = Array.from(document.querySelectorAll('.row-check')).map(c => c.dataset.id);
      if (checkAll.checked) {
        idsVisiveis.forEach(id => pedidosSelecionados.add(id));
      } else {
        idsVisiveis.forEach(id => pedidosSelecionados.delete(id));
      }
      render();
    });
  }
}

/* =====================================================================
   IMPRESSÃO EM LOTE — Pedidos selecionados em PDF
   ---------------------------------------------------------------------
   Gera uma nova janela com 1 pedido por página (formato A4 retrato),
   layout inspirado no Bling. Cada pedido tem: cabeçalho com logo Malba,
   número do pedido, data, dados do cliente/endereço, motorista/veículo,
   itens (qtd + valor), valor total e espaço pra observação/assinatura.
   Usa window.print() do navegador — o usuário escolhe "Salvar como PDF"
   ou imprime direto.
   ===================================================================== */
async function bulkImprimirPDF() {
  const n = pedidosSelecionados.size;
  if (n === 0) {
    alert('Selecione ao menos um pedido para imprimir.');
    return;
  }

  // Pega pedidos selecionados (mantém ordem que aparecem na tela)
  const pedidosParaImprimir = state.pedidos.filter(p => pedidosSelecionados.has(p.id));
  if (pedidosParaImprimir.length === 0) return;

  // Abre janela popup nova — usuário pode bloquear se não autorizar
  const win = window.open('', '_blank', 'width=900,height=1100');
  if (!win) {
    alert('Não foi possível abrir a janela de impressão. Verifique se o navegador está bloqueando pop-ups deste site e libere.');
    return;
  }

  // Logo da Malba já carregado no DOM (data URI). Pegamos a partir do <img.brand-logo>
  const logoImg = document.querySelector('.brand-logo');
  const logoSrc = logoImg ? logoImg.src : '';

  // Monta o HTML
  const dataAtual = new Date().toLocaleDateString('pt-BR');
  const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  const paginasHtml = pedidosParaImprimir.map((p, idx) => construirPaginaPedido(p, logoSrc)).join('');

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Pedidos · Malba Embalagens</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #111;
    background: #f5f5f5;
    -webkit-print-color-adjust: exact;

/** Monta o HTML de UMA página de pedido pra impressão. */
function construirPaginaPedido(p, logoSrc) {
  // Helpers de escape (a janela popup tem seu próprio escapeHtml?
  // Não — usamos uma versão local segura)
  const esc = (s) => {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  };

  const dataPedido = p.dia || '—';
  const cliente = esc(p.cliente || '(sem nome)');
  const endereco = esc(p.endereco || '(sem endereço)');
  const bairro = esc(p.bairro || '');
  const cidade = esc(p.cidade || '');
  const cep = esc(p.cep || '');
  const motorista = esc(p.motorista || '(não atribuído)');
  const veiculo = esc(p.veiculo || '(não atribuído)');
  const itensQtd = p.itens || 1;
  const valor = (p.valor || 0).toFixed(2).replace('.', ',');
  const observacao = esc(p.observacao || '');
  const numeroPedido = esc(p.id || '—');
  const statusLabel = {
    expedicao: 'EM EXPEDIÇÃO',
    saiu: 'SAIU PARA ENTREGA',
    entregue: 'ENTREGUE',
    ocorrencia: 'COM OCORRÊNCIA'
  }[p.status] || (p.status || '').toUpperCase();

  // Linha de endereço completa (bairro/cidade quando disponíveis)
  const enderecoCompleto = [endereco, bairro, cidade].filter(Boolean).join(' · ');

  return `
    <div class="pedido-pagina">
      <div class="ped-header">
        <div class="ped-header-esq">
          ${logoSrc ? `<img src="${logoSrc}" alt="Malba">` : '<div style="font-weight:700;font-size:20px">MALBA</div>'}
          <div class="empresa">Malba Embalagens · Painel de Expedição</div>
        </div>
        <div class="ped-header-dir">
          <div class="doc-tipo">Pedido de Venda</div>
          <div class="doc-num">${numeroPedido}</div>
          <div class="doc-data">${dataPedido} · ${statusLabel}</div>
        </div>
      </div>

      <div class="ped-secao">
        <div class="ped-secao-titulo">Cliente</div>
        <div class="ped-info-grid">
          <div class="ped-info-item">
            <div class="label">Nome</div>
            <div class="valor">${cliente}</div>
          </div>
          <div class="ped-info-item">
            <div class="label">Itens</div>
            <div class="valor">${itensQtd}</div>
          </div>
        </div>
      </div>

      <div class="ped-secao">
        <div class="ped-secao-titulo">Endereço de Entrega</div>
        <div class="ped-endereco">
          ${enderecoCompleto || '(sem endereço cadastrado)'}
          ${cep ? `<div class="cep">CEP: ${cep}</div>` : ''}
        </div>
      </div>

      <div class="ped-secao">
        <div class="ped-secao-titulo">Logística</div>
        <div class="ped-info-grid">
          <div class="ped-info-item">
            <div class="label">Motorista</div>
            <div class="valor">${motorista}</div>
          </div>
          <div class="ped-info-item">
            <div class="label">Veículo</div>
            <div class="valor">${veiculo}</div>
          </div>
        </div>
      </div>

      <div class="ped-secao">
        <div class="ped-secao-titulo">Itens do Pedido</div>
        ${(() => {
          const itensDet = Array.isArray(p.itensDetalhados) ? p.itensDetalhados : [];
          if (itensDet.length === 0) {
            // Fallback: pedido antigo sem itens detalhados ainda (pré-cache).
            // Mostra resumo agregado e avisa pra sincronizar de novo.
            return `
              <table class="ped-itens-tabela">
                <thead>
                  <tr>
                    <th>Descrição</th>
                    <th style="text-align:right">Qtd</th>
                    <th style="text-align:right">Valor Total</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Itens do pedido <span style="color:#a16207;font-size:9px">(sincronize novamente para detalhar)</span></td>
                    <td class="num">${itensQtd}</td>
                    <td class="num">R$ ${valor}</td>
                  </tr>
                </tbody>
              </table>`;
          }
          // Pedido com itens detalhados — mostra cada um com descrição e SKU
          const linhas = itensDet.map(item => {
            const codigo = esc(item.codigo || '—');
            const descricao = esc(item.descricao || '(sem descrição)');
            const qtd = (item.quantidade || 0).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
            const unidade = esc(item.unidade || '');
            const valorUnit = (item.valor || 0).toFixed(2).replace('.', ',');
            const valorTotal = ((item.valor || 0) * (item.quantidade || 0)).toFixed(2).replace('.', ',');
            return `
              <tr>
                <td>
                  <div style="font-weight:500">${descricao}</div>
                  <div style="font-size:9px;color:#888;font-family:ui-monospace,monospace;margin-top:1px">SKU: ${codigo}</div>
                </td>
                <td class="num">${qtd}${unidade ? ' ' + unidade : ''}</td>
                <td class="num">R$ ${valorUnit}</td>
                <td class="num">R$ ${valorTotal}</td>
              </tr>`;
          }).join('');

          return `
            <table class="ped-itens-tabela">
              <thead>
                <tr>
                  <th>Descrição / SKU</th>
                  <th style="text-align:right">Qtd</th>
                  <th style="text-align:right">Vlr Unit.</th>
                  <th style="text-align:right">Subtotal</th>
                </tr>
              </thead>
              <tbody>${linhas}</tbody>
            </table>`;
        })()}
        <div class="ped-total">
          <span class="ped-total-label">Valor total do pedido</span>
          <span class="ped-total-valor">R$ ${valor}</span>
        </div>
      </div>

      ${observacao ? `
      <div class="ped-secao">
        <div class="ped-secao-titulo">Observação</div>
        <div class="ped-obs">${observacao}</div>
      </div>` : ''}

      <div class="ped-recibo">
        <div class="ped-recibo-grid">
          <div>
            <div class="ped-assinatura-box"></div>
            <div class="ped-recibo-label">Assinatura do recebedor</div>
          </div>
          <div>
            <div class="ped-assinatura-box"></div>
            <div class="ped-recibo-label">Data / Hora</div>
          </div>
        </div>
      </div>

      <div class="ped-rodape">
        Documento gerado pelo Painel de Expedição Malba Embalagens
      </div>
    </div>
  `;
}

async function bulkExcluir() {
  const n = pedidosSelecionados.size;
  if (n === 0) return;
  if (!confirm(`Excluir ${n} pedido(s) selecionado(s)? Esta ação não pode ser desfeita.`)) return;
  const ids = Array.from(pedidosSelecionados);
  await dataLayer.pedidos.excluirVarios(ids);
  pedidosSelecionados.clear();
  render();
}

async function bulkMarcarStatus(novoStatus) {
  const n = pedidosSelecionados.size;
  if (n === 0) return;
  const labels = { saiu: 'Saiu p/ entrega', entregue: 'Entregue' };
  if (!confirm(`Marcar ${n} pedido(s) como "${labels[novoStatus]}"?`)) return;
  const pedidosAfetados = state.pedidos.filter(p => pedidosSelecionados.has(p.id));
  for (const p of pedidosAfetados) {
    const statusAnterior = p.status;
    p.status = novoStatus;
    if (novoStatus === 'entregue' && statusAnterior !== 'entregue') {
      await registrarEntregaNoHistorico(p);
    }
    await dataLayer.pedidos.salvar(p);
  }
  pedidosSelecionados.clear();
  render();
}

function abrirNovoPedido() {
  const novoId = 'P-' + (1100 + state.pedidos.length);
  const p = { id: novoId, cliente: '', endereco: '', itens: 1, valor: 0, status: 'expedicao', motorista: '', veiculo: '', dia: '', observacao: '' };
  state.pedidos.push(p);
  abrirEditarPedido(novoId);
}

async function salvarPedido(id) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  const statusAnterior = p.status;
  p.cliente = document.getElementById('f_cliente').value.trim() || '(sem nome)';
  p.endereco = document.getElementById('f_endereco').value.trim();
  p.bairro = document.getElementById('f_bairro').value.trim();
  p.cidade = document.getElementById('f_cidade').value.trim();
  p.cep = document.getElementById('f_cep').value.replace(/\D/g, '');
  p.itens = parseInt(document.getElementById('f_itens').value) || 0;
  p.valor = parseFloat(document.getElementById('f_valor').value) || 0;
  p.motorista = document.getElementById('f_motorista').value;
  p.veiculo = document.getElementById('f_veiculo').value;
  p.dia = document.getElementById('f_dia').value;
  p.status = document.getElementById('f_status').value;
  p.observacao = document.getElementById('f_obs').value.trim();
  // Se virou entregue agora, registra no histórico permanente
  if (p.status === 'entregue' && statusAnterior !== 'entregue') {
    await registrarEntregaNoHistorico(p);
  }
  await dataLayer.pedidos.salvar(p);
  fecharModal();
  render();
}

/* =====================================================================
   BUSCA DE CEP (ViaCEP - grátis, sem chave)
   ===================================================================== */
async function buscarCEP() {
  const cep = document.getElementById('f_cep').value.replace(/\D/g, '');
  if (cep.length !== 8) { alert('CEP inválido. Use 8 dígitos.'); return; }
  try {
    const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const d = await r.json();
    if (d.erro) { alert('CEP não encontrado.'); return; }
    if (!document.getElementById('f_endereco').value.trim()) {
      document.getElementById('f_endereco').value = d.logradouro || '';
    }
    document.getElementById('f_bairro').value = d.bairro || '';
    document.getElementById('f_cidade').value = d.localidade || '';
  } catch(e) {
    alert('Erro ao buscar CEP. Verifique sua conexão.');
  }
}

async function excluirPedido(id) {
  if (!confirm('Excluir este pedido?')) return;
  await dataLayer.pedidos.excluir(id);
  fecharModal();
  render();
}

async function excluirPedidoDireto(id) {

/* =====================================================================
   ANEXOS PDF
   ===================================================================== */

function anexarPDF(pedidoId, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.type !== 'application/pdf') {
    alert('Por favor, selecione um arquivo PDF.');
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    if (!confirm(`Este PDF tem ${(file.size/1024/1024).toFixed(1)}MB. Arquivos grandes podem deixar o sistema lento. Continuar?`)) {
      input.value = '';
      return;
    }
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const p = state.pedidos.find(x => x.id === pedidoId);
    if (!p) return;
    p.pdfData = e.target.result;
    p.pdfNome = file.name;
    try {
      saveState();

      const container = document.getElementById('f_pdf_container');

      delete p.pdfNome;
    }
  };
  reader.readAsDataURL(file);
}

async function processarArquivoImport(input) {
  const file = input.files[0];
  if (!file) return;
  const previewEl = document.getElementById('import_preview');
  previewEl.innerHTML = '<div style="padding:14px;color:var(--ink-2);font-size:13px;">Processando arquivo...</div>';

  try {
    const ext = file.name.split('.').pop().toLowerCase();
    let headers = [];
    let rows = [];

    if (ext === 'csv') {
      const text = await file.text();
      const parsed = parsearCSV(text);
      headers = parsed.headers;
      rows = parsed.rows;
    } else if (ext === 'xlsx' || ext === 'xls') {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      if (data.length === 0) throw new Error('Planilha vazia');
      headers = data[0].map(h => String(h || '').trim());
      rows = data.slice(1).filter(r => r.some(c => String(c || '').trim()));
    } else {
      throw new Error('Formato não suportado. Use CSV, XLSX ou XLS.');
    }

    if (rows.length === 0) {
      previewEl.innerHTML = '<div class="rota-warning">Arquivo não tem linhas de dados.</div>';
      return;
    }

    // Detectar colunas automaticamente
    const mapeamento = detectarColunas(headers);

    importPreviewData = { headers, rows, mapeamento, nomeArquivo: file.name };
    renderPreviewImport();
  } catch (err) {
    previewEl.innerHTML = `<div class="rota-warning">Erro ao ler arquivo: ${err.message}</div>`;
    importPreviewData = null;
  }
}

/**
 * Parser CSV simples que respeita aspas e vírgulas dentro de campos.
 * Detecta separador automaticamente entre vírgula e ponto-e-vírgula.
 */
function parsearCSV(text) {
  // Remover BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const linhas = text.split(/\r?\n/).filter(l => l.trim());
  if (linhas.length === 0) return { headers: [], rows: [] };

  // Detectar separador (vírgula ou ponto-e-vírgula)
  const primeiraLinha = linhas[0];
  const sep = (primeiraLinha.split(';').length > primeiraLinha.split(',').length) ? ';' : ',';

  const parseLinha = (linha) => {
    const result = [];
    let atual = '';
    let dentroAspas = false;
    for (let i = 0; i < linha.length; i++) {
      const c = linha[i];
      if (c === '"') {
        if (dentroAspas && linha[i+1] === '"') { atual += '"'; i++; }
        else dentroAspas = !dentroAspas;
      } else if (c === sep && !dentroAspas) {
        result.push(atual.trim());
        atual = '';
      } else {
        atual += c;
      }
    }
    result.push(atual.trim());
    return result;
  };

  const headers = parseLinha(linhas[0]);
  const rows = linhas.slice(1).map(parseLinha).filter(r => r.some(c => c));
  return { headers, rows };
}

/**
 * Detecta automaticamente quais colunas correspondem aos campos do pedido.
 * Otimizado pro CSV do Bling, mas funciona com variações.
 *
 * O Bling exporta DOIS endereços: "Endereço Comprador" e "Endereço Entrega".
 * Sempre que disponível, preferimos o de Entrega (e fallback pro Comprador).
 */
function detectarColunas(headers) {
  const norm = (s) => String(s || '').toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');

  const headersN = headers.map(norm);

  // acharPrimeiro: encontra o ÍNDICE da PRIMEIRA coluna cujo nome (normalizado)
  // contém TODOS os termos da busca. Tenta cada padrão na ordem.
  const acharPrimeiro = (...padroes) => {
    for (const p of padroes) {
      const termos = Array.isArray(p) ? p : [p];
      const idx = headersN.findIndex(h => termos.every(t => h.includes(t)));
      if (idx !== -1) return idx;
    }
    return -1;
  };

  return {
    numero:      acharPrimeiro('numeropedido', 'numpedido', 'numero', 'pedido', 'codigo'),

    // Nome: prefere Nome Entrega, mas faz fallback pra Nome Comprador no consolidador
    nomeEntrega:    acharPrimeiro('nomeentrega'),
    nomeComprador:  acharPrimeiro('nomecomprador', 'cliente', 'destinatario', 'razaosocial', 'nome'),

    // Endereço de ENTREGA (preferido)
    enderecoEntrega:    acharPrimeiro('enderecoentrega'),
    numeroEntrega:      acharPrimeiro(['numero','entrega']),
    bairroEntrega:      acharPrimeiro('bairroentrega'),
    cidadeEntrega:      acharPrimeiro('cidadeentrega'),
    cepEntrega:         acharPrimeiro('cepentrega'),
    complementoEntrega: acharPrimeiro('complementoentrega'),
    ufEntrega:          acharPrimeiro('ufentrega'),

    // Endereço do COMPRADOR (fallback)
    enderecoComprador:    acharPrimeiro('enderecocomprador', 'endereco', 'logradouro', 'rua'),
    numeroComprador:      acharPrimeiro(['numero','comprador'], 'numendereco'),
    bairroComprador:      acharPrimeiro('bairrocomprador', 'bairro'),
    cidadeComprador:      acharPrimeiro('cidadecomprador', 'cidade', 'municipio'),
    cepComprador:         acharPrimeiro('cepcomprador', 'cep'),
    complementoComprador: acharPrimeiro('complementocomprador', 'complemento'),
    ufComprador:          acharPrimeiro('ufcomprador', 'uf', 'estado'),

    quantidade: acharPrimeiro('quantidade', 'qtde', 'qtd'),
    valor:      acharPrimeiro('totalpedido', 'valortotal', 'total', 'valor'),
    obs:        acharPrimeiro('observacoes', 'observacao', 'obs'),
    telefone:   acharPrimeiro('celularcomprador', 'telefonecomprador', 'celular', 'telefone'),
    produto:    acharPrimeiro('produto', 'descricao', 'item')
  };
}

  // Detectar se está usando endereço de entrega ou de comprador

  const usaEnderecoComprador = mapeamento.enderecoComprador >= 0;

  if (mapeamento.nomeEntrega >= 0 && mapeamento.nomeComprador >= 0)

  else if (mapeamento.nomeEntrega >= 0)

  else if (mapeamento.nomeComprador >= 0)

  else if (usaEnderecoComprador)camposDetectados.push(`<strong>Endereço</strong>: ${headers[mapeamento.enderecoComprador]}`);
  if (mapeamento.cepEntrega >= 0 || mapeamento.cepComprador >= 0) camposDetectados.push(`<strong>CEP</strong>: ✓`);
  if (mapeamento.valor >= 0)    camposDetectados.push(`<strong>Valor</strong>: ${headers[mapeamento.valor]}`);

  const camposFaltando = [];

    </div>

    ${camposDetectados.length > 0 ? `
      <div style="background:var(--surface-2);padding:12px;border-radius:var(--radius);font-size:12px;margin-bottom:10px;line-height:1.7;">

    <div style="border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:240px;">
      <table style="font-size:12px;">

/**
 * Agrupa linhas pelo número do pedido. O Bling exporta uma linha por produto,
 * então um pedido com 3 produtos = 3 linhas no CSV. Aqui consolidamos.
 */
function agruparPorPedido(rows, mapeamento) {
  const grupos = {};
  for (let i = 0; i < rows.length; i++) {
    const cols = rows[i];
    const numero = mapeamento.numero >= 0 ? String(cols[mapeamento.numero] || '').trim() : '';
    const chave = numero || `__sem_numero_${i}`; // se não tiver número, cada linha vira um pedido
    if (!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(cols);
  }
  return grupos;
}

/**
 * Consolida múltiplas linhas (produtos) em um único pedido.
 * Aplica fallback de endereço (Entrega → Comprador) e formata valor BR.
 */
function consolidarPedido(linhas, mapeamento) {
  const primeira = linhas[0];
  const get = (idx) => idx >= 0 ? String(primeira[idx] || '').trim() : '';
  const getValorBR = (idx) => {
    const raw = get(idx);
    if (!raw) return 0;
    // "1.658,70000" → 1658.70  |  "R$ 1.250,00" → 1250.00
    const limpo = raw.replace(/[^\d,.-]/g, '');
    // Se tem vírgula, é formato BR (ponto = milhar, vírgula = decimal)
    if (limpo.includes(',')) {
      return parseFloat(limpo.replace(/\./g, '').replace(',', '.')) || 0;
    }
    return parseFloat(limpo) || 0;
  };

  // ID do pedido
  let id = get(mapeamento.numero);
  if (id && !id.startsWith('P-') && !id.startsWith('IMP-')) id = `P-${id}`;
  if (!id) id = `IMP-${Date.now()}`;

  // Limpa valores "lixo" que o Bling às vezes exporta (ex: "false" como complemento)
  const limparLixo = (v) => {
    if (!v) return '';
    const lower = v.toLowerCase().trim();
    if (lower === 'false' || lower === 'null' || lower === 'undefined' || lower === '0') return '';
    return v;
  };

  // Cliente: prefere "Nome Entrega" se preenchido, senão "Nome Comprador"
  const nomeEntrega = limparLixo(get(mapeamento.nomeEntrega));
  const nomeComprador = limparLixo(get(mapeamento.nomeComprador));
  const cliente = nomeEntrega || nomeComprador || '(sem nome)';

  // Endereço: prefere ENTREGA, fallback pro COMPRADOR
  const enderecoEntrega = limparLixo(get(mapeamento.enderecoEntrega));
  const usaEntrega = enderecoEntrega.length > 0;

  const endereco = usaEntrega ? enderecoEntrega : limparLixo(get(mapeamento.enderecoComprador));
  const numeroEnd = limparLixo(usaEntrega ? get(mapeamento.numeroEntrega) : get(mapeamento.numeroComprador));
  const complemento = limparLixo(usaEntrega ? get(mapeamento.complementoEntrega) : get(mapeamento.complementoComprador));
  const bairro = limparLixo(usaEntrega ? get(mapeamento.bairroEntrega) : get(mapeamento.bairroComprador));
  const cidade = limparLixo(usaEntrega ? get(mapeamento.cidadeEntrega) : get(mapeamento.cidadeComprador));
  const cep = (usaEntrega ? get(mapeamento.cepEntrega) : get(mapeamento.cepComprador)).replace(/\D/g, '');
  const uf = limparLixo(usaEntrega ? get(mapeamento.ufEntrega) : get(mapeamento.ufComprador));

  // Endereço completo formatado
  const partesEndereco = [];
  if (endereco) {
    let linha = endereco;
    if (numeroEnd) linha += `, ${numeroEnd}`;
    partesEndereco.push(linha);
  }
  if (complemento) partesEndereco.push(complemento);
  const enderecoCompleto = partesEndereco.join(' - ');

  // Itens: número de produtos diferentes (linhas)
  const itens = linhas.length;

  // Valor: pega "Total Pedido" da primeira linha (igual em todas)
  const valor = getValorBR(mapeamento.valor);

  // Observação: junta observações + lista de produtos como referência
  const obs = get(mapeamento.obs);
  const produtos = mapeamento.produto >= 0
    ? linhas.map(l => String(l[mapeamento.produto] || '').trim()).filter(Boolean)
    : [];

  let observacaoFinal = obs;
  if (produtos.length > 0) {
    const listaProd = produtos.length === 1
      ? produtos[0]
      : produtos.map((p, i) => `${i+1}. ${p}`).join(' | ');
    observacaoFinal = obs
      ? `${obs}\n\nProdutos: ${listaProd}`
      : `Produtos: ${listaProd}`;
  }

  return {
    id, cliente, endereco, numeroEnd, complemento, bairro, cidade, cep, uf,
    enderecoCompleto: [enderecoCompleto, bairro, cidade && uf ? `${cidade}/${uf}` : cidade].filter(Boolean).join(' · '),
    itens, valor,
    telefone: get(mapeamento.telefone),
    observacao: observacaoFinal,
    usouEnderecoEntrega: usaEntrega
  };
}

async function confirmarImport() {
  if (!importPreviewData) {
    alert('Selecione um arquivo primeiro.');
    return;
  }
  const { rows, mapeamento } = importPreviewData;
  const grupos = agruparPorPedido(rows, mapeamento);

  let importados = 0;
  let pulados = 0;

  for (const chave of Object.keys(grupos)) {
    const consolidado = consolidarPedido(grupos[chave], mapeamento);

    if (state.pedidos.some(p => p.id === consolidado.id)) {
      pulados++;
      continue;
    }

    // Endereço completo na coluna principal
    let enderecoFinal = consolidado.endereco;
    if (consolidado.numeroEnd) enderecoFinal += `, ${consolidado.numeroEnd}`;
    if (consolidado.complemento) enderecoFinal += ` (${consolidado.complemento})`;

    const novoPedido = {
      id: consolidado.id,
      cliente: consolidado.cliente,
      endereco: enderecoFinal,
      bairro: consolidado.bairro,
      cidade: consolidado.cidade,
      cep: consolidado.cep,
      itens: consolidado.itens,
      valor: consolidado.valor,
      status: 'expedicao',
      motorista: '',
      veiculo: '',
      dia: '',
      observacao: consolidado.observacao,
      criadoEm: new Date().toISOString().slice(0,10)
    };

    await dataLayer.pedidos.salvar(novoPedido);
    importados++;
  }

  importPreviewData = null;
  fecharModal();

  let msg = `✓ ${importados} pedido(s) importado(s) do Bling.`;
  if (pulados > 0) msg += `\n${pulados} pulado(s) (já existiam no sistema).`;
  alert(msg);
  render();
}

/**
 * Heurística do "vizinho mais próximo" usando CEP como proxy de proximidade.
 * Em SP, CEPs próximos numericamente tendem a estar geograficamente próximos
 * dentro da mesma região postal. É uma aproximação - não substitui a Google
 * Directions API - mas funciona razoavelmente bem para roteamento intracidade.
 */
function ordenarRotaPorProximidade(pedidos, cepOrigem) {
  if (pedidos.length === 0) return [];
  const semCep = pedidos.filter(p => !p.cep || p.cep.length < 5);
  const comCep = pedidos.filter(p => p.cep && p.cep.length >= 5);

  // Nearest neighbor: começa do CEP de origem, vai pegando o mais próximo
  const ordenados = [];
  let atual = parseInt(cepOrigem) || 0;
  const restantes = comCep.slice();

  while (restantes.length > 0) {
    let melhorIdx = 0;
    let menorDist = Infinity;
    for (let i = 0; i < restantes.length; i++) {
      const cepDest = parseInt(restantes[i].cep) || 0;
      const dist = Math.abs(cepDest - atual);
      if (dist < menorDist) {
        menorDist = dist;
        melhorIdx = i;
      }
    }
    const proximo = restantes.splice(melhorIdx, 1)[0];
    ordenados.push(proximo);
    atual = parseInt(proximo.cep) || atual;
  }

  // Pedidos sem CEP vão pro final (precisam ser cadastrados)
  return [...ordenados, ...semCep];
}

function gerarUrlGoogleMaps(origem, paradas) {
  // Google Maps URL: https://www.google.com/maps/dir/?api=1&origin=...&destination=...&waypoints=...
  // Limite prático: ~9 waypoints + destino = 10 paradas por URL
  if (paradas.length === 0) return null;

  const formatar = (p) => {
    const partes = [p.endereco, p.bairro, p.cidade, p.cep].filter(Boolean);
    return encodeURIComponent(partes.join(', '));
  };
  const origemEnc = encodeURIComponent(origem);

  if (paradas.length === 1) {
    return `https://www.google.com/maps/dir/?api=1&origin=${origemEnc}&destination=${formatar(paradas[0])}&travelmode=driving`;
  }

  // Última parada vira destino, as do meio viram waypoints
  const destino = paradas[paradas.length - 1];
  const waypoints = paradas.slice(0, -1).map(formatar).join('|');
  return `https://www.google.com/maps/dir/?api=1&origin=${origemEnc}&destination=${formatar(destino)}&waypoints=${waypoints}&travelmode=driving`;
}

function gerarUrlIndividual(parada) {
  const partes = [parada.endereco, parada.bairro, parada.cidade, parada.cep].filter(Boolean);
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(partes.join(', '))}&travelmode=driving`;
}

      ${segmentos.length === 1 ? `

          const pontoInicio = i === 0 ? PONTO_SAIDA.endereco : [seg[0].endereco, seg[0].bairro, seg[0].cidade].filter(Boolean).join(', ');

}

function bindRotasEvents() {
  document.querySelectorAll('.motorista-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      rotaMotoristaSelecionado = tab.dataset.motorista;
      render();
    });
  });

  // Ativa drag & drop pra reordenar paradas (só gestor)
  ativarReordenacaoPorArrastar();

  // Inicializa mapa Leaflet do GESTOR (se container existe)
  if (typeof L !== 'undefined' && document.getElementById('mapa-rota')) {
    setTimeout(() => inicializarMapaRota(), 100);
  }

  // Inicializa mapa Leaflet do MOTORISTA (quando ele clicou em "Visualizar rota")
  if (typeof L !== 'undefined' && document.getElementById('mapa-motorista')) {
    setTimeout(() => inicializarMapaMotorista(), 100);
  }
}

let planejMotoristaSelecionado = 'todos';

function renderPlanejamento() {
  const isMotoristaLogado = perfilAtivo === 'motorista';

  // Se é motorista logado, força ele a ver SÓ os próprios pedidos (modo leitura)
  if (isMotoristaLogado && motoristaLogado) {
    planejMotoristaSelecionado = motoristaLogado;
  }

  // Dia da semana atual pra destacar a coluna correspondente
  const diaAtual = getDiaAtualChave(); // null se for domingo

  // Listar motoristas que têm pedidos OU que estão na lista padrão
  const motoristasComPedidos = new Set();
  state.pedidos.forEach(p => {
    if (p.motorista) motoristasComPedidos.add(p.motorista);
  });
  // Garantir que motoristas cadastrados ativos apareçam mesmo sem pedidos
  getMotoristasAtivos().forEach(m => motoristasComPedidos.add(m));

    pedidosVisiveis = state.pedidos.filter(p =>

        </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-secondary" onclick="imprimirPlanejamento()" title="Imprimir ou salvar como PDF">

          Todos
          <span class="count-pill">${state.pedidos.filter(ativosFn).length}</span>
        </button>
        ${motoristasList.map(m => {
          const count = state.pedidos.filter(p => ativosFn(p) && p.motorista === m).length;
          const ehEle = isMotoristaLogado && m === motoristaLogado;
          const desabilitado = isMotoristaLogado && !ehEle;
          return `
            <button class="motorista-tab ${planejMotoristaSelecionado===m?'active':''}" data-mot="${m}" ${desabilitado ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
              ${m}${ehEle ? ' (você)' : ''}

            ⚠ Sem motorista
            <span class="count-pill">${semMotorista}</span>
          </button>
        ` : ''}
      </div>

      ${isMotoristaLogado ? `
        <div style="background:var(--info-soft);color:var(--info);padding:10px 14px;border-radius:var(--radius);font-size:12px;margin-bottom:14px;">
          📅 Visualização da sua agenda da semana. As outras abas estão desabilitadas porque você só pode ver os seus pedidos.
        </div>

      ${naoAtribuidos.length > 0 ? `
        <div class="chart-card" style="padding:14px;">

        // Não aparece em "Todos" (já mostra todo mundo) nem em "Sem motorista" (já é o foco).
        if (planejMotoristaSelecionado === 'todos' || planejMotoristaSelecionado === 'sem_motorista') return '';
        if (isMotoristaLogado) return ''; // motorista não atribui pedidos

        const semMotoristaSemDia = state.pedidos.filter(p => ativosFn(p) && !p.motorista && !p.dia);

        return `

          return DIAS.map(d => {

              .filter(p => p.dia === d)
              .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
            const ehHoje = d === diaAtual;
            const ehSabado = d === 'sabado';
            const classes = [
              'kanban-col',

            return `
              <div class="${classes}" data-dia="${d}">
                <div class="kanban-head">
                  <h4>${DIA_LABEL[d]}${ehHoje ? ' <span class="hoje-badge">HOJE</span>' : ''}${ehSabado ? ' <span class="sabado-badge">ocasional</span>' : ''}</h4>

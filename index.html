function kanbanCard(p, opts = {}) {
  const compact = opts.compact === true;
  const mostrarMotorista = planejMotoristaSelecionado === 'todos' || planejMotoristaSelecionado === 'sem_motorista';
  const isMotorista = perfilAtivo === 'motorista';
  const draggableAttr = isMotorista ? 'style="cursor:default;"' : `draggable="true" onclick="abrirEditarPedido('${p.id}')"`;

  // Handle de arrastar pra reordenar (só gestor). Substitui as setas ↑↓.
  // `ordemContext` = nome da lista pra qual o handle se aplica (ex: 'planejamento-segunda', 'rotas-Gildo')
  const podeReordenar = !isMotorista && opts.ordemContext;
  const dragHandle = podeReordenar ? `<div class="ordem-handle" data-ordem-context="${opts.ordemContext}" title="Arraste para reordenar">⋮⋮</div>` : '';

  if (compact) {
    // Versão compacta tipo "chip" — usada nos pools de pedidos a atribuir
    return `
      <div class="kanban-card-compact" ${draggableAttr} data-id="${p.id}" title="${p.cliente.replace(/"/g, '&quot;')}${p.veiculo ? ' · ' + getVeiculoLabel(p.veiculo) : ''}">
        <span class="pedido-num">${p.id}</span>
        <span class="cliente">${p.cliente}</span>
        ${p.veiculo ? veiculoTag(p.veiculo) : ''}
      </div>
    `;
  }

  // Versão padrão (cards do kanban semanal)
  return `
    <div class="kanban-card" ${draggableAttr} data-id="${p.id}"${podeReordenar ? ` data-ordem-context="${opts.ordemContext}"` : ''}>
      ${dragHandle}
      <div class="pedido-num">${p.id}${!p.motorista ? ' · <span style="color:var(--warn);">sem motorista</span>' : ''}</div>
      <div class="cliente">${p.cliente}</div>
      <div class="meta">
        ${p.veiculo ? veiculoTag(p.veiculo) : ''}
        ${mostrarMotorista && p.motorista ? `<span style="font-size:11px;color:var(--ink-2);">· ${p.motorista}</span>` : ''}
      </div>
    </div>
  `;
}

/** Wrapper que recebe um "contexto" e descobre a lista correta antes de chamar moverOrdem.
 *  Contextos suportados:
 *   - 'planejamento-{dia}': pedidos do dia específico no kanban (filtrados pelo motorista atual)
 *   - 'rotas-{motorista}': pedidos da rota daquele motorista
 */
async function moverOrdemContexto(pedidoId, direcao, contexto) {
  const ativosFn = (p) => p.status === 'expedicao' || p.status === 'saiu';

  if (contexto.startsWith('planejamento-')) {
    const dia = contexto.replace('planejamento-', '');
    let lista = state.pedidos.filter(p => ativosFn(p) && p.dia === dia);
    // Aplica filtro de motorista atual
    if (planejMotoristaSelecionado === 'sem_motorista') {
      lista = lista.filter(p => !p.motorista);
    } else if (planejMotoristaSelecionado !== 'todos') {
      lista = lista.filter(p => p.motorista === planejMotoristaSelecionado);
    }
    lista.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    await moverOrdem(pedidoId, direcao, lista);
  } else if (contexto.startsWith('rotas-')) {
    const motorista = contexto.replace('rotas-', '');
    let lista = state.pedidos.filter(p =>
      ativosFn(p) &&
      (motorista === 'todos' || p.motorista === motorista)
    );
    lista.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    await moverOrdem(pedidoId, direcao, lista);
  }
}

function bindPlanejamentoEvents() {
  // Filtro de motoristas (sempre disponível, mesmo pra motorista)
  document.querySelectorAll('.motorista-tab[data-mot]').forEach(b => {
    b.addEventListener('click', () => {
      planejMotoristaSelecionado = b.dataset.mot;
      render();
    });
  });

  // Motorista NÃO pode arrastar — bind de drag só pra gestor
  if (perfilAtivo === 'motorista') return;

  let draggedId = null;

  // ===== Drag DESKTOP (mouse) =====
  // Inclui tanto cards normais (kanban semanal) quanto compactos (pool laranja)
  document.querySelectorAll('.kanban-card, .kanban-card-compact').forEach(card => {
    card.addEventListener('dragstart', (e) => {
      draggedId = card.dataset.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });

  document.querySelectorAll('.kanban-body').forEach(col => {
    col.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (col.parentElement && col.parentElement.classList.contains('kanban-col')) {
        col.parentElement.classList.add('drag-over');
      }
    });
    col.addEventListener('dragleave', () => {
      if (col.parentElement && col.parentElement.classList.contains('kanban-col')) {
        col.parentElement.classList.remove('drag-over');
      }
    });
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      if (col.parentElement && col.parentElement.classList.contains('kanban-col')) {
        col.parentElement.classList.remove('drag-over');
      }
      if (!draggedId) return;
      await moverPedidoParaDia(draggedId, col.dataset.dia);
      draggedId = null;
    });
  });

  // Ativa reordenação por drag&drop dentro da mesma coluna (só gestor)
  ativarReordenacaoPorArrastar();

  // ===== Drag MOBILE (touch) =====
  // Funciona com long-press: segura 300ms num card, ele "levanta", arrasta com o dedo
  bindKanbanTouch();
}

/** Função auxiliar: aplica a movimentação do pedido pra um dia. */
async function moverPedidoParaDia(pedidoId, dia) {
  const p = state.pedidos.find(x => x.id === pedidoId);
  if (!p) return;
  p.dia = dia || '';
  // Auto-atribuir motorista se estamos filtrando por um específico
  if (dia && !p.motorista &&
      planejMotoristaSelecionado !== 'todos' &&
      planejMotoristaSelecionado !== 'sem_motorista') {
    p.motorista = planejMotoristaSelecionado;
  }
  await dataLayer.pedidos.salvar(p);
  render();
}

/** Move um pedido pra cima ou pra baixo numa lista filtrada.
 *  `lista` = array de pedidos visíveis na ordem atual. `pedidoId` = qual mover.
 *  `direcao` = -1 (sobe) ou +1 (desce).
 *  Persiste a nova ordem trocando os campos `ordem` dos dois pedidos. */
async function moverOrdem(pedidoId, direcao, lista) {
  const idx = lista.findIndex(p => p.id === pedidoId);
  if (idx < 0) return;
  const novoIdx = idx + direcao;
  if (novoIdx < 0 || novoIdx >= lista.length) return; // já no extremo

  // Trocar posições no array
  [lista[idx], lista[novoIdx]] = [lista[novoIdx], lista[idx]];

  // Renumerar TODA a lista em sequência (1, 2, 3, ...).
  // Esse approach é robusto: funciona mesmo quando todos têm ordem=0 ou valores duplicados.
  // Salva apenas os pedidos que tiveram a ordem alterada de fato (otimização).
  const promessas = [];
  for (let i = 0; i < lista.length; i++) {
    const novaOrdem = i + 1;
    if (lista[i].ordem !== novaOrdem) {
      lista[i].ordem = novaOrdem;
      promessas.push(dataLayer.pedidos.salvar(lista[i]));
    }
  }

  await Promise.all(promessas);
  render();
}

/** Reordena colocando o pedido `pedidoId` em cima ou embaixo do `alvoId`.
 *  Chamado quando o usuário solta um card em cima de outro dentro da mesma lista.
 *  `posicao` = 'above' (colocar antes do alvo) ou 'below' (colocar depois).
 *  `contexto` = 'planejamento-segunda' ou 'rotas-Gildo' etc. */
async function reordenarPorDrop(pedidoId, alvoId, posicao, contexto) {
  if (pedidoId === alvoId) return;

  // Reconstroi a lista do mesmo jeito que moverOrdemContexto faz
  const ativosFn = (p) => p.status === 'expedicao' || p.status === 'saiu';
  let lista;

  if (contexto.startsWith('planejamento-')) {
    const dia = contexto.replace('planejamento-', '');
    lista = state.pedidos.filter(p => ativosFn(p) && p.dia === dia);
    if (planejMotoristaSelecionado === 'sem_motorista') {
      lista = lista.filter(p => !p.motorista);
    } else if (planejMotoristaSelecionado !== 'todos') {
      lista = lista.filter(p => p.motorista === planejMotoristaSelecionado);
    }
  } else if (contexto.startsWith('rotas-')) {
    const motorista = contexto.replace('rotas-', '');
    lista = state.pedidos.filter(p =>
      ativosFn(p) &&
      (motorista === 'todos' || p.motorista === motorista)
    );
  } else {
    return;
  }

  lista.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  const idxOrig = lista.findIndex(p => p.id === pedidoId);
  const idxAlvo = lista.findIndex(p => p.id === alvoId);
  if (idxOrig < 0 || idxAlvo < 0) return;

  // Remove da posição atual e insere na nova
  const [item] = lista.splice(idxOrig, 1);
  // Recalcula índice do alvo (pode ter mudado se estava depois)
  const novoIdxAlvo = lista.findIndex(p => p.id === alvoId);
  const idxInsert = posicao === 'above' ? novoIdxAlvo : novoIdxAlvo + 1;
  lista.splice(idxInsert, 0, item);

  // Renumera todos e salva os que mudaram
  const promessas = [];
  for (let i = 0; i < lista.length; i++) {
    const novaOrdem = i + 1;
    if (lista[i].ordem !== novaOrdem) {
      lista[i].ordem = novaOrdem;
      promessas.push(dataLayer.pedidos.salvar(lista[i]));
    }
  }

  await Promise.all(promessas);
  render();
}

/** Ativa drag-and-drop pra reordenar itens dentro de uma lista.
 *  Deve ser chamado sempre que a lista é renderizada.
 *  Funciona pra Kanban (planejamento) e Rotas.
 *
 *  Cada item da lista deve ter:
 *   - draggable="true"
 *   - data-id="ID_DO_PEDIDO"
 *   - data-ordem-context="CONTEXTO" (ou dentro dele, um .ordem-handle com data-ordem-context)
 *
 *  Só ativa se o perfil ativo for GESTOR — motorista não pode reordenar. */
function ativarReordenacaoPorArrastar() {
  if (perfilAtivo === 'motorista') return;

  // Selecionamos os itens arrastáveis que representam pedidos individuais.
  // Kanban tem draggable no próprio card; rotas usa a classe .rota-stop.arrastavel
  const itens = document.querySelectorAll('.kanban-card[draggable="true"][data-id], .rota-stop.arrastavel[data-id]');

  itens.forEach(item => {
    // Ler o contexto: pode estar no próprio item ou no handle interno
    const handle = item.querySelector('.ordem-handle');
    const contexto = item.dataset.ordemContext || (handle && handle.dataset.ordemContext);
    if (!contexto) return;

    // dragover: detecta se é acima ou abaixo do meio do item alvo
    item.addEventListener('dragover', (e) => {
      // Considera drag de outro item — pode ser .arrastando (rotas) ou .dragging (kanban)
      const arrastando = document.querySelector('.arrastando') || document.querySelector('.dragging');
      if (!arrastando || arrastando === item) return;
      // Confere se o item arrastando é da mesma lista
      const ctxArrastando = arrastando.dataset.ordemContext ||
                            arrastando.querySelector?.('.ordem-handle')?.dataset.ordemContext;
      if (ctxArrastando !== contexto) return;

      e.preventDefault();
      e.stopPropagation();  // evita disparar o dragover da coluna (que trocaria de dia/motorista)

      // Detecta posição relativa (metade de cima ou baixo)
      const rect = item.getBoundingClientRect();
      const meio = rect.top + rect.height / 2;
      const acimaDoMeio = e.clientY < meio;

      // Limpa outros indicadores
      document.querySelectorAll('.drop-target-above, .drop-target-below').forEach(el => {
        el.classList.remove('drop-target-above', 'drop-target-below');
      });

      item.classList.add(acimaDoMeio ? 'drop-target-above' : 'drop-target-below');
    });

    item.addEventListener('dragleave', () => {
      item.classList.remove('drop-target-above', 'drop-target-below');
    });

    item.addEventListener('drop', (e) => {
      const arrastando = document.querySelector('.arrastando') || document.querySelector('.dragging');
      if (!arrastando || arrastando === item) return;
      const ctxArrastando = arrastando.dataset.ordemContext ||
                            arrastando.querySelector?.('.ordem-handle')?.dataset.ordemContext;
      if (ctxArrastando !== contexto) return;

      e.preventDefault();
      e.stopPropagation();

      const posicao = item.classList.contains('drop-target-above') ? 'above' : 'below';
      item.classList.remove('drop-target-above', 'drop-target-below');

      const pedidoId = arrastando.dataset.id;
      const alvoId = item.dataset.id;

      reordenarPorDrop(pedidoId, alvoId, posicao, contexto);
    });

    // dragstart / dragend só no item (Kanban já tem, Rotas precisa)
    if (item.classList.contains('rota-stop')) {
      item.addEventListener('dragstart', (e) => {
        item.classList.add('arrastando');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('arrastando');
        // Limpa qualquer indicador residual
        document.querySelectorAll('.drop-target-above, .drop-target-below').forEach(el => {
          el.classList.remove('drop-target-above', 'drop-target-below');
        });
      });
    }
  });
}

/** Imprime a aba Planejamento (vai abrir o diálogo de impressão do navegador,
 *  onde o usuário pode salvar como PDF ou enviar pra impressora). */
function imprimirPlanejamento() {
  // Adiciona classe "printing" no body pra ativar os estilos de impressão
  document.body.classList.add('printing');

  // Pequeno delay pra garantir que o CSS aplicou antes de abrir o diálogo
  setTimeout(() => {
    window.print();
    // Após fechar o diálogo (sucesso ou cancelar), remove a classe
    setTimeout(() => {
      document.body.classList.remove('printing');
    }, 500);
  }, 100);
}

/** Re-otimiza a ordem de uma rota usando "vizinho mais próximo" por CEP.
 *  Sobrescreve a ordem manual. Usado pelo botão "🔄 Otimizar rota". */
/* ====================================================================
   SISTEMA DE GEOCODING E OTIMIZAÇÃO DE ROTA
   ====================================================================
   Fluxo:
   1. Painel precisa de lat/lng de um CEP
   2. Consulta cache_geocoding no Supabase primeiro
   3. Se não achou, chama Nominatim (gratuito, OpenStreetMap)
   4. Salva no cache pra próxima
   ==================================================================== */

// Coordenadas fixas do ponto de partida (Av. Vila Ema, 2687 — Malba Embalagens)
const PONTO_PARTIDA_COORDS = {
  latitude: -23.5772,
  longitude: -46.5502,
  endereco: 'Av. Vila Ema, 2687 - São Paulo, SP',
  cep: '03283000',
  label: 'Malba Embalagens'
};

// Cache em memória (evita ir ao Supabase pra CEPs já resolvidos nesta sessão)
const geocodingCacheMemoria = new Map();

/** Busca lat/lng pra um CEP. Usa cache Supabase + Nominatim.
 *  Retorna { latitude, longitude } ou null se falhou. */
/** Valida se as coordenadas estão dentro do Brasil (grosso modo).
 *  Bounding box do Brasil: lat -34 a +6, lng -74 a -34.
 *  Fora disso = erro grosseiro do geocoder, descarta. */
function coordenadasSaoBrasileiras(lat, lng) {
  if (typeof lat !== 'number' || typeof lng !== 'number') return false;
  if (isNaN(lat) || isNaN(lng)) return false;
  return lat >= -34 && lat <= 6 && lng >= -74 && lng <= -34;
}

/** Limpa cache Supabase de CEPs que ficaram com coordenadas erradas
 *  (fora do Brasil ou muito distantes de SP). Útil pra corrigir dados
 *  ruins deixados pela versão antiga. */
async function limparCacheGeocodingRuim() {
  if (!supabaseClient) return;
  try {
    // Deleta cache_geocoding com coordenadas fora do Brasil (bug antigo)
    const { data, error } = await supabaseClient
      .from('cache_geocoding')
      .delete()
      .or('latitude.lt.-34,latitude.gt.6,longitude.lt.-74,longitude.gt.-34')
      .select('cep');
    if (!error && data) {
      console.log(`[geocoding] Limpou ${data.length} CEP(s) com coordenadas erradas do cache.`);
      // Também limpa cache em memória
      geocodingCacheMemoria.clear();
    }
  } catch (e) {
    console.warn('[geocoding] Erro ao limpar cache:', e.message);
  }
}

async function geocodificarCep(cepRaw) {
  const cep = String(cepRaw || '').replace(/\D/g, '');
  if (cep.length !== 8) return null;

  // 1. Cache em memória (rápido)
  if (geocodingCacheMemoria.has(cep)) {
    return geocodingCacheMemoria.get(cep);
  }

  // 2. Cache Supabase — só aceita se coordenadas estão no Brasil
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('cache_geocoding')
        .select('latitude, longitude')
        .eq('cep', cep)
        .maybeSingle();
      if (!error && data && data.latitude != null && data.longitude != null) {
        const lat = Number(data.latitude);
        const lng = Number(data.longitude);
        if (coordenadasSaoBrasileiras(lat, lng)) {
          const coords = { latitude: lat, longitude: lng };
          geocodingCacheMemoria.set(cep, coords);
          return coords;
        }
        // Coordenada ruim no cache → ignora e busca de novo
        console.warn(`[geocoding] Cache tem coords ruins pra CEP ${cep} (${lat}, ${lng}). Buscando de novo.`);
      }
    } catch (e) {
      console.warn(`[geocoding] Erro ao ler cache Supabase pra CEP ${cep}:`, e.message);
    }
  }

  // Helper pra validar + salvar
  const salvarESeguir = async (coords, fonte) => {
    if (!coordenadasSaoBrasileiras(coords.latitude, coords.longitude)) {
      console.warn(`[geocoding] ${fonte} retornou coords fora do BR pra CEP ${cep}:`, coords);
      return null;
    }
    geocodingCacheMemoria.set(cep, coords);
    if (supabaseClient) {
      supabaseClient.from('cache_geocoding').upsert({
        cep,
        latitude: coords.latitude,
        longitude: coords.longitude,
        fonte,
        atualizado_em: new Date().toISOString()
      }).then(({ error }) => {
        if (error) console.warn(`[geocoding] Erro ao salvar cache CEP ${cep}:`, error.message);
      });
    }
    console.log(`[geocoding] ✓ CEP ${cep} → (${coords.latitude.toFixed(5)}, ${coords.longitude.toFixed(5)}) via ${fonte}`);
    return coords;
  };

  // 3. BrasilAPI v2 — muitas vezes já retorna coordenadas prontas!
  //    Sem rate limit, gratuito, agrega várias fontes (Correios, ViaCEP, OpenCEP)
  let enderecoStruct = null;
  try {
    const resp = await fetch(`https://brasilapi.com.br/api/cep/v2/${cep}`);
    if (resp.ok) {
      const data = await resp.json();
      enderecoStruct = data; // guardamos pra usar no Nominatim se precisar
      // BrasilAPI v2 retorna location.coordinates.{latitude,longitude} quando disponível
      const loc = data.location?.coordinates || {};
      if (loc.latitude && loc.longitude) {
        const result = await salvarESeguir({
          latitude: parseFloat(loc.latitude),
          longitude: parseFloat(loc.longitude)
        }, 'brasilapi');
        if (result) return result;
      }
    }
  } catch (e) {
    console.warn(`[geocoding] BrasilAPI falhou pra CEP ${cep}:`, e.message);
  }

  // 4. ViaCEP como fallback pra pegar dados estruturados
  //    Ele não retorna coordenadas mas retorna rua/bairro/cidade certinho
  if (!enderecoStruct) {
    try {
      const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      if (resp.ok) {
        const data = await resp.json();
        if (!data.erro) {
          enderecoStruct = {
            street: data.logradouro,
            neighborhood: data.bairro,
            city: data.localidade,
            state: data.uf,
          };
        }
      }
    } catch (e) {
      console.warn(`[geocoding] ViaCEP falhou pra CEP ${cep}:`, e.message);
    }
  }

  // 5. Nominatim como último recurso — MAS agora com endereço estruturado
  //    (rua + cidade + estado) em vez de só CEP. Isso evita a confusão que
  //    fez ele achar Mooca no RS.
  //
  //    IMPORTANTE: usamos parâmetros estruturados (street, city, state, country)
  //    em vez do parâmetro `q` livre. Muito mais preciso.
  if (enderecoStruct && enderecoStruct.city) {
    try {
      const params = new URLSearchParams({
        format: 'json',
        limit: '3',
        countrycodes: 'br',  // FORÇA busca só no Brasil
      });
      if (enderecoStruct.street)       params.append('street', enderecoStruct.street);
      if (enderecoStruct.city)         params.append('city', enderecoStruct.city);
      if (enderecoStruct.state)        params.append('state', enderecoStruct.state);
      params.append('country', 'Brasil');

      const url = `https://nominatim.openstreetmap.org/search?${params.toString()}`;
      const resp = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (resp.ok) {
        const results = await resp.json();
        if (Array.isArray(results) && results.length > 0) {
          // Pega o primeiro resultado que esteja no Brasil
          for (const r of results) {
            const coords = {
              latitude: parseFloat(r.lat),
              longitude: parseFloat(r.lon)
            };
            if (coordenadasSaoBrasileiras(coords.latitude, coords.longitude)) {
              const saved = await salvarESeguir(coords, 'nominatim');
              if (saved) return saved;
            }
          }
        }
      }
    } catch (e) {
      console.warn(`[geocoding] Nominatim falhou pra CEP ${cep}:`, e.message);
    }
  }

  console.warn(`[geocoding] ✗ Não consegui geocodificar CEP ${cep} por nenhuma fonte`);
  return null;
}

/** Calcula distância em KM entre 2 pontos (fórmula de Haversine).
 *  Precisão: até 0.5% pra distâncias típicas de rota urbana. */
function distanciaKm(coord1, coord2) {
  const R = 6371; // raio da Terra em km
  const toRad = (deg) => deg * Math.PI / 180;
  const dLat = toRad(coord2.latitude - coord1.latitude);
  const dLon = toRad(coord2.longitude - coord1.longitude);
  const a = Math.sin(dLat/2) ** 2 +
            Math.cos(toRad(coord1.latitude)) * Math.cos(toRad(coord2.latitude)) *
            Math.sin(dLon/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/** Algoritmo do Vizinho Mais Próximo (Nearest Neighbor).
 *  Simples e rápido — não retorna solução ótima mas é 20-30% melhor que
 *  a ordem original. Boa relação custo/benefício.
 *
 *  @param pontoInicial {latitude, longitude}
 *  @param paradas [{id, coords: {latitude, longitude}, ...}]
 *  @returns array de paradas na ordem otimizada */
function otimizarNearestNeighbor(pontoInicial, paradas) {
  if (paradas.length === 0) return [];

  const visitadas = new Set();
  const ordem = [];
  let pontoAtual = pontoInicial;

  for (let i = 0; i < paradas.length; i++) {
    let melhorIdx = -1;
    let melhorDist = Infinity;

    for (let j = 0; j < paradas.length; j++) {
      if (visitadas.has(j)) continue;
      const dist = distanciaKm(pontoAtual, paradas[j].coords);
      if (dist < melhorDist) {
        melhorDist = dist;
        melhorIdx = j;
      }
    }

    if (melhorIdx >= 0) {
      visitadas.add(melhorIdx);
      ordem.push(paradas[melhorIdx]);
      pontoAtual = paradas[melhorIdx].coords;
    }
  }

  return ordem;
}

/** Melhora 2-opt: pega uma rota e tenta inverter segmentos pra reduzir distância total.
 *  Complementa o Nearest Neighbor. Roda até não conseguir mais melhorar.
 *  Para em max iterações pra não travar em casos grandes. */
function melhorar2Opt(pontoInicial, paradas, maxIter = 100) {
  if (paradas.length < 4) return paradas;

  // Calcula distância total da rota inteira
  const distTotal = (arr) => {
    let d = distanciaKm(pontoInicial, arr[0].coords);
    for (let i = 0; i < arr.length - 1; i++) {
      d += distanciaKm(arr[i].coords, arr[i + 1].coords);
    }
    return d;
  };

  let melhor = [...paradas];
  let melhorDist = distTotal(melhor);
  let iter = 0;
  let melhorou = true;

  while (melhorou && iter < maxIter) {
    melhorou = false;
    for (let i = 0; i < melhor.length - 1; i++) {
      for (let j = i + 1; j < melhor.length; j++) {
        // Inverte o segmento entre i e j
        const nova = [
          ...melhor.slice(0, i),
          ...melhor.slice(i, j + 1).reverse(),
          ...melhor.slice(j + 1)
        ];
        const novaDist = distTotal(nova);
        if (novaDist < melhorDist - 0.01) { // 10m de melhoria mínima
          melhor = nova;
          melhorDist = novaDist;
          melhorou = true;
        }
      }
      iter++;
      if (iter >= maxIter) break;
    }
  }

  return melhor;
}

/** Calcula KPIs da rota: distância total, tempo estimado, combustível estimado. */
function calcularKpisRota(pontoInicial, paradasOrdenadas) {
  if (paradasOrdenadas.length === 0) {
    return { distanciaKm: 0, tempoMin: 0, combustivelReais: 0 };
  }
  let dist = distanciaKm(pontoInicial, paradasOrdenadas[0].coords);
  for (let i = 0; i < paradasOrdenadas.length - 1; i++) {
    dist += distanciaKm(paradasOrdenadas[i].coords, paradasOrdenadas[i + 1].coords);
  }
  // Estimativas conservadoras pra tráfego urbano de SP:
  //  - velocidade média 25 km/h + 5 min por parada
  //  - consumo 8 km/L a R$ 6,00/L → R$ 0,75/km
  const tempoDeslocamento = (dist / 25) * 60; // minutos
  const tempoParadas = paradasOrdenadas.length * 5;
  const combustivel = dist * 0.75;
  return {
    distanciaKm: dist,
    tempoMin: tempoDeslocamento + tempoParadas,
    combustivelReais: combustivel
  };
}

async function otimizarOrdemRota(motorista) {
  if (!confirm(`Otimizar a ordem da rota de ${motorista || 'todos'} usando IA de localização?\n\nIsso vai:\n1. Limpar coordenadas erradas do cache (se houver)\n2. Geocodificar CEPs (leva alguns segundos)\n3. Calcular a menor rota total\n4. Sobrescrever a ordem manual atual`)) return;

  // 0. Limpa cache com coordenadas ruins (bug anterior)
  await limparCacheGeocodingRuim();

  // 1. Filtra pedidos ativos do motorista
  const pedidosRota = state.pedidos.filter(p =>
    (p.status === 'expedicao' || p.status === 'saiu') &&
    (motorista === 'todos' || p.motorista === motorista) &&
    p.cep
  );
  if (pedidosRota.length === 0) {
    alert('Nenhum pedido pra otimizar (verifique se têm CEP cadastrado).');
    return;
  }

  // 2. Geocodifica todos os CEPs (com feedback visual)
  const progresso = document.createElement('div');
  progresso.style.cssText = 'position:fixed;top:20px;right:20px;background:#4f46e5;color:#fff;padding:14px 20px;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:99999;font-size:13px;font-weight:600;';
  progresso.textContent = `🗺️ Geocodificando CEPs... 0/${pedidosRota.length}`;
  document.body.appendChild(progresso);

  const paradas = [];
  for (let i = 0; i < pedidosRota.length; i++) {
    const p = pedidosRota[i];
    progresso.textContent = `🗺️ Geocodificando CEPs... ${i + 1}/${pedidosRota.length} (${p.cliente.slice(0, 20)})`;
    const coords = await geocodificarCep(p.cep);
    if (coords) {
      paradas.push({ id: p.id, cliente: p.cliente, coords, pedido: p });
    } else {
      console.warn(`[rota] Sem coordenadas pra ${p.id} (CEP ${p.cep})`);
    }
    // Rate limit do Nominatim: 1 req/seg quando NÃO tá no cache
    // O cache Supabase evita esse delay a partir da 2a vez
    if (!geocodingCacheMemoria.has(p.cep)) {
      await new Promise(r => setTimeout(r, 300));
    }
  }

  if (paradas.length === 0) {
    progresso.remove();
    alert('Não conseguimos geocodificar nenhum CEP. Verifique se são válidos.');
    return;
  }

  // 3. Aplica algoritmo: Nearest Neighbor + 2-opt
  progresso.textContent = `🤖 Calculando melhor sequência...`;
  const passo1 = otimizarNearestNeighbor(PONTO_PARTIDA_COORDS, paradas);
  const paradasOtimizadas = melhorar2Opt(PONTO_PARTIDA_COORDS, passo1);

  // 4. Salva nova ordem
  progresso.textContent = `💾 Salvando nova ordem...`;
  for (let i = 0; i < paradasOtimizadas.length; i++) {
    paradasOtimizadas[i].pedido.ordem = i + 1;
    await dataLayer.pedidos.salvar(paradasOtimizadas[i].pedido);
  }

  // KPIs finais
  const kpis = calcularKpisRota(PONTO_PARTIDA_COORDS, paradasOtimizadas);

  progresso.remove();
  alert(
    `✓ Rota otimizada!\n\n` +
    `📍 ${paradasOtimizadas.length} paradas\n` +
    `📏 ${kpis.distanciaKm.toFixed(1)} km totais\n` +
    `⏱️ ~${Math.round(kpis.tempoMin)} min\n` +
    `⛽ ~R$ ${kpis.combustivelReais.toFixed(2)} em combustível`
  );
  render();
}

/* Guarda a instância do mapa Leaflet pra poder destruir antes de recriar
   (Leaflet quebra se você inicializar 2x no mesmo container). */
let mapaRotaInstance = null;

/** Inicializa (ou re-renderiza) o mapa Leaflet da tela de Rotas.
 *  Chamado depois que a lista renderiza — pega os pedidos do motorista
 *  selecionado, geocodifica os que ainda não têm coordenada e desenha:
 *   - Marker verde: ponto de partida (Malba)
 *   - Markers numerados: paradas na ordem atual
 *   - Linha indigo: rota conectando tudo
 *   - KPIs no rodapé: distância, tempo, combustível */
async function inicializarMapaRota() {
  const container = document.getElementById('mapa-rota');
  if (!container) return; // não está na tela de rotas

  // Se já existe um mapa, destrói primeiro (evita erro do Leaflet)
  if (mapaRotaInstance) {
    mapaRotaInstance.remove();
    mapaRotaInstance = null;
  }

  // Auto-limpa cache ruim (bug antigo) — só na 1a inicialização por sessão
  if (!window._cacheGeoLimpo) {
    await limparCacheGeocodingRuim();
    window._cacheGeoLimpo = true;
  }

  // Pega os pedidos do motorista atual na ordem visível
  const pedidosAtivos = state.pedidos.filter(p =>
    (p.status === 'expedicao' || p.status === 'saiu') &&
    (rotaMotoristaSelecionado === '(Sem motorista)'
      ? !p.motorista
      : p.motorista === rotaMotoristaSelecionado) &&
    p.cep
  );
  pedidosAtivos.sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

  if (pedidosAtivos.length === 0) {
    container.innerHTML = '<div class="rota-mapa-vazio">Sem paradas com CEP pra exibir no mapa.</div>';
    return;
  }

  // Cria o mapa centrado em São Paulo por padrão
  mapaRotaInstance = L.map('mapa-rota', {
    zoomControl: true,
    scrollWheelZoom: true,
  }).setView([PONTO_PARTIDA_COORDS.latitude, PONTO_PARTIDA_COORDS.longitude], 12);

  // Camada de tiles do OpenStreetMap (grátis, sem chave)
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19,
  }).addTo(mapaRotaInstance);

  // Marker de partida (verde)
  const iconePartida = L.divIcon({
    className: 'marker-partida',
    html: '<div style="background:#22c55e;width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;">🏁</div>',
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
  L.marker([PONTO_PARTIDA_COORDS.latitude, PONTO_PARTIDA_COORDS.longitude], {
    icon: iconePartida
  }).addTo(mapaRotaInstance).bindPopup(`<strong>${PONTO_PARTIDA_COORDS.label}</strong><br>${PONTO_PARTIDA_COORDS.endereco}`);

  // Feedback visual: geocodificando
  const kpiDist = document.getElementById('kpi-dist');
  const kpiTempo = document.getElementById('kpi-tempo');
  const kpiComb = document.getElementById('kpi-combustivel');
  if (kpiDist)  kpiDist.textContent = 'Carregando...';
  if (kpiTempo) kpiTempo.textContent = '';
  if (kpiComb)  kpiComb.textContent = '';

  // Geocodifica cada parada
  const paradas = [];
  for (const p of pedidosAtivos) {
    const coords = await geocodificarCep(p.cep);
    if (coords) paradas.push({ pedido: p, coords });
    // Rate limit só se foi API (cache é instantâneo)
    if (!geocodingCacheMemoria.has(String(p.cep).replace(/\D/g, ''))) {
      await new Promise(r => setTimeout(r, 300));
    }
  }

  if (paradas.length === 0) {
    if (kpiDist)  kpiDist.textContent = '—';
    if (kpiTempo) kpiTempo.textContent = '—';
    if (kpiComb)  kpiComb.textContent = '—';
    return;
  }

  // Adiciona markers numerados
  paradas.forEach((parada, idx) => {
    const num = idx + 1;
    const icone = L.divIcon({
      className: 'marker-parada',
      html: `<div style="background:#18181b;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;">${num}</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15],
    });
    L.marker([parada.coords.latitude, parada.coords.longitude], { icon: icone })
      .addTo(mapaRotaInstance)
      .bindPopup(`<strong>${num}. ${escapeHtml(parada.pedido.cliente)}</strong><br>${escapeHtml(parada.pedido.endereco || '')}`);
  });

  // Desenha a rota (linha ligando partida → paradas em sequência)
  const pontos = [
    [PONTO_PARTIDA_COORDS.latitude, PONTO_PARTIDA_COORDS.longitude],
    ...paradas.map(p => [p.coords.latitude, p.coords.longitude])
  ];
  L.polyline(pontos, {
    color: '#4f46e5',
    weight: 4,
    opacity: 0.8,
    lineJoin: 'round',
  }).addTo(mapaRotaInstance);

  // Ajusta o zoom pra caber tudo na tela
  mapaRotaInstance.fitBounds(pontos, { padding: [30, 30] });

  // KPIs
  const kpis = calcularKpisRota(PONTO_PARTIDA_COORDS, paradas);
  if (kpiDist)  kpiDist.textContent = `${kpis.distanciaKm.toFixed(1)} km`;
  if (kpiTempo) kpiTempo.textContent = `${Math.round(kpis.tempoMin)} min`;
  if (kpiComb)  kpiComb.textContent = `R$ ${kpis.combustivelReais.toFixed(2)}`;
}

  });

  // Linha da rota
  const pontos = [
    [PONTO_PARTIDA_COORDS.latitude, PONTO_PARTIDA_COORDS.longitude],
    ...paradas.map(p => [p.coords.latitude, p.coords.longitude])
  ];
  L.polyline(pontos, {
    color: '#6366f1',
    weight: 4,
    opacity: 0.8,
    lineJoin: 'round',
  }).addTo(mapaMotoristaInstance);

  mapaMotoristaInstance.fitBounds(pontos, { padding: [30, 30] });
}

/** Sistema de drag-and-drop por TOQUE para mobile.
 *  Como o HTML5 drag não funciona em mobile, usamos touchstart/move/end.
 *  Long-press (300ms) inicia o drag pra distinguir de scroll/tap. */
function bindKanbanTouch() {
  // Inclui tanto cards normais quanto compactos (pool laranja)
  const cards = document.querySelectorAll('.kanban-card[draggable="true"], .kanban-card-compact[draggable="true"]');
  if (cards.length === 0) return;

  let touchState = null; // { card, pedidoId, ghost, startX, startY, longPressTimer }

  cards.forEach(card => {
    card.addEventListener('touchstart', (e) => {
      // Só trata se foi 1 dedo (não pinch)
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      touchState = {
        card,
        pedidoId: card.dataset.id,
        ghost: null,
        startX: t.clientX,
        startY: t.clientY,
        currentX: t.clientX,
        currentY: t.clientY,
        moved: false,
        dragging: false,
        longPressTimer: null
      };

      // Long-press: depois de 300ms, se ainda tá segurando, inicia drag
      touchState.longPressTimer = setTimeout(() => {
        if (touchState && !touchState.moved) {
          iniciarTouchDrag(touchState);
        }
      }, 300);
    }, { passive: true });

    card.addEventListener('touchmove', (e) => {
      if (!touchState) return;
      const t = e.touches[0];
      const dx = Math.abs(t.clientX - touchState.startX);
      const dy = Math.abs(t.clientY - touchState.startY);

      if (!touchState.dragging) {
        // Antes de iniciar drag: se o dedo se moveu muito, cancela o long-press
        // (significa que era scroll, não drag)
        if (dx > 10 || dy > 10) {
          touchState.moved = true;
          if (touchState.longPressTimer) {
            clearTimeout(touchState.longPressTimer);
            touchState.longPressTimer = null;
          }
          touchState = null;
        }
        return;
      }

      // Já tá arrastando — move o ghost e detecta coluna
      e.preventDefault(); // impede scroll
      touchState.currentX = t.clientX;
      touchState.currentY = t.clientY;
      moverGhost(touchState);
      atualizarColunaDestaque(t.clientX, t.clientY);
      autoScrollSeNecessario(t.clientY);
    }, { passive: false });

    const finalizar = async (e) => {
      if (!touchState) return;
      if (touchState.longPressTimer) {
        clearTimeout(touchState.longPressTimer);
      }

      if (touchState.dragging) {
        // Determinar onde soltou
        const t = (e.changedTouches && e.changedTouches[0]) || { clientX: touchState.currentX, clientY: touchState.currentY };
        const colDestino = encontrarColunaEm(t.clientX, t.clientY);

        // Limpar ghost e visual
        if (touchState.ghost && touchState.ghost.parentNode) {
          touchState.ghost.parentNode.removeChild(touchState.ghost);
        }
        document.querySelectorAll('.kanban-col.drag-over').forEach(c => c.classList.remove('drag-over'));
        touchState.card.classList.remove('dragging');
        document.body.style.userSelect = '';

        if (colDestino) {
          await moverPedidoParaDia(touchState.pedidoId, colDestino.dataset.dia);
        }
      }

      touchState = null;
    };

    card.addEventListener('touchend', finalizar);
    card.addEventListener('touchcancel', finalizar);
  });
}

/** Inicia visualmente o modo drag: cria um "ghost" do card e dá feedback. */
function iniciarTouchDrag(state) {
  state.dragging = true;

  // Vibração leve (se o dispositivo suportar)
  if (navigator.vibrate) {
    try { navigator.vibrate(40); } catch (e) {}
  }

  // Cria um clone do card pra seguir o dedo
  const rect = state.card.getBoundingClientRect();
  const ghost = state.card.cloneNode(true);
  ghost.style.cssText = `
    position: fixed;
    left: ${rect.left}px;
    top: ${rect.top}px;
    width: ${rect.width}px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0.85;
    transform: scale(1.05) rotate(2deg);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  `;
  document.body.appendChild(ghost);
  state.ghost = ghost;
  state.ghostOffsetX = state.startX - rect.left;
  state.ghostOffsetY = state.startY - rect.top;

  // Original fica meio transparente
  state.card.classList.add('dragging');
  document.body.style.userSelect = 'none';
}

/** Move o ghost pra acompanhar o dedo. */
function moverGhost(state) {
  if (!state.ghost) return;
  const x = state.currentX - state.ghostOffsetX;
  const y = state.currentY - state.ghostOffsetY;
  state.ghost.style.left = x + 'px';
  state.ghost.style.top = y + 'px';
}

/** Detecta sobre qual coluna do kanban o dedo está, e destaca ela. */
function atualizarColunaDestaque(x, y) {
  const col = encontrarColunaEm(x, y);
  document.querySelectorAll('.kanban-col.drag-over').forEach(c => {
    if (c !== col?.parentElement) c.classList.remove('drag-over');
  });
  if (col && col.parentElement && col.parentElement.classList.contains('kanban-col')) {
    col.parentElement.classList.add('drag-over');
  }
}

/** Acha o elemento .kanban-body sob as coordenadas (x, y). */
function encontrarColunaEm(x, y) {
  // Esconde temporariamente o ghost pra elementFromPoint não pegar ele
  const ghost = document.querySelector('div[style*="z-index: 9999"]');
  let oldDisplay = null;
  if (ghost) {
    oldDisplay = ghost.style.display;
    ghost.style.display = 'none';
  }

  const el = document.elementFromPoint(x, y);

  if (ghost) ghost.style.display = oldDisplay;

  if (!el) return null;
  // Procura o ancestral .kanban-body mais próximo
  return el.closest('.kanban-body');
}

/** Auto-scroll vertical quando arrasta perto das bordas da janela. */
let autoScrollIntervalId = null;
function autoScrollSeNecessario(y) {
  const margem = 80; // px da borda que ativa o scroll
  const velocidade = 12; // px por frame
  const altura = window.innerHeight;

  if (autoScrollIntervalId) {
    clearInterval(autoScrollIntervalId);
    autoScrollIntervalId = null;
  }

  if (y < margem) {
    autoScrollIntervalId = setInterval(() => window.scrollBy(0, -velocidade), 16);
  } else if (y > altura - margem) {
    autoScrollIntervalId = setInterval(() => window.scrollBy(0, velocidade), 16);
  }
}

// Para o auto-scroll quando termina o drag
['touchend', 'touchcancel'].forEach(evt => {
  document.addEventListener(evt, () => {
    if (autoScrollIntervalId) {
      clearInterval(autoScrollIntervalId);
      autoScrollIntervalId = null;
    }
  });
});

            ? 'A senha atual está criptografada (não é possível recuperar). Se digitar uma nova, ela substituirá a antiga.'
            : 'Anote essa senha e passe pro motorista. Pode usar algo simples tipo "joao2026".'}
        </div>
      </div>
      <div id="motorista_erro" style="color:var(--danger);font-size:12px;display:none;"></div>
    `,
    actions: [
      ...(isNovo ? [] : [{ label: 'Excluir', cls: 'btn-danger', onClick: () => excluirMotorista(id) }]),
      { label: 'Cancelar', cls: 'btn-secondary', onClick: fecharModal },
      { label: isNovo ? 'Cadastrar' : 'Salvar', cls: 'btn-primary', onClick: () => salvarMotorista(id) }
    ]
  });
}

async function salvarMotorista(id) {
  const nome = document.getElementById('m_nome').value.trim();
  const senha = document.getElementById('m_senha').value.trim();
  const erro = document.getElementById('motorista_erro');

  if (!nome) {
    erro.textContent = 'Nome é obrigatório.';
    erro.style.display = 'block';
    return;
  }

  // Se está editando E a senha foi deixada vazia, mantém a atual
  const isEditando = !!id;
  if (!isEditando && !senha) {
    erro.textContent = 'Senha é obrigatória.';
    erro.style.display = 'block';
    return;
  }
  if (senha && senha.length < 4) {
    erro.textContent = 'A senha deve ter pelo menos 4 caracteres.';
    erro.style.display = 'block';
    return;
  }

  // Verificar nome duplicado (exceto o próprio se estiver editando)
  const duplicado = (state.motoristasCadastrados || []).find(m =>
    m.nome.toLowerCase() === nome.toLowerCase() && m.id !== id
  );
  if (duplicado) {
    erro.textContent = 'Já existe um motorista com esse nome.';
    erro.style.display = 'block';
    return;
  }

  if (id) {
    // Editar existente
    const m = state.motoristasCadastrados.find(x => x.id === id);
    if (m) {
      const nomeAntigo = m.nome;
      m.nome = nome;
      // Só atualiza senha se foi digitada uma nova
      if (senha) {
        m.senha = hashSenha(senha);
      }
      // Se renomeou, atualizar pedidos que apontam pro nome antigo
      if (nomeAntigo !== nome) {
        if (supabaseMode.motoristas) {
          await dataLayer.motoristas.renomear(id, nomeAntigo, nome);
        }
        for (const p of state.pedidos) {
          if (p.motorista === nomeAntigo) {
            p.motorista = nome;
            await dataLayer.pedidos.salvar(p);
          }
        }
      }
      await dataLayer.motoristas.salvar(m);
    }
  } else {
    // Criar novo — sempre hashea
    const novoId = 'm-' + Date.now();
    const novo = { id: novoId, nome, senha: hashSenha(senha), ativo: true };
    await dataLayer.motoristas.salvar(novo);
  }

  fecharModal();
  render();
}

async function excluirMotorista(id) {
  const m = (state.motoristasCadastrados || []).find(x => x.id === id);
  if (!m) return;

  // Verificar se há pedidos atribuídos a esse motorista
  const pedidosDoMotorista = state.pedidos.filter(p => p.motorista === m.nome).length;
  const entregasNoHistorico = state.historicoEntregas.filter(h => h.motorista === m.nome).length;

  let aviso = `Excluir o motorista "${m.nome}"?`;
  if (pedidosDoMotorista > 0 || entregasNoHistorico > 0) {
    aviso += `\n\nAtenção: ${pedidosDoMotorista} pedido(s) ativo(s) e ${entregasNoHistorico} entrega(s) no histórico estão associadas a esse motorista. O histórico será preservado, mas os pedidos ativos ficarão sem motorista.\n\n💡 Considere "Desativar" em vez de excluir, se quiser manter ele na lista pra consultas futuras.`;
  }
  if (!confirm(aviso)) return;

  // Desatribuir dos pedidos ativos
  for (const p of state.pedidos) {
    if (p.motorista === m.nome) {
      p.motorista = '';
      await dataLayer.pedidos.salvar(p);
    }
  }

  await dataLayer.motoristas.excluir(id, m.nome);
  fecharModal();
  render();
}

async function toggleAtivoMotorista(id) {
  const m = (state.motoristasCadastrados || []).find(x => x.id === id);
  if (!m) return;
  m.ativo = !m.ativo;
  await dataLayer.motoristas.salvar(m);
  render();
}

async function salvarVeiculo(id) {
  const nome = document.getElementById('v_nome').value.trim();
  const cor = document.getElementById('v_cor').value;
  const erro = document.getElementById('veiculo_erro');

  if (!nome) {
    erro.textContent = 'Nome é obrigatório.';
    erro.style.display = 'block';
    return;
  }

  // Gerar código único a partir do nome (caminhao, moto, etc.)
  const gerarCodigo = (n) => n.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');

  if (id) {
    const v = state.veiculosCadastrados.find(x => x.id === id);
    if (v) {
      v.nome = nome;
      v.cor = cor;
      // Mantém o código antigo (não muda) pra não quebrar pedidos existentes
      await dataLayer.veiculos.salvar(v);
    }
  } else {
    const novoId = 'v-' + Date.now();
    let codigo = gerarCodigo(nome);
    // Se já existir um veículo com esse código, adiciona sufixo
    let sufixo = 1;
    const codigoBase = codigo;
    while ((state.veiculosCadastrados || []).some(v => v.codigo === codigo)) {
      sufixo++;
      codigo = codigoBase + sufixo;
    }
    const novo = { id: novoId, codigo, nome, cor, ativo: true };
    await dataLayer.veiculos.salvar(novo);
  }

  fecharModal();
  render();
}

async function excluirVeiculo(id) {
  const v = (state.veiculosCadastrados || []).find(x => x.id === id);
  if (!v) return;

  const pedidosComVeiculo = state.pedidos.filter(p => p.veiculo === v.codigo).length;
  let aviso = `Excluir o veículo "${v.nome}"?`;
  if (pedidosComVeiculo > 0) {
    aviso += `\n\nAtenção: ${pedidosComVeiculo} pedido(s) usam esse veículo. Considere "Desativar" em vez de excluir.`;
  }
  if (!confirm(aviso)) return;

  await dataLayer.veiculos.excluir(id, v.codigo);
  fecharModal();
  render();
}

async function toggleAtivoVeiculo(id) {
  const v = (state.veiculosCadastrados || []).find(x => x.id === id);
  if (!v) return;
  v.ativo = !v.ativo;
  await dataLayer.veiculos.salvar(v);
  render();
}

/** Renderiza a lista de contas Bling cadastradas. */
async function renderContasBling() {
  const el = document.getElementById('bling-contas-lista');
  if (!el) return;

  if (!supabaseClient) {
    el.innerHTML = `
      <div style="text-align:center;padding:30px 20px;color:var(--ink-2);">
        <div style="font-size:28px;margin-bottom:8px;">🔌</div>
        <div style="font-size:14px;font-weight:500;color:var(--ink);margin-bottom:4px;">
          Supabase não conectado
        </div>
        <div style="font-size:12px;">
          Ative o modo Supabase no painel acima para usar a integração Bling.
        </div>
      </div>
    `;
    return;
  }

  // Aviso crítico: se modo Supabase Pedidos estiver OFF, sincronização não vai persistir
  // (já vivemos esse bug — pedidos sumiram porque foram só pra memória local)
  const modoPedidosOff = !supabaseMode.pedidos;

  try {
    const contas = await listarContasBling();

    if (contas.length === 0) {
      el.innerHTML = `
        <div style="text-align:center;padding:30px 20px;color:var(--ink-2);">
          <div style="font-size:28px;margin-bottom:8px;">📭</div>
          <div style="font-size:14px;font-weight:500;color:var(--ink);margin-bottom:4px;">
            Nenhuma conta Bling cadastrada ainda
          </div>
          <div style="font-size:12px;">
            Use o SQL Editor do Supabase para inserir contas na tabela <code>bling_contas</code>.
          </div>
        </div>
      `;
      return;
    }

    // Conta quantas contas estão prontas pra sincronizar (conectadas)
    const conectadas = contas.filter(c => !!c.access_token && !!c.expires_at);

    // Banner de aviso (modo OFF) ou botão Sincronizar TODAS
    let topo = '';
    if (modoPedidosOff) {
      topo = `
        <div style="
          background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;
          padding:12px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;
        ">
          <strong>⚠️ Modo Supabase de Pedidos está DESATIVADO!</strong><br>
          Se sincronizar agora, os pedidos vão pra memória do navegador e podem ser perdidos ao fechar a aba.
          Ative em <strong>"Modo Supabase"</strong> abaixo (cartão "Pedidos") antes de sincronizar.
        </div>
      `;
    } else if (conectadas.length > 1) {
      // Só faz sentido o botão "Sincronizar TODAS" quando tem mais de 1 conta conectada
      topo = `
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
          <button class="btn btn-primary btn-sm" onclick="sincronizarTodasContas()">
            📥 Sincronizar TODAS (${conectadas.length} contas)
          </button>
        </div>
      `;
    }

    const cards = contas.map(conta => {
      const conectado = !!conta.access_token && !!conta.expires_at;
      const expirado = conectado && new Date(conta.expires_at) < new Date();
      const statusBadge = !conectado
        ? '<span class="badge" style="background:#fef3c7;color:#92400e;">⚠️ Não conectado</span>'
        : expirado
          ? '<span class="badge" style="background:#fef3c7;color:#92400e;">🔄 Token expirado (renova ao sincronizar)</span>'
          : '<span class="badge badge-entregue">✅ Conectado</span>';

      const ultimaSync = conta.ultima_sync
        ? new Date(conta.ultima_sync).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' })
        : 'Nunca sincronizado';

      const totalSync = conta.total_sincronizados || 0;

      // Se não conectou ainda → botão "Conectar" (faz OAuth)
      // Se conectado mas modo OFF → botão Sincronizar desabilitado
      // Se conectado e modo ON → botão Sincronizar funcional
      let botaoSync;
      if (!conectado) {
        botaoSync = `<button class="btn btn-primary btn-sm" onclick="conectarContaBling('${conta.id}')">🔌 Conectar</button>`;
      } else if (modoPedidosOff) {
        botaoSync = `<button class="btn btn-secondary btn-sm" disabled title="Ative o Modo Supabase Pedidos antes de sincronizar">📥 Sincronizar</button>`;
      } else {
        botaoSync = `<button class="btn btn-primary btn-sm" onclick="sincronizarConta('${conta.id}')">📥 Sincronizar</button>`;
      }

      return `
        <div class="bling-conta-card" data-conta-id="${conta.id}" style="
          border:1px solid var(--line);border-radius:8px;padding:14px 16px;
          margin-bottom:10px;background:var(--surface);
        ">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
            <div style="flex:1;min-width:200px;">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <strong style="font-size:14px;">${conta.nome}</strong>
                <span class="mono" style="font-size:11px;color:var(--ink-2);background:var(--surface-2);padding:2px 6px;border-radius:4px;">
                  ${conta.prefixo}
                </span>
                ${statusBadge}
              </div>
              <div style="font-size:11px;color:var(--ink-2);margin-top:6px;">
                Última sincronização: ${ultimaSync} · ${totalSync} pedido(s) já importado(s)
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${botaoSync}
            </div>
          </div>
          <div id="sync-progresso-${conta.id}" style="margin-top:10px;display:none;">
            <div style="font-size:12px;color:var(--accent);"></div>
          </div>
        </div>
      `;
    }).join('');

    el.innerHTML = topo + cards;

  } catch (e) {
    console.error('Erro ao renderizar contas Bling:', e);
    el.innerHTML = `
      <div style="color:var(--err);padding:20px;text-align:center;">
        Erro ao carregar contas Bling: ${e.message}
      </div>
    `;
  }
}

// Lock global pra prevenir cliques múltiplos durante sincronização.
// Necessário porque a renderContasBling re-renderiza cards e cria novos botões,
// invalidando o `disabled` em DOM. O lock global é à prova de qualquer re-render.
let _sincronizacaoEmAndamento = false;

/** Sincroniza uma conta Bling específica (chamado pelo botão). */
async function sincronizarConta(contaId) {
  // M4: Guarda anti-clique-duplo. Se já tá rodando, ignora.
  if (_sincronizacaoEmAndamento) {
    console.warn('Sincronização já em andamento, ignorando clique.');
    return;
  }

  // M5: Bloqueia se modo Supabase Pedidos estiver OFF (evita perda silenciosa)
  if (!supabaseMode.pedidos) {
    alert('⚠️ O modo Supabase de Pedidos está DESATIVADO.\n\nAtive em "Modo Supabase" abaixo (cartão "Pedidos") antes de sincronizar.\n\nSem isso, os pedidos importados ficam só na memória do navegador e podem ser perdidos.');
    return;
  }

  const card = document.querySelector(`.bling-conta-card[data-conta-id="${contaId}"]`);
  if (!card) return;

  const progressoEl = document.getElementById(`sync-progresso-${contaId}`);
  const progressoTexto = progressoEl?.querySelector('div');
  const botao = card.querySelector('button.btn-primary');

  // M4: Marca lock global e desabilita botão IMEDIATAMENTE (antes de qualquer await)
  _sincronizacaoEmAndamento = true;
  if (botao) {
    botao.disabled = true;
    botao.innerHTML = '⏳ Sincronizando...';
  }
  if (progressoEl) progressoEl.style.display = 'block';

  // Buscar dados da conta
  let conta;
  try {
    const contas = await listarContasBling();
    conta = contas.find(c => c.id === contaId);
    if (!conta) throw new Error('Conta não encontrada');
  } catch (e) {
    alert('Erro ao buscar dados da conta: ' + e.message);
    _sincronizacaoEmAndamento = false;
    if (botao) {
      botao.disabled = false;
      botao.innerHTML = '📥 Sincronizar';
    }
    return;
  }

  try {
    const stats = await sincronizarContaBling(conta, (msg) => {
      if (progressoTexto) progressoTexto.textContent = msg;
    });

    // Re-renderiza a lista de contas (atualiza ultima_sync, total)
    await renderContasBling();

    // M2 + M6: mensagens distintas pra cada caso, e navegação automática
    if (stats.total === 0) {
      alert(`✅ Sincronização concluída!\n\nNenhum pedido em "Expedição" no Bling no momento.\n\nDica: confirme que tem pedidos com situação "Expedição" no Bling antes de sincronizar.`);
    } else if (stats.novos === 0 && stats.jaExistiam === stats.total) {
      alert(`✅ Tudo em dia!\n\nOs ${stats.total} pedidos em "Expedição" no Bling já estão no painel.\nNão há novidades para importar.`);
    } else {
      let msg = `✅ Sincronização concluída!\n\n`;
      msg += `📊 Pedidos em "Expedição" no Bling: ${stats.total}\n`;
      msg += `🆕 Novos importados: ${stats.novos}\n`;
      msg += `⏭️ Já estavam no painel: ${stats.jaExistiam}\n`;
      if (stats.erros > 0) {
        msg += `⚠️ Erros ao processar: ${stats.erros} (veja console)\n`;
      }
      alert(msg);

      // M6: Se importou pelo menos 1 pedido novo, navega pro Painel logístico
      // pra você ver imediatamente
      if (stats.novos > 0) {
        currentView = 'painel';
        render();
      }
    }

  } catch (e) {
    alert(`❌ Erro na sincronização:\n${e.message}\n\nConfira o console para detalhes.`);
    console.error('Erro completo:', e);
  } finally {
    // Libera o lock — independentemente do resultado
    _sincronizacaoEmAndamento = false;

    // O botão pode ter sido recriado pela renderContasBling,
    // mas resetamos o estado caso ainda exista
    if (botao && document.body.contains(botao)) {
      botao.disabled = false;
      botao.innerHTML = '📥 Sincronizar';
    }
    if (progressoEl && document.body.contains(progressoEl)) {
      progressoEl.style.display = 'none';
    }
  }
}

/* ===================================================================
   AUTO-SYNC BLING — sincroniza as contas Bling automaticamente em background
   ===================================================================
   - Intervalo: 15 minutos
   - Estado persistido no localStorage (sobrevive a reload)
   - Lock _sincronizacaoEmAndamento evita disparo duplo (manual + auto)
   - Silencioso: sem alerts, sem confirms, sem mexer em currentView
   - Re-renderiza só se importou pedidos novos
*/
const AUTO_SYNC_KEY = 'malba_autosync_bling_ativo';
const AUTO_SYNC_INTERVALO_MS = 15 * 60 * 1000; // 15 minutos
let _autoSyncTimerId = null;
let _autoSyncUltimaExecucao = null;

/** Lê do localStorage se o auto-sync está ativado. Default: false. */
function autoSyncEstaAtivo() {
  return localStorage.getItem(AUTO_SYNC_KEY) === '1';
}

/** Liga ou desliga o auto-sync, persistindo a preferência. */
function setAutoSyncBling(ativo) {
  if (ativo) {
    localStorage.setItem(AUTO_SYNC_KEY, '1');
    iniciarAutoSyncBling();
  } else {
    localStorage.removeItem(AUTO_SYNC_KEY);
    pararAutoSyncBling();
  }
}

/** Inicia o timer de auto-sync. Idempotente — não cria duplicatas se já tem. */
function iniciarAutoSyncBling() {
  if (_autoSyncTimerId) return; // já tá rodando
  if (!supabaseClient || !supabaseMode.pedidos) {
    console.warn('[auto-sync] Supabase/pedidos desativado, não vai iniciar.');
    return;
  }
  console.log(`[auto-sync] Iniciado — vai rodar a cada ${AUTO_SYNC_INTERVALO_MS / 60000} min.`);
  _autoSyncTimerId = setInterval(executarAutoSyncBling, AUTO_SYNC_INTERVALO_MS);
}

/** Para o timer de auto-sync. */
function pararAutoSyncBling() {
  if (_autoSyncTimerId) {
    clearInterval(_autoSyncTimerId);
    _autoSyncTimerId = null;
    console.log('[auto-sync] Parado.');
  }
}

/** Executa um ciclo de auto-sync (silencioso). Chamado pelo setInterval. */
async function executarAutoSyncBling() {
  // Lock: se sync manual ou outro auto tá rodando, pula este ciclo
  if (_sincronizacaoEmAndamento) {
    console.log('[auto-sync] Skip — sincronização já em andamento.');
    return;
  }
  // Se a tabela de pedidos não tá ativa, nada a fazer
  if (!supabaseMode.pedidos || !supabaseClient) {
    console.warn('[auto-sync] Skip — Supabase/pedidos inativo.');
    return;
  }

  console.log('[auto-sync] Iniciando ciclo:', new Date().toLocaleTimeString('pt-BR'));
  _autoSyncUltimaExecucao = new Date();

  try {
    await sincronizarTodasContasSilencioso();
  } catch (e) {
    console.error('[auto-sync] Erro no ciclo:', e);
  }
}

/** Versão silenciosa do sincronizarTodasContas — sem alert, sem confirm,
 *  sem mexer em currentView. Re-renderiza só se importou novos pedidos. */
async function sincronizarTodasContasSilencioso() {
  if (_sincronizacaoEmAndamento) return;
  if (!supabaseMode.pedidos) return;

  const contas = await listarContasBling();
  const conectadas = contas.filter(c => !!c.access_token && !!c.expires_at);
  if (conectadas.length === 0) return;

  _sincronizacaoEmAndamento = true;
  const totalStats = { total: 0, novos: 0, jaExistiam: 0, erros: 0 };

  try {
    for (const conta of conectadas) {
      try {
        const stats = await sincronizarContaBling(conta, () => {});
        totalStats.total += stats.total;
        totalStats.novos += stats.novos;
        totalStats.jaExistiam += stats.jaExistiam;
        totalStats.erros += stats.erros;
      } catch (e) {
        console.error(`[auto-sync] Erro na conta ${conta.nome}:`, e);
        totalStats.erros++;
      }
    }

    console.log('[auto-sync] Ciclo concluído:', totalStats);

    // Re-renderiza só se importou novos pedidos (pra não atrapalhar o gestor à toa)
    if (totalStats.novos > 0) {
      render();
    }
  } finally {
    _sincronizacaoEmAndamento = false;
  }
}

/** M1: Sincroniza TODAS as contas Bling conectadas em sequência. */
async function sincronizarTodasContas() {
  if (_sincronizacaoEmAndamento) {
    console.warn('Sincronização já em andamento, ignorando clique.');
    return;
  }

  if (!supabaseMode.pedidos) {
    alert('⚠️ O modo Supabase de Pedidos está DESATIVADO.\n\nAtive antes de sincronizar.');
    return;
  }

  const contas = await listarContasBling();
  const conectadas = contas.filter(c => !!c.access_token && !!c.expires_at);

  if (conectadas.length === 0) {
    alert('Nenhuma conta Bling conectada.');
    return;
  }

  if (!confirm(`Sincronizar ${conectadas.length} contas Bling em sequência?\n\nEsperado: ${conectadas.length * 5} a ${conectadas.length * 30} segundos.`)) {
    return;
  }

  _sincronizacaoEmAndamento = true;

  // Stats agregados
  const totalStats = { total: 0, novos: 0, jaExistiam: 0, erros: 0 };
  const resumoPorConta = [];

  try {
    for (let i = 0; i < conectadas.length; i++) {
      const conta = conectadas[i];
      const card = document.querySelector(`.bling-conta-card[data-conta-id="${conta.id}"]`);
      const progressoEl = card?.querySelector('[id^="sync-progresso-"]');
      const progressoTexto = progressoEl?.querySelector('div');

      if (progressoEl) progressoEl.style.display = 'block';
      if (progressoTexto) progressoTexto.textContent = `(${i + 1} de ${conectadas.length}) Iniciando ${conta.nome}...`;

      try {
        const stats = await sincronizarContaBling(conta, (msg) => {
          if (progressoTexto) progressoTexto.textContent = `(${i + 1} de ${conectadas.length}) ${msg}`;
        });
        totalStats.total += stats.total;
        totalStats.novos += stats.novos;
        totalStats.jaExistiam += stats.jaExistiam;
        totalStats.erros += stats.erros;
        resumoPorConta.push(`${conta.nome}: +${stats.novos} novos`);
      } catch (e) {
        console.error(`Erro na conta ${conta.nome}:`, e);
        totalStats.erros++;
        resumoPorConta.push(`${conta.nome}: ❌ ${e.message}`);
      }

      if (progressoEl) progressoEl.style.display = 'none';
    }

    await renderContasBling();

    let msg = `✅ Sincronização de TODAS as contas concluída!\n\n`;
    msg += `📊 Total em "Expedição": ${totalStats.total}\n`;
    msg += `🆕 Novos importados: ${totalStats.novos}\n`;
    msg += `⏭️ Já estavam no painel: ${totalStats.jaExistiam}\n`;
    if (totalStats.erros > 0) {
      msg += `⚠️ Erros: ${totalStats.erros}\n`;
    }
    msg += `\nDetalhe por conta:\n` + resumoPorConta.join('\n');
    alert(msg);

    if (totalStats.novos > 0) {
      currentView = 'painel';
      render();
    }
  } finally {
    _sincronizacaoEmAndamento = false;
  }
}

/** Conta quantas senhas no estado atual não estão criptografadas. */
function contarSenhasNaoCriptografadas() {
  let total = 0;
  // Senha do gestor
  if (state.senhaGestor && !ehHashBcrypt(state.senhaGestor)) total++;
  // Senhas dos motoristas
  (state.motoristasCadastrados || []).forEach(m => {
    if (m.senha && !ehHashBcrypt(m.senha)) total++;
  });
  return total;
}

/** Abre modal pra confirmar e executar a criptografia em lote. */
function abrirCriptografarSenhas() {
  const total = contarSenhasNaoCriptografadas();
  if (total === 0) {
    alert('Todas as senhas já estão criptografadas.');
    return;
  }

  abrirModal({
    titulo: '🔐 Criptografar senhas existentes',
    body: `
      <div style="font-size:13px;line-height:1.6;">
        <p>Esta ação vai converter <strong>${total} senha(s)</strong> que estão em texto puro para hash criptografado (bcrypt).</p>

        <div style="background:var(--ok-soft);color:var(--ok);padding:12px 14px;border-radius:var(--radius);margin:14px 0;">
          <strong>✓ O que NÃO muda:</strong><br>

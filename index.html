/* =====================================================================
   ABA RESULTADOS — Gestão à vista (motorista)
   =====================================================================
   3 gráficos lado a lado mostrando os 3 meses de um trimestre:
     1. Volume de entregas (barras agrupadas por motorista)
     2. Custo por entrega (próprio vs terceiro)
     3. Combustível por entrega (linha temporal)
   Política de "gestão à vista" — todos veem os mesmos dados.
   No GESTOR esses 3 gráficos aparecem dentro do Dashboard, não numa aba à parte.
*/

const NOMES_MESES_BR = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                         'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

// Mapa: nome do trimestre -> array dos 3 meses (em ordem)
const TRIMESTRES = {
  '1T': ['Janeiro', 'Fevereiro', 'Março'],
  '2T': ['Abril', 'Maio', 'Junho'],
  '3T': ['Julho', 'Agosto', 'Setembro'],
  '4T': ['Outubro', 'Novembro', 'Dezembro'],
};

/** Retorna o trimestre atual baseado no mês de hoje. */
function trimestreAtual() {
  const m = new Date().getMonth(); // 0-11
  if (m < 3) return '1T';
  if (m < 6) return '2T';
  if (m < 9) return '3T';
  return '4T';
}

// Estado: qual trimestre o usuário tá olhando (default = trimestre atual)
let resultadosTrimestreSelecionado = trimestreAtual();

// Quando o user clica numa barra mensal do Malba Coins, este estado guarda
// o nome do mês selecionado pra mostrar no placar. null = trimestre todo.
let malbaCoinsMesFoco = null;

/** Helper: retorna o número de entregas EFETIVAS de um motorista num mês.
 *  Manuais sobrescrevem calculadas (entregasManuais !== null tem prioridade). */
function entregasEfetivas(linha) {
  if (!linha) return 0;
  if (linha.entregasManuais !== null && linha.entregasManuais !== undefined) {
    return linha.entregasManuais;
  }
  return linha.entregasCalculadas || 0;
}

/** Retorna lista de entregas por motorista pra um mês específico (case insensitive). */
function entregasPorMotoristaDoMes(mesNome) {
  if (!mesNome) return [];
  const target = mesNome.toLowerCase().trim();
  return (state.entregasPorMotorista || []).filter(e =>
    (e.mes || '').toLowerCase().trim() === target
  );
}

/** Busca os dados de custosMensais pra um mês específico (case insensitive). */
function dadosDoMes(mesNome) {
  if (!mesNome) return null;
  const target = mesNome.toLowerCase().trim();
  return (state.custosMensais || []).find(m =>
    (m.mes || '').toLowerCase().trim() === target
  ) || null;
}

/** Calcula entregas próprias / terceiro / total / custo unitário pra um mês.
 *  Estratégia em 2 fontes:
 *    - state.entregasPorMotorista (NOVA, dinâmica) → preferida quando há dados
 *    - state.custosMensais (LEGADO, colunas fixas) → fallback
 *  Devolve também `motoristasProprios` (lista detalhada) pro Malba Coins.
 */
function calcularMetricasMes(dados, mesNome) {
  // Pega lista de motoristas-mês (estrutura nova)
  const linhasMes = entregasPorMotoristaDoMes(mesNome);

  // Lista detalhada de motoristas próprios ATIVOS (pra Malba Coins, etc)
  // Ignora motoristas desativados — mesmo se tiverem registros antigos em
  // entregas_por_motorista, eles não devem aparecer nos gráficos.
  const motoristasProprios = linhasMes
    .filter(l => l.motoristaTipo === 'proprio' && l.motoristaAtivo !== false)
    .map(l => ({
      id: l.motoristaId,
      nome: l.motoristaNome,
      entregas: entregasEfetivas(l),
      valorBonus: l.valorBonus || 4.00
    }));

  // Determina entregas próprias e terceiras
  let proprias, terceiras, custoTerceiroTotal, totalBonusProprios;

  if (linhasMes.length > 0) {
    // ===== Fonte NOVA (entregasPorMotorista) =====
    proprias = motoristasProprios.reduce((s, m) => s + m.entregas, 0);
    const linhasTerceiros = linhasMes.filter(l => l.motoristaTipo === 'terceiro' && l.motoristaAtivo !== false);
    terceiras = linhasTerceiros.reduce((s, l) => s + entregasEfetivas(l), 0);
    custoTerceiroTotal = linhasTerceiros.reduce((s, l) => s + (l.custoTerceiroTotal || 0), 0);
    totalBonusProprios = motoristasProprios.reduce((s, m) => s + (m.entregas * m.valorBonus), 0);
  } else if (dados) {
    // ===== Fallback: fonte LEGADO (custosMensais com colunas fixas) =====
    const gildo = dados.gildo || 0;
    const motorista2 = dados.motorista2 || 0;
    proprias = gildo + motorista2;
    terceiras = dados.j3uber || 0;
    custoTerceiroTotal = dados.custoTerceiroTotal || 0;
    totalBonusProprios = (dados.bonusM1 || 0) + (dados.bonusM2 || 0);
    // Reconstrói motoristasProprios "fakes" pro malba coins continuar funcionando
    motoristasProprios.push(
      { id: 'legacy-gildo', nome: 'Gildo', entregas: gildo, valorBonus: 4.00 },
      { id: 'legacy-daniel', nome: 'Daniel', entregas: motorista2, valorBonus: 4.00 }
    );
  } else {
    proprias = 0; terceiras = 0; custoTerceiroTotal = 0; totalBonusProprios = 0;
  }

  const total = proprias + terceiras;

  // Custos gerais sempre vêm de state.custosMensais (são por mês, não por motorista)
  const fixo = (dados && dados.fixo) || 0;
  const combustivel = (dados && dados.combustivel) || 0;
  const manutencao = (dados && dados.manutencao) || 0;
  const extra = (dados && dados.extra) || 0;

  const custoProprioTotal = fixo + combustivel + manutencao + extra + totalBonusProprios;

  return {
    mes: mesNome,
    // Compatibilidade com gráficos antigos (gildo, motorista2, j3uber):
    // pegamos do array motoristasProprios os 2 primeiros e somamos terceiros
    gildo: motoristasProprios.find(m => m.nome === 'Gildo')?.entregas || 0,
    motorista2: motoristasProprios.find(m => m.nome === 'Daniel')?.entregas || 0,
    j3uber: terceiras,
    // Estrutura nova (preferida pra novos componentes)
    motoristasProprios,
    proprias,
    terceiras,
    total,
    combustivel,
    custoProprioTotal,
    custoProprioUn: proprias > 0 ? custoProprioTotal / proprias : 0,
    custoTerceiroTotal,
    custoTerceiroUn: terceiras > 0 ? custoTerceiroTotal / terceiras : 0,
    combustivelUn: total > 0 ? combustivel / total : 0,
    totalBonusProprios,
  };
}

/** Helper: formata número simples (sem casas decimais se for inteiro). */
function fmtNumInt(v) {
  return Math.round(v || 0).toLocaleString('pt-BR');
}

/** Renderiza a tela inteira da aba Resultados (motorista). */
function renderResultadosEmBreve() {
  const meses = TRIMESTRES[resultadosTrimestreSelecionado] || TRIMESTRES['1T'];
  const metricas = meses.map(m => calcularMetricasMes(dadosDoMes(m), m));
  const temAlgumDado = metricas.some(m => m.total > 0);

  // Dropdown de trimestres
  const dropdown = Object.keys(TRIMESTRES).map(t =>
    `<option value="${t}" ${t === resultadosTrimestreSelecionado ? 'selected' : ''}>${t}</option>`
  ).join('');

  return `
    <div class="page resultados-page">
      <div class="resultados-header">
        <div>
          <h1 class="resultados-titulo">📊 Resultados</h1>
          <div class="resultados-sub">Gestão à vista — visão trimestral</div>
        </div>
        <div class="resultados-filtro">
          <label for="resultados_trim">Trimestre:</label>
          <select id="resultados_trim" onchange="trocarTrimestreResultados(this.value)">
            ${dropdown}
          </select>
        </div>
      </div>

      ${!temAlgumDado ? `
        <div class="empty">
          <h3>Sem dados pra mostrar neste trimestre</h3>
          <p>Os dados aparecem aqui quando o gestor lançar custos mensais (Custos → Editar).</p>
        </div>
      ` : `
        <div class="resultados-trimestre-info">
          ${resultadosTrimestreSelecionado} · <strong>${meses[0]}</strong>, <strong>${meses[1]}</strong> e <strong>${meses[2]}</strong>
        </div>

        ${renderGaleriaGraficos(metricas)}
      `}
    </div>
  `;
}

/** Trocar trimestre selecionado no dropdown — re-renderiza a tela. */
function trocarTrimestreResultados(t) {
  resultadosTrimestreSelecionado = t;
  malbaCoinsMesFoco = null; // reset do foco — mês de outro trimestre não faz sentido
  render();
}

/* ==================== GALERIA DESLIZÁVEL DE GRÁFICOS ==================== */

/* Índice do gráfico atualmente visível na galeria (persiste em sessionStorage
   pra sobreviver a re-renders sem perder a posição que o usuário tava vendo). */
let galeriaGraficoAtivo = parseInt(sessionStorage.getItem('malba_galeria_grafico') || '0', 10) || 0;

/* Mês selecionado no gráfico "Valor entregue × Entregas" (formato 'AAAA-MM'). */
let valorEntreguesMesSelecionado = sessionStorage.getItem('malba_valor_entregue_mes') || (() => {
  // Default: mês atual
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
})();

/** Renderiza a galeria deslizável com 4 gráficos. Recebe o array de métricas
    do trimestre atual e retorna o HTML completo (header + pista + bolinhas). */
function renderGaleriaGraficos(metricas) {
  const ehGestor = perfilAtivo === 'gestor';

  const graficos = [
    { titulo: 'Volume de entregas',     sub: 'Quantidade de entregas por motorista', svg: renderGraficoVolume(metricas) },
    { titulo: 'Custo por entrega',       sub: 'Comparação de custo unitário entre próprio e terceiro', svg: renderGraficoCustoPorEntrega(metricas) },
    { titulo: 'Combustível por entrega', sub: 'Quanto custou de combustível por entrega', svg: renderGraficoCombustivel(metricas) },
    { titulo: 'Malba Coins',             sub: 'Acumulado de moedas dos motoristas próprios', svg: renderGraficoMalbaCoins(metricas) },
    { titulo: 'Tempo médio por entrega', sub: 'Duração média de cada entrega (em minutos)', svg: renderGraficoTempo(metricas, 'tempoMedioEntrega') },
    { titulo: 'Tempo entre entregas',    sub: 'Tempo médio de intervalo entre entregas consecutivas no mesmo dia', svg: renderGraficoTempo(metricas, 'tempoEntreEntregas') },
  ];

  // Só gestor vê o gráfico de valor entregue (informação financeira sensível)
  if (ehGestor) {
    graficos.push({
      titulo: 'Valor entregue × Entregas',
      sub: 'Total faturado e quantidade de entregas por motorista no mês selecionado',
      svg: renderGraficoValorEntregues()
    });
    graficos.push({
      titulo: 'Custo fixo diário',
      sub: 'Custo fixo mensal dividido pelos dias úteis do mês',
      svg: renderGraficoCustoFixoDiario()
    });
  }

  // Garante que o índice ativo é válido (se mudou o número de gráficos, reset)
  if (galeriaGraficoAtivo < 0 || galeriaGraficoAtivo >= graficos.length) {
    galeriaGraficoAtivo = 0;
  }

  const ativo = graficos[galeriaGraficoAtivo];
  const totalGraficos = graficos.length;

  // Cada slide ocupa 100% da largura — translateX move pra esquerda em múltiplos
  const offsetX = galeriaGraficoAtivo * 100;

  const slidesHtml = graficos.map((g, idx) => `
    <div class="galeria-slide" data-idx="${idx}" aria-hidden="${idx !== galeriaGraficoAtivo}">
      ${g.svg}
    </div>
  `).join('');

  const bolinhasHtml = graficos.map((g, idx) => `
    <button class="galeria-bolinha ${idx === galeriaGraficoAtivo ? 'ativa' : ''}"
            onclick="irParaGraficoGaleria(${idx})"
            aria-label="Ver ${g.titulo}"
            title="${g.titulo}"></button>
  `).join('');

  return `
    <div class="galeria-graficos">
      <div class="galeria-header">
        <div>
          <h2 class="galeria-titulo" id="galeria-titulo">${ativo.titulo}</h2>
          <div class="galeria-sub" id="galeria-sub">${ativo.sub}</div>
        </div>
        <div class="galeria-sub" style="font-family: var(--mono); font-size: 11px;">
          <span id="galeria-contador">${galeriaGraficoAtivo + 1} / ${totalGraficos}</span>
        </div>
      </div>

      <div class="galeria-pista-wrap" id="galeria-pista-wrap">
        <button class="galeria-seta esq" onclick="navegarGaleria(-1)" aria-label="Gráfico anterior"
                ${galeriaGraficoAtivo === 0 ? 'disabled' : ''}>‹</button>
        <button class="galeria-seta dir" onclick="navegarGaleria(1)" aria-label="Próximo gráfico"
                ${galeriaGraficoAtivo === totalGraficos - 1 ? 'disabled' : ''}>›</button>

        <div class="galeria-pista" id="galeria-pista" style="transform: translateX(-${offsetX}%);">
          ${slidesHtml}
        </div>
      </div>

      <div class="galeria-bolinhas" role="tablist">
        ${bolinhasHtml}
      </div>
    </div>
  `;
}

/** Retorna o total de gráficos visíveis pro perfil atual. */
function galeriaTotalGraficos() {
  // Motorista: 6 (sem os gráficos financeiros)
  // Gestor: 8 (com Valor entregue + Custo fixo diário)
  return perfilAtivo === 'gestor' ? 8 : 6;
}

/** Retorna o array de títulos visíveis pro perfil atual. */
function galeriaTitulosVisiveis() {
  const titulos = [
    { titulo: 'Volume de entregas',     sub: 'Quantidade de entregas por motorista' },
    { titulo: 'Custo por entrega',       sub: 'Comparação de custo unitário entre próprio e terceiro' },
    { titulo: 'Combustível por entrega', sub: 'Quanto custou de combustível por entrega' },
    { titulo: 'Malba Coins',             sub: 'Acumulado de moedas dos motoristas próprios' },
    { titulo: 'Tempo médio por entrega', sub: 'Duração média de cada entrega (em minutos)' },
    { titulo: 'Tempo entre entregas',    sub: 'Tempo médio de intervalo entre entregas consecutivas no mesmo dia' },
  ];
  if (perfilAtivo === 'gestor') {
    titulos.push({
      titulo: 'Valor entregue × Entregas',
      sub: 'Total faturado e quantidade de entregas por motorista no mês selecionado'
    });
    titulos.push({
      titulo: 'Custo fixo diário',
      sub: 'Custo fixo mensal dividido pelos dias úteis do mês'
    });
  }
  return titulos;
}

/** Vai pra um gráfico específico. Atualiza estado, anima e atualiza UI sem rerender. */
function irParaGraficoGaleria(idx) {
  const total = galeriaTotalGraficos();
  if (idx < 0 || idx >= total) return;
  galeriaGraficoAtivo = idx;
  sessionStorage.setItem('malba_galeria_grafico', String(idx));

  // Atualiza a transform da pista
  const pista = document.getElementById('galeria-pista');
  if (pista) pista.style.transform = `translateX(-${idx * 100}%)`;

  // Atualiza bolinhas
  document.querySelectorAll('.galeria-bolinha').forEach((b, i) => {
    b.classList.toggle('ativa', i === idx);
  });

  // Atualiza setas (habilita/desabilita)
  const setaEsq = document.querySelector('.galeria-seta.esq');
  const setaDir = document.querySelector('.galeria-seta.dir');
  if (setaEsq) setaEsq.disabled = idx === 0;
  if (setaDir) setaDir.disabled = idx === total - 1;

  // Atualiza título + subtítulo + contador
  const titulos = galeriaTitulosVisiveis();
  const t = titulos[idx];
  const elTitulo = document.getElementById('galeria-titulo');
  const elSub = document.getElementById('galeria-sub');
  const elContador = document.getElementById('galeria-contador');
  if (elTitulo) elTitulo.textContent = t.titulo;
  if (elSub) elSub.textContent = t.sub;
  if (elContador) elContador.textContent = `${idx + 1} / ${total}`;

  // Atualiza atributo aria-hidden dos slides
  document.querySelectorAll('.galeria-slide').forEach((s, i) => {
    s.setAttribute('aria-hidden', String(i !== idx));
  });

  // Se o Malba Coins (último) entrou em cena, reanima os números/barras dele
  if (idx === 3) {
    requestAnimationFrame(() => animarNumerosMalbaCoins());
  }
}

/** Navega +1 ou -1 a partir do gráfico atual. */
function navegarGaleria(direcao) {
  const novoIdx = galeriaGraficoAtivo + direcao;
  if (novoIdx >= 0 && novoIdx < galeriaTotalGraficos()) {
    irParaGraficoGaleria(novoIdx);
  }
}

/** Ativa swipe nos slides (touch). Chamado depois do render. */
function ativarSwipeGaleria() {
  const wrap = document.getElementById('galeria-pista-wrap');
  if (!wrap || wrap.dataset.swipeAtivo === '1') return;
  wrap.dataset.swipeAtivo = '1';

  // === TOUCH (mobile/tablet) ===
  let touchInicioX = 0;
  let touchInicioY = 0;
  let arrastando = false;

  wrap.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    touchInicioX = e.touches[0].clientX;
    touchInicioY = e.touches[0].clientY;
    arrastando = true;
  }, { passive: true });

  wrap.addEventListener('touchend', (e) => {
    if (!arrastando) return;
    arrastando = false;
    const dx = (e.changedTouches[0]?.clientX || 0) - touchInicioX;
    const dy = (e.changedTouches[0]?.clientY || 0) - touchInicioY;
    // Só conta como swipe horizontal se o movimento X foi maior que o Y
    // (evita interferir com scroll vertical da página)
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      navegarGaleria(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // === WHEEL / TOUCHPAD (notebook) ===
  // Trackpad de notebook manda vários eventos wheel em sequência quando você
  // desliza 2 dedos. Precisamos:
  // 1. Detectar direção do gesto: horizontal (deltaX) troca gráfico, vertical (deltaY) deixa rolar a página
  // 2. Acumular o deslocamento até um threshold (evita mudanças acidentais)
  // 3. Depois de trocar, "cooldown" pra ignorar eventos residuais (inércia do trackpad)
  let acumuladoX = 0;
  let cooldownAte = 0;
  const THRESHOLD = 60;      // pixels acumulados pra trocar gráfico
  const COOLDOWN_MS = 500;   // tempo de bloqueio após uma troca

  wrap.addEventListener('wheel', (e) => {
    const agora = Date.now();

    // Detecta se o gesto é predominantemente horizontal
    const ehHorizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);

    // Se for vertical (rolar página), não intervir — deixa o browser fazer scroll normal
    if (!ehHorizontal) {
      acumuladoX = 0; // reseta acumulador (usuário mudou pra scroll vertical)
      return;
    }

    // A partir daqui é gesto horizontal — cancelamos o scroll padrão
    // (evita que a página role de lado, o que seria estranho aqui)
    e.preventDefault();

    // Se estamos em cooldown, ignora (evita trocar 5 gráficos por 1 gesto)
    if (agora < cooldownAte) return;

    // Acumula o deslocamento
    acumuladoX += e.deltaX;

    // Se passou do threshold, troca o gráfico e entra em cooldown
    if (Math.abs(acumuladoX) >= THRESHOLD) {
      navegarGaleria(acumuladoX > 0 ? 1 : -1);
      acumuladoX = 0;
      cooldownAte = agora + COOLDOWN_MS;
    }
  }, { passive: false });  // passive:false pra poder chamar preventDefault
}

/* ==================== GRÁFICOS (SVG puro) ==================== */

/* ==================== PALETA MODERNA E GRADIENTES ====================
 * Paleta redesenhada — cada motorista ganha 1 cor forte, aplicada com
 * gradiente SVG (topo mais forte, base mais claro). Bordas arredondadas.
 * Cores vibrantes mas legíveis, inspirado em dashboards modernos. */
const PALETA_MOTORISTAS = [
  { forte: '#4f46e5', claro: '#818cf8', label: 'Indigo'  },  // motorista 1
  { forte: '#ec4899', claro: '#f9a8d4', label: 'Rosa'    },  // motorista 2
  { forte: '#f59e0b', claro: '#fcd34d', label: 'Âmbar'   },  // motorista 3
  { forte: '#06b6d4', claro: '#67e8f9', label: 'Ciano'   },  // motorista 4
  { forte: '#8b5cf6', claro: '#c4b5fd', label: 'Violeta' },  // motorista 5
  { forte: '#ef4444', claro: '#fca5a5', label: 'Vermelho'},  // motorista 6
];

const COR_TERCEIROS   = { forte: '#16a34a', claro: '#86efac', label: 'Verde' };
const COR_NEUTRA_INK  = { forte: '#334155', claro: '#94a3b8', label: 'Ardósia' };

/** Retorna a cor pra um motorista pelo índice (round-robin na paleta). */
function corMotoristaPorIdx(idx) {
  return PALETA_MOTORISTAS[idx % PALETA_MOTORISTAS.length];
}

/** Retorna string com os <defs> de gradientes SVG pra usar num gráfico.
 * Cada gradiente vai do topo (cor forte) até a base (cor clara).
 * Gera um gradiente pra cada cor recebida. */
function gerarDefsGradientes(cores, prefixoId) {
  const gradients = cores.map((c, idx) => {
    const id = `${prefixoId}-${idx}`;
    return `
      <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${c.forte}"/>
        <stop offset="100%" stop-color="${c.claro}"/>
      </linearGradient>
    `;
  }).join('');
  return `<defs>${gradients}</defs>`;
}

/** Gráfico 1 — Volume de entregas: barras agrupadas (3 motoristas × 3 meses). */
function renderGraficoVolume(metricas) {
  const W = 900, H = 360;
  const pad = { top: 30, right: 16, bottom: 70, left: 50 };
  const innerW = W - pad.left - pad.right;
  const innerH = H - pad.top - pad.bottom;

  // Identifica todos os motoristas próprios que apareceram em qualquer mês
  // (ordem: primeira ocorrência, pra estabilidade visual)
  const proprios = [];
  metricas.forEach(m => {
    (m.motoristasProprios || []).forEach(mp => {
      if (!proprios.find(p => p.id === mp.id)) {
        proprios.push({ id: mp.id, nome: mp.nome });
      }
    });
  });

  // Paleta MODERNA: cada motorista ganha um objeto { forte, claro } pra gradiente
  const coresUsadas = proprios.map((mp, idx) => corMotoristaPorIdx(idx));
  const corTerceiros = COR_TERCEIROS;
  const todasCores = [...coresUsadas, corTerceiros];

  // Construir séries: 1 por motorista próprio + 1 "Terceiros" agregada
  const series = [
    ...proprios.map((mp, idx) => ({
      key: `proprio_${mp.id}`,
      label: mp.nome,
      corIdx: idx,
      cor: coresUsadas[idx],
      // valor por mês = entregas daquele motorista naquele mês
      valoresPorMes: metricas.map(m => {
        const found = (m.motoristasProprios || []).find(p => p.id === mp.id);
        return found ? found.entregas : 0;
      })
    })),
    {
      key: 'terceiros',
      label: 'Terceiros',
      corIdx: proprios.length,  // último gradiente
      cor: corTerceiros,
      valoresPorMes: metricas.map(m => m.terceiras || 0)
    }
  ];

  // Maior valor pra escala Y
  const maxVal = Math.max(1, ...series.flatMap(s => s.valoresPorMes));
  const escalaY = (v) => innerH - (v / maxVal) * innerH;

  const grupoLargura = innerW / metricas.length;
  const barLargura = (grupoLargura - 30) / series.length;

  // Linhas de grade horizontais (tracejadas, mais sutis)
  const grades = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const y = innerH - p * innerH;
    const valor = Math.round(maxVal * p);
    return `
      <line x1="0" x2="${innerW}" y1="${y}" y2="${y}" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="${p === 0 ? '0' : '2,4'}"/>
      <text x="-6" y="${y + 4}" text-anchor="end" font-size="10" fill="#9b9b9b">${valor}</text>
    `;
  }).join('');

  // Barras com gradiente + cantos arredondados
  let barras = '';
  metricas.forEach((m, i) => {
    if (!m) return;
    const groupX = i * grupoLargura;
    series.forEach((s, j) => {
      const valor = s.valoresPorMes[i] || 0;
      const x = groupX + 15 + j * barLargura;
      const yTop = escalaY(valor);
      const altura = innerH - yTop;
      // Opacity decresce um pouquinho pra meses anteriores (visual mais interessante)
      const opacity = i === metricas.length - 1 ? 1 : 0.85 - (metricas.length - 1 - i) * 0.1;
      barras += `
        <rect x="${x}" y="${yTop}" width="${barLargura - 2}" height="${altura}"
              fill="url(#gradVol-${s.corIdx})" rx="6" opacity="${Math.max(0.5, opacity)}">
          <title>${s.label} · ${m.mes}: ${valor} entregas</title>
        </rect>
        ${valor > 0 ? `<text x="${x + (barLargura - 2)/2}" y="${yTop - 4}" text-anchor="middle" font-size="10" font-weight="700" fill="${s.cor.forte}">${valor}</text>` : ''}
      `;
    });
    barras += `<text x="${groupX + grupoLargura/2}" y="${innerH + 18}" text-anchor="middle" font-size="11" fill="#525252" font-weight="600">${m.mes}</text>`;
  });

  // Legenda com gradiente na "swatchzinha"
  const espacoEntreLegendas = 110;
  const larguraLegenda = series.length * espacoEntreLegendas;
  const legenda = series.map((s, i) => `
    <g transform="translate(${i * espacoEntreLegendas}, 0)">
      <rect x="0" y="0" width="14" height="14" fill="url(#gradVol-${s.corIdx})" rx="3"/>
      <text x="20" y="11" font-size="12" fill="#525252" font-weight="500">${s.label}</text>
    </g>
  `).join('');

  const defs = gerarDefsGradientes(todasCores, 'gradVol');

  return `
    <div class="resultados-card">
      <div class="resultados-card-titulo">📦 Volume de entregas</div>
      <svg viewBox="0 0 ${W} ${H}" class="resultados-svg">
        ${defs}
        <g transform="translate(${pad.left}, ${pad.top})">
          ${grades}
          ${barras}
          <g transform="translate(${innerW/2 - larguraLegenda/2}, ${innerH + 42})">${legenda}</g>
        </g>
      </svg>
    </div>
  `;
}

/** Gráfico 2 — Custo por entrega: barras lado a lado (próprio vs terceiro). */
function renderGraficoCustoPorEntrega(metricas) {
  const W = 900, H = 360;
  const pad = { top: 30, right: 16, bottom: 70, left: 60 };
  const innerW = W - pad.left - pad.right;
  const innerH = H - pad.top - pad.bottom;

  const maxVal = Math.max(1, ...metricas.flatMap(m => m ? [m.custoProprioUn, m.custoTerceiroUn] : [0]));
  const escalaY = (v) => innerH - (v / maxVal) * innerH;

  // Paleta: próprio = indigo forte, terceiro = âmbar
  const corProprio  = { forte: '#4f46e5', claro: '#818cf8' };
  const corTerceiro = { forte: '#f59e0b', claro: '#fcd34d' };
  const grupoLargura = innerW / metricas.length;
  const barLargura = (grupoLargura - 36) / 2;

  const grades = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const y = innerH - p * innerH;
    const valor = maxVal * p;
    return `
      <line x1="0" x2="${innerW}" y1="${y}" y2="${y}" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="${p === 0 ? '0' : '2,4'}"/>
      <text x="-6" y="${y + 4}" text-anchor="end" font-size="10" fill="#9b9b9b">R$ ${Math.round(valor)}</text>
    `;
  }).join('');

  let barras = '';
  metricas.forEach((m, i) => {
    if (!m) return;
    const groupX = i * grupoLargura;
    const barras2 = [
      { val: m.custoProprioUn, corIdx: 0, corForte: corProprio.forte },
      { val: m.custoTerceiroUn, corIdx: 1, corForte: corTerceiro.forte },
    ];
    barras2.forEach((b, j) => {
      const x = groupX + 18 + j * barLargura;
      const yTop = escalaY(b.val);
      const altura = innerH - yTop;
      barras += `
        <rect x="${x}" y="${yTop}" width="${barLargura - 4}" height="${altura}" fill="url(#gradCusto-${b.corIdx})" rx="6"/>
        ${b.val > 0 ? `<text x="${x + (barLargura - 4)/2}" y="${yTop - 4}" text-anchor="middle" font-size="10" font-weight="700" fill="${b.corForte}">R$ ${b.val.toFixed(0)}</text>` : ''}
      `;
    });
    barras += `<text x="${groupX + grupoLargura/2}" y="${innerH + 18}" text-anchor="middle" font-size="11" fill="#525252" font-weight="600">${m.mes}</text>`;
  });

  const legenda = `
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="14" height="14" fill="url(#gradCusto-0)" rx="3"/>
      <text x="20" y="11" font-size="12" fill="#525252" font-weight="500">Custo próprio un.</text>
    </g>
    <g transform="translate(160, 0)">
      <rect x="0" y="0" width="14" height="14" fill="url(#gradCusto-1)" rx="3"/>
      <text x="20" y="11" font-size="12" fill="#525252" font-weight="500">Custo terceiro un.</text>
    </g>
  `;

  const defs = gerarDefsGradientes([corProprio, corTerceiro], 'gradCusto');

  return `
    <div class="resultados-card">
      <div class="resultados-card-titulo">💰 Custo por entrega</div>
      <svg viewBox="0 0 ${W} ${H}" class="resultados-svg">
        ${defs}
        <g transform="translate(${pad.left}, ${pad.top})">
          ${grades}
          ${barras}
          <g transform="translate(${innerW/2 - 160}, ${innerH + 42})">${legenda}</g>
        </g>
      </svg>
    </div>
  `;
}

/** Gráfico 4 — Malba Coins: cards grandes (totais do trimestre OU mês focado) + barras (mensal).
 *  Só Gildo e Daniel ganham coins (motoristas próprios).
 *  Cada entrega = 10 Malba Coins.
 *  Click numa barra mensal foca naquele mês (toggle: mesmo mês desfoca).
 */
function renderGraficoMalbaCoins(metricas) {
  const COIN_POR_ENTREGA = 4;
  const fmtCoins = (n) => n.toLocaleString('pt-BR');

  // Identifica todos os motoristas próprios dos meses do trimestre.
  // Cada motorista aparece UMA vez (ordem: primeira aparição).
  const proprios = [];
  metricas.forEach(m => {
    (m.motoristasProprios || []).forEach(mp => {
      if (!proprios.find(p => p.id === mp.id)) {
        proprios.push({ id: mp.id, nome: mp.nome });
      }
    });
  });

  // Paleta MODERNA (mesma do gráfico de Volume — coerência visual)
  proprios.forEach((p, idx) => {
    p.corObj = corMotoristaPorIdx(idx);
    p.cor = p.corObj.forte;  // pra compatibilidade com código legado (cards)
    p.corIdx = idx;
  });

  // Calcular coins por motorista no escopo (mês focado OU trimestre)
  const mesFocado = malbaCoinsMesFoco && metricas.find(m => m.mes === malbaCoinsMesFoco);

  proprios.forEach(p => {
    if (mesFocado) {
      const found = (mesFocado.motoristasProprios || []).find(mp => mp.id === p.id);
      const ent = found ? found.entregas : 0;
      p.entregasEscopo = ent;
      p.coinsEscopo = ent * COIN_POR_ENTREGA;
      p.subLabel = `${ent} entregas · ${mesFocado.mes}`;
    } else {
      const totEnt = metricas.reduce((s, m) => {
        const f = (m.motoristasProprios || []).find(mp => mp.id === p.id);
        return s + (f ? f.entregas : 0);
      }, 0);
      p.entregasEscopo = totEnt;
      p.coinsEscopo = totEnt * COIN_POR_ENTREGA;
      p.subLabel = `${totEnt} entregas · trimestre todo`;
    }
  });

  const escopoLabel = mesFocado ? mesFocado.mes : 'trimestre todo';

  // Determina líder (maior coins no escopo)
  const maiorCoins = Math.max(...proprios.map(p => p.coinsEscopo), 0);
  const temPontuacao = maiorCoins > 0;
  proprios.forEach(p => p.lider = temPontuacao && p.coinsEscopo === maiorCoins);

  // SVG das barras embaixo (1 série por motorista próprio)
  const W = 900, H = 240;
  const pad = { top: 30, right: 16, bottom: 60, left: 50 };
  const innerW = W - pad.left - pad.right;
  const innerH = H - pad.top - pad.bottom;

  const maxCoins = Math.max(1, ...metricas.flatMap(m =>
    (m.motoristasProprios || []).map(mp => mp.entregas * COIN_POR_ENTREGA)
  ));
  const escalaY = (v) => innerH - (v / maxCoins) * innerH;

  const grupoLargura = innerW / metricas.length;
  const numSeries = Math.max(1, proprios.length);
  const barLargura = (grupoLargura - 36) / numSeries;

  const grades = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const y = innerH - p * innerH;
    const valor = Math.round(maxCoins * p);
    return `
      <line x1="0" x2="${innerW}" y1="${y}" y2="${y}" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="${p === 0 ? '0' : '3,3'}"/>
      <text x="-6" y="${y + 4}" text-anchor="end" font-size="10" fill="#9b9b9b">${fmtCoins(valor)}</text>
    `;
  }).join('');

  let backgroundsClicaveis = '';
  let barras = '';
  metricas.forEach((m, i) => {
    if (!m) return;
    const groupX = i * grupoLargura;
    const focado = malbaCoinsMesFoco === m.mes;

    backgroundsClicaveis += `
      <rect class="malba-mes-clicker ${focado ? 'focado' : ''}"
            x="${groupX + 4}" y="0" width="${grupoLargura - 8}" height="${innerH}"
            fill="${focado ? 'rgba(229, 161, 11, 0.12)' : 'transparent'}"
            stroke="${focado ? '#d97706' : 'transparent'}"
            stroke-width="2" stroke-dasharray="4,3" rx="6"
            onclick="alternarFocoMalbaMes('${m.mes}')"
            style="cursor:pointer;">
        <title>Clique pra ver só ${m.mes}${focado ? ' (clique de novo pra desfocar)' : ''}</title>
      </rect>
    `;

    proprios.forEach((p, j) => {
      const found = (m.motoristasProprios || []).find(mp => mp.id === p.id);
      const entregas = found ? found.entregas : 0;
      const coins = entregas * COIN_POR_ENTREGA;
      const x = groupX + 18 + j * barLargura;
      const yTop = escalaY(coins);
      const altura = innerH - yTop;
      barras += `
        <rect class="malba-bar" x="${x}" y="${innerH}" width="${barLargura - 2}" height="0"
              fill="url(#gradMalba-${p.corIdx})" rx="6"
              data-y-final="${yTop}" data-altura-final="${altura}"
              pointer-events="none">
          <title>${p.nome} · ${m.mes}: ${entregas} entregas → ${fmtCoins(coins)} coins</title>
        </rect>
        ${coins > 0 ? `<text class="malba-bar-label" x="${x + (barLargura - 2)/2}" y="${yTop - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="${p.cor}" opacity="0" pointer-events="none">${fmtCoins(coins)}</text>` : ''}
      `;
    });
    barras += `<text x="${groupX + grupoLargura/2}" y="${innerH + 18}" text-anchor="middle"
                     font-size="${focado ? '12' : '11'}"
                     font-weight="${focado ? '700' : '400'}"
                     fill="${focado ? '#d97706' : '#525252'}"
                     pointer-events="none">${m.mes}${focado ? ' ●' : ''}</text>`;
  });

  // Legenda
  const espacoLeg = 100;
  const larguraLeg = proprios.length * espacoLeg;
  const legenda = proprios.map((p, i) => `
    <g transform="translate(${i * espacoLeg}, 0)">
      <rect x="0" y="0" width="14" height="14" fill="url(#gradMalba-${p.corIdx})" rx="3"/>
      <text x="20" y="11" font-size="12" fill="#525252" font-weight="500">${p.nome}</text>
    </g>
  `).join('');

  const dica = malbaCoinsMesFoco
    ? `Clique de novo no mês destacado pra ver o trimestre todo`
    : `Clique num mês abaixo pra ver só esse mês no placar`;

  // Cards grandes (1 por motorista próprio)
  const cards = proprios.length > 0 ? proprios.map(p => `
    <div class="malba-placar-card ${p.lider ? 'lider' : ''}" style="--cor:${p.cor}">
      ${p.lider ? '<div class="malba-placar-coroa">👑</div>' : ''}
      <div class="malba-placar-nome">${p.nome}</div>
      <div class="malba-placar-valor"><span class="malba-emoji">💰</span><span class="malba-num" data-final="${p.coinsEscopo}">0</span></div>
      <div class="malba-placar-sub">${p.subLabel}</div>
    </div>
  `).join('') : `
    <div class="empty" style="grid-column: 1/-1;">
      <p>Nenhum motorista próprio com entregas neste período.</p>
    </div>
  `;

  // Grid responsivo: 2 colunas pra 2, 3 pra 3, etc.
  const numCards = Math.max(1, proprios.length);
  const gridCols = numCards === 1 ? '1fr' : `repeat(${Math.min(numCards, 3)}, 1fr)`;

  return `
    <div class="resultados-card resultados-card-coins">
      <div class="resultados-card-titulo">💰 Malba Coins</div>
      <div class="malba-coins-info">
        Pontuação dos motoristas próprios — cada entrega vale <strong>${COIN_POR_ENTREGA} coins</strong> ·
        <span style="color:var(--ink-3);">${dica}</span>
      </div>

      <div class="malba-placar" style="grid-template-columns: ${gridCols};">
        ${cards}
      </div>

      <div class="malba-barras-titulo">Detalhamento por mês <span style="color:var(--ink-3);font-weight:400;font-size:12px;">· mostrando: <strong>${escopoLabel}</strong></span></div>
      <svg viewBox="0 0 ${W} ${H}" class="resultados-svg malba-svg" onload="animarMalbaCoins(this)">
        ${gerarDefsGradientes(proprios.map(p => p.corObj), 'gradMalba')}
        <g transform="translate(${pad.left}, ${pad.top})">
          ${grades}
          ${backgroundsClicaveis}
          ${barras}
          <g transform="translate(${innerW/2 - larguraLeg/2}, ${innerH + 42})">${legenda}</g>
        </g>
      </svg>
    </div>
  `;
}

/* ============= GRÁFICOS DE TEMPO (saída + chegada do motorista) ============= */

/** Helper: agrupa entregas do histórico por mês e motorista, calculando
 *  tempo médio por entrega e tempo médio entre entregas.
 *
 *  Retorna: { meses: ['Janeiro', 'Fevereiro', 'Março'],
 *             motoristas: ['Daniel', 'Gildo'],
 *             tempoMedioEntrega: { Daniel: [12, 14, 15], ... } (em minutos),
 *             tempoEntreEntregas: { Daniel: [18, 22, 20], ... } (em minutos)
 *           } */
function agruparTemposPorMesMotorista(mesesEscopo) {
  const NOMES_MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                     'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const histAll = state.historicoEntregas || [];

  // Filtra entregas que pertencem aos meses do escopo
  const histFiltrado = histAll.filter(h => {
    if (!h.data) return false;
    const d = new Date(h.data);
    if (isNaN(d.getTime())) return false;
    const nomeMes = NOMES_MES[d.getMonth()];
    return mesesEscopo.includes(nomeMes);
  });

  // Coleta motoristas distintos (com pelo menos 1 entrega no escopo)
  const motoristas = [...new Set(histFiltrado.map(h => h.motorista).filter(Boolean))];

  // Tempo médio por entrega = média dos `duracaoSegundos` de cada entrega
  // Tempo entre entregas = média do delta entre entregas consecutivas do mesmo motorista no mesmo dia
  const tempoMedioEntrega = {};
  const tempoEntreEntregas = {};

  motoristas.forEach(nome => {
    tempoMedioEntrega[nome] = [];
    tempoEntreEntregas[nome] = [];

    mesesEscopo.forEach(mesNome => {
      const idxMes = NOMES_MES.indexOf(mesNome);
      const entregasMotMes = histFiltrado
        .filter(h => h.motorista === nome && new Date(h.data).getMonth() === idxMes)
        .map(h => ({ ...h, _data: new Date(h.data) }))
        .sort((a, b) => a._data - b._data);

      // Tempo médio por entrega (em minutos)
      const duracoes = entregasMotMes
        .map(h => h.duracaoSegundos)
        .filter(s => typeof s === 'number' && s > 0);
      const mediaSeg = duracoes.length
        ? duracoes.reduce((s, x) => s + x, 0) / duracoes.length
        : 0;
      tempoMedioEntrega[nome].push(Math.round(mediaSeg / 60));

      // Tempo entre entregas (em minutos) — agrupa por DIA
      const porDia = {};
      entregasMotMes.forEach(h => {
        const dia = h._data.toISOString().slice(0, 10);
        if (!porDia[dia]) porDia[dia] = [];
        porDia[dia].push(h);
      });
      const intervalos = [];
      Object.values(porDia).forEach(entregasNoDia => {
        for (let i = 1; i < entregasNoDia.length; i++) {
          // Tempo entre o "saiu" da entrega i e a "chegada" da i-1
          const finalAnterior = entregasNoDia[i-1]._data.getTime();
          const inicioAtual = entregasNoDia[i].inicioEm
            ? new Date(entregasNoDia[i].inicioEm).getTime()
            : entregasNoDia[i]._data.getTime();
          const delta = (inicioAtual - finalAnterior) / 1000;  // segundos
          if (delta > 0 && delta < 4 * 60 * 60) {  // <4h, descarta valores absurdos
            intervalos.push(delta);
          }
        }
      });
      const mediaInt = intervalos.length
        ? intervalos.reduce((s, x) => s + x, 0) / intervalos.length
        : 0;
      tempoEntreEntregas[nome].push(Math.round(mediaInt / 60));
    });
  });

  return { meses: mesesEscopo, motoristas, tempoMedioEntrega, tempoEntreEntregas };
}

/** Renderiza um gráfico de barras agrupadas pra dados de tempo (em minutos).
 *  Recebe um título, dados agrupados, e a "métrica" a mostrar (tempoMedioEntrega ou tempoEntreEntregas). */
function renderGraficoTempo(metricas, tipoTempo) {
  const W = 900, H = 360;
  const pad = { top: 30, right: 16, bottom: 70, left: 50 };

  const mesesEscopo = metricas.map(m => m.mes);
  const dados = agruparTemposPorMesMotorista(mesesEscopo);
  const { meses, motoristas } = dados;
  const valoresPorMotorista = dados[tipoTempo];  // { motoristaNome: [v1, v2, v3] }

  // Sem motoristas ou sem dados → estado vazio
  const semDados = motoristas.length === 0 ||
    motoristas.every(m => valoresPorMotorista[m].every(v => v === 0));

  if (semDados) {
    return `
      <div class="resultados-card">
        <div class="empty" style="padding: 40px 20px; text-align: center;">
          <div style="font-size: 32px; opacity: 0.4;">⏱️</div>
          <h3 style="margin: 12px 0 6px; font-size: 14px;">Sem dados de tempo ainda</h3>
          <p style="font-size: 12px; color: var(--ink-2); line-height: 1.5; max-width: 320px; margin: 0 auto;">
            Os tempos começam a ser registrados quando o motorista clicar em "Saí p/ entrega" e enviar a foto do comprovante.
          </p>
        </div>
      </div>
    `;
  }

  // Máximo geral pra escalar Y
  let max = 0;
  motoristas.forEach(m => {
    valoresPorMotorista[m].forEach(v => { if (v > max) max = v; });
  });
  max = Math.max(max, 10);  // mínimo de 10 minutos pro eixo Y não ficar achatado

  // Paleta MODERNA — cada motorista tem sua cor
  const coresMotoristas = motoristas.map((_, idx) => corMotoristaPorIdx(idx));

  // Layout: 3 meses × N motoristas
  const gw = (W - pad.left - pad.right) / meses.length;
  const innerGap = 4;
  const barW = Math.max(8, (gw - 20 - (motoristas.length - 1) * innerGap) / motoristas.length);

  // Eixo Y
  const yTicks = 5;
  const yPx = (v) => pad.top + (H - pad.top - pad.bottom) * (1 - v / max);

  let ticksHtml = '';
  for (let i = 0; i <= yTicks; i++) {
    const v = (max * i / yTicks);
    const y = yPx(v);
    ticksHtml += `
      <line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="#eee" stroke-width="1" stroke-dasharray="${i === 0 ? '0' : '2,4'}"/>
      <text x="${pad.left - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#888">${Math.round(v)}</text>
    `;
  }

  // Barras com gradiente
  let barrasHtml = '';
  let labelsMes = '';
  meses.forEach((mes, idxMes) => {
    const baseX = pad.left + gw * idxMes + 10;
    motoristas.forEach((nome, idxMot) => {
      const v = valoresPorMotorista[nome][idxMes];
      const x = baseX + idxMot * (barW + innerGap);
      const y = yPx(v);
      const h = H - pad.bottom - y;
      const corForte = coresMotoristas[idxMot].forte;
      barrasHtml += `
        <rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="url(#gradTempo-${idxMot})" rx="6">
          <title>${nome} · ${mes}: ${v} min</title>
        </rect>
      `;
      if (v > 0) {
        barrasHtml += `<text x="${x + barW/2}" y="${y - 4}" text-anchor="middle" font-size="10" fill="${corForte}" font-weight="700">${v}</text>`;
      }
    });
    labelsMes += `<text x="${pad.left + gw * idxMes + gw/2}" y="${H - pad.bottom + 20}" text-anchor="middle" font-size="12" fill="#444" font-weight="600">${mes}</text>`;
  });

  // Legenda com gradiente
  let legenda = '';
  motoristas.forEach((nome, i) => {
    const c = coresMotoristas[i];
    legenda += `
      <span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;margin-right:14px;font-weight:500;color:#525252;">
        <span style="width:14px;height:14px;border-radius:3px;background:linear-gradient(180deg, ${c.forte}, ${c.claro});"></span>${nome}
      </span>
    `;
  });

  const defs = gerarDefsGradientes(coresMotoristas, 'gradTempo');

  return `
    <div class="resultados-card">
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:var(--sans),sans-serif;">
        ${defs}
        ${ticksHtml}
        <line x1="${pad.left}" y1="${H - pad.bottom}" x2="${W - pad.right}" y2="${H - pad.bottom}" stroke="#444" stroke-width="1.5"/>
        ${barrasHtml}
        ${labelsMes}
        <text x="${pad.left - 36}" y="${pad.top + 14}" font-size="11" fill="#666" font-weight="600">min</text>
      </svg>
      <div style="margin-top:8px;padding:0 12px;">${legenda}</div>
    </div>
  `;
}

/* ====== GRÁFICO VALOR ENTREGUE × NÚMERO DE ENTREGAS (gestor) ======
   Cruza 2 métricas por motorista num mês escolhido:
   - Barra azul = valor total entregue (R$, eixo Y esquerdo)
   - Linha laranja = número de entregas (qtd, eixo Y direito)
   Tem dropdown próprio de mês — independente do trimestre da galeria. */

/** Retorna lista de meses (formato 'AAAA-MM') que têm pelo menos 1 entrega no histórico. */
function mesesDisponiveisHistorico() {
  const hist = state.historicoEntregas || [];
  const set = new Set();
  hist.forEach(h => {
    if (!h.data) return;
    const d = new Date(h.data);
    if (isNaN(d.getTime())) return;
    set.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
  });
  // Sempre garante o mês atual no dropdown, mesmo sem dados
  const hoje = new Date();
  set.add(`${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`);
  return [...set].sort().reverse(); // mais recente primeiro
}

/** Formata 'AAAA-MM' em label PT-BR: "Janeiro 2026" */
function formatarMesIso(mesIso) {
  const NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                 'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const [ano, mes] = mesIso.split('-');
  return `${NOMES[parseInt(mes, 10) - 1]} ${ano}`;
}

function renderGraficoValorEntregues() {
  const W = 900, H = 380;
  const pad = { top: 36, right: 60, bottom: 60, left: 60 };

  const mesIso = valorEntreguesMesSelecionado;
  const [ano, mes] = mesIso.split('-').map(Number);
  const inicioMes = new Date(ano, mes - 1, 1);
  const fimMes = new Date(ano, mes, 1);

  // Filtra entregas do mês escolhido
  const hist = (state.historicoEntregas || []).filter(h => {
    if (!h.data) return false;
    const d = new Date(h.data);
    return d >= inicioMes && d < fimMes;
  });

  // Agrupa por motorista — valor total e quantidade
  const porMotorista = {};
  hist.forEach(h => {
    const nome = h.motorista || '(sem motorista)';
    if (!porMotorista[nome]) porMotorista[nome] = { valor: 0, qtd: 0 };
    porMotorista[nome].valor += (h.valor || 0);
    porMotorista[nome].qtd += 1;
  });

  // Ordena por valor descendente
  const motoristas = Object.entries(porMotorista)
    .map(([nome, dados]) => ({ nome, ...dados }))
    .sort((a, b) => b.valor - a.valor);

  // Dropdown de mês (montado sempre, mesmo sem dados)
  const mesesDisp = mesesDisponiveisHistorico();
  const dropdown = `
    <div class="valor-entregues-filtro">
      <label for="ve_mes">Mês:</label>
      <select id="ve_mes" onchange="trocarMesValorEntregues(this.value)">
        ${mesesDisp.map(m => `<option value="${m}" ${m === mesIso ? 'selected' : ''}>${formatarMesIso(m)}</option>`).join('')}
      </select>
    </div>
  `;

  // Estado vazio
  if (motoristas.length === 0) {
    return `
      <div class="resultados-card">
        ${dropdown}
        <div class="empty" style="padding: 50px 20px; text-align: center;">
          <div style="font-size: 32px; opacity: 0.4;">📊</div>
          <h3 style="margin: 12px 0 6px; font-size: 14px;">Sem entregas em ${formatarMesIso(mesIso)}</h3>
          <p style="font-size: 12px; color: var(--ink-2); line-height: 1.5; max-width: 320px; margin: 0 auto;">
            Quando houver entregas registradas neste mês, o gráfico mostrará valor e quantidade por motorista.
          </p>
        </div>
      </div>
    `;
  }

  // Escalas
  const maxValor = Math.max(...motoristas.map(m => m.valor), 1);
  const maxQtd = Math.max(...motoristas.map(m => m.qtd), 1);
  // Arredonda max pra cima (visual melhor)
  const maxValorRound = Math.ceil(maxValor / 1000) * 1000;
  const maxQtdRound = Math.ceil(maxQtd / 10) * 10;

  // Largura útil pra distribuir motoristas
  const innerW = W - pad.left - pad.right;
  const gw = innerW / motoristas.length;
  const barW = Math.min(60, gw * 0.5);

  // Helpers de coordenada
  const yValor = (v) => pad.top + (H - pad.top - pad.bottom) * (1 - v / maxValorRound);
  const yQtd = (v) => pad.top + (H - pad.top - pad.bottom) * (1 - v / maxQtdRound);
  const xCentro = (idx) => pad.left + gw * idx + gw / 2;

  // Grade horizontal + eixos Y duplos
  const yTicks = 5;
  let gradeHtml = '';
  for (let i = 0; i <= yTicks; i++) {
    const valor = (maxValorRound * i / yTicks);
    const qtd = (maxQtdRound * i / yTicks);
    const y = yValor(valor);
    gradeHtml += `
      <line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="#eee" stroke-width="1" stroke-dasharray="${i === 0 ? '0' : '2,4'}"/>
      <text x="${pad.left - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="#4f46e5" font-weight="600">
        ${valor >= 1000 ? (valor/1000).toFixed(valor < 10000 ? 1 : 0) + 'k' : valor.toFixed(0)}
      </text>
      <text x="${W - pad.right + 8}" y="${y + 4}" text-anchor="start" font-size="11" fill="#f59e0b" font-weight="600">
        ${Math.round(qtd)}
      </text>
    `;
  }

  // Barras de valor (indigo com gradiente)
  let barrasHtml = '';
  let labelsMot = '';
  motoristas.forEach((mot, idx) => {
    const cx = xCentro(idx);
    const x = cx - barW / 2;
    const y = yValor(mot.valor);
    const h = H - pad.bottom - y;
    barrasHtml += `
      <rect x="${x}" y="${y}" width="${barW}" height="${h}"
            fill="url(#gradVE-0)" rx="6">
        <title>${mot.nome}: R$ ${mot.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</title>
      </rect>
      <text x="${cx}" y="${y - 8}" text-anchor="middle" font-size="11" fill="#4f46e5" font-weight="700">
        R$ ${mot.valor >= 1000 ? (mot.valor/1000).toFixed(1) + 'k' : mot.valor.toFixed(0)}
      </text>
    `;
    labelsMot += `
      <text x="${cx}" y="${H - pad.bottom + 22}" text-anchor="middle" font-size="12" fill="#444" font-weight="600">
        ${escapeHtml(mot.nome)}
      </text>
    `;
  });

  // Linha de entregas (âmbar) — cruzando por cima das barras
  const pontos = motoristas.map((mot, idx) => `${xCentro(idx)},${yQtd(mot.qtd)}`).join(' ');
  let linhaHtml = `<polyline points="${pontos}" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>`;
  motoristas.forEach((mot, idx) => {
    const cx = xCentro(idx);
    const cy = yQtd(mot.qtd);
    linhaHtml += `
      <circle cx="${cx}" cy="${cy}" r="6" fill="#f59e0b" stroke="#fff" stroke-width="3">
        <title>${mot.nome}: ${mot.qtd} entregas</title>
      </circle>
      <text x="${cx + 12}" y="${cy - 8}" font-size="11" fill="#f59e0b" font-weight="700">${mot.qtd}</text>
    `;
  });

  const corValor = { forte: '#4f46e5', claro: '#818cf8' };

  return `
    <div class="resultados-card">
      ${dropdown}
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;font-family:var(--sans),sans-serif;">
        ${gerarDefsGradientes([corValor], 'gradVE')}
        ${gradeHtml}
        <line x1="${pad.left}" y1="${H - pad.bottom}" x2="${W - pad.right}" y2="${H - pad.bottom}" stroke="#444" stroke-width="1.5"/>
        ${barrasHtml}
        ${linhaHtml}
        ${labelsMot}
        <text x="${pad.left - 38}" y="${pad.top + 8}" font-size="11" fill="#4f46e5" font-weight="700">R$</text>
        <text x="${W - pad.right + 12}" y="${pad.top + 8}" font-size="11" fill="#f59e0b" font-weight="700">qtd</text>

/* ====== GRÁFICO CUSTO FIXO DIÁRIO (gestor) ======
   Mostra o custo fixo mensal dividido pelos dias úteis (seg-sex) do mês.
   Dois cards informativos embaixo com custos adicionais a considerar. */

/* Mês selecionado no gráfico "Custo fixo diário" (formato 'AAAA-MM'). */
let custoFixoDiarioMesSelecionado = sessionStorage.getItem('malba_custo_fixo_mes') || (() => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
})();

/** Retorna o número de dias úteis (seg-sex) num mês (mês 1-indexed).
    Não considera feriados. */
function contarDiasUteis(ano, mes) {
  const diasNoMes = new Date(ano, mes, 0).getDate();
  let uteis = 0;
  for (let dia = 1; dia <= diasNoMes; dia++) {
    const d = new Date(ano, mes - 1, dia);
    const dow = d.getDay(); // 0=dom, 6=sab
    if (dow !== 0 && dow !== 6) uteis++;
  }
  return uteis;
}

/** Retorna o custo fixo mensal do mês em nome PT-BR. Fallback pro valor
    do 1º mês em custosMensais, e depois pra 5146.77 (padrão). */
function custoFixoDoMes(mesNomePt) {
  const cm = (state.custosMensais || []).find(c =>
    (c.mes || '').toLowerCase() === mesNomePt.toLowerCase()
  );
  if (cm && typeof cm.fixo === 'number') return cm.fixo;
  const primeiro = (state.custosMensais || [])[0];
  return (primeiro && primeiro.fixo) || 5146.77;
}

/** Anima as barras crescendo de baixo pra cima + números contando crescendo
 *  quando o gráfico de Malba Coins entra na tela. */
function animarMalbaCoins(svgEl) {
  // Animar barras: cada uma faz transition do height 0 → altura final
  const barras = svgEl.querySelectorAll('.malba-bar');
  barras.forEach((b, idx) => {
    const yFinal = b.getAttribute('data-y-final');
    const alturaFinal = b.getAttribute('data-altura-final');
    setTimeout(() => {
      b.style.transition = 'all 0.7s cubic-bezier(0.4, 0, 0.2, 1)';
      b.setAttribute('y', yFinal);
      b.setAttribute('height', alturaFinal);
    }, 100 + idx * 80);
  });
  // Mostrar labels depois das barras subirem
  const labels = svgEl.querySelectorAll('.malba-bar-label');
  setTimeout(() => {
    labels.forEach((l, idx) => {
      setTimeout(() => {
        l.style.transition = 'opacity 0.4s';
        l.setAttribute('opacity', '1');
      }, idx * 60);
    });
  }, 600);
}

/** Anima o número crescendo de 0 até o valor final (placar Malba Coins). */
function animarNumerosMalbaCoins() {
  document.querySelectorAll('.malba-num').forEach(el => {
    const final = parseInt(el.dataset.final || '0', 10);
    if (final === 0) { el.textContent = '0'; return; }
    const duracao = 900;
    const inicio = performance.now();
    function step(now) {
      const t = Math.min(1, (now - inicio) / duracao);
      // ease-out cubic
      const eased = 1 - Math.pow(1 - t, 3);
      const valor = Math.round(final * eased);
      el.textContent = valor.toLocaleString('pt-BR');
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function renderGraficoCombustivel(metricas) {
  const W = 900, H = 360;
  const pad = { top: 30, right: 30, bottom: 70, left: 60 };
  const innerW = W - pad.left - pad.right;
  const innerH = H - pad.top - pad.bottom;

  const valores = metricas.map(m => m ? m.combustivelUn : 0);
  const maxVal = Math.max(1, ...valores);
  const escalaY = (v) => innerH - (v / maxVal) * innerH;

  const passoX = innerW / Math.max(1, metricas.length - 1);
  const pontos = metricas.map((m, i) => ({
    x: i * passoX,
    y: escalaY(m ? m.combustivelUn : 0),
    valor: m ? m.combustivelUn : 0,
    mes: m ? m.mes : ''
  }));

  const grades = [0, 0.25, 0.5, 0.75, 1].map(p => {
    const y = innerH - p * innerH;
    const valor = maxVal * p;
    return `
      <line x1="0" x2="${innerW}" y1="${y}" y2="${y}" stroke="#e5e5e5" stroke-width="1" stroke-dasharray="${p === 0 ? '0' : '2,4'}"/>
      <text x="-6" y="${y + 4}" text-anchor="end" font-size="10" fill="#9b9b9b">R$ ${valor.toFixed(0)}</text>
    `;
  }).join('');

  const path = pontos.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');
  // Path da área preenchida embaixo da linha (do último ponto baixa até y=innerH, volta pro primeiro)
  const areaPath = `${path} L ${pontos[pontos.length-1].x} ${innerH} L ${pontos[0].x} ${innerH} Z`;

  // Cor: âmbar (combustível = amarelo/laranja combina)
  const cor = { forte: '#f59e0b', claro: '#fcd34d' };

  const pontosSvg = pontos.map(p => `
    <circle cx="${p.x}" cy="${p.y}" r="6" fill="${cor.forte}" stroke="white" stroke-width="3"/>
    ${p.valor > 0 ? `<text x="${p.x}" y="${p.y - 14}" text-anchor="middle" font-size="12" font-weight="700" fill="${cor.forte}">R$ ${p.valor.toFixed(2)}</text>` : ''}
    <text x="${p.x}" y="${innerH + 18}" text-anchor="middle" font-size="11" fill="#525252" font-weight="600">${p.mes}</text>
  `).join('');

  return `
    <div class="resultados-card">
      <div class="resultados-card-titulo">⛽ Combustível por entrega</div>
      <svg viewBox="0 0 ${W} ${H}" class="resultados-svg">
        <defs>
          <linearGradient id="gradCombAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${cor.forte}" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="${cor.claro}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g transform="translate(${pad.left}, ${pad.top})">
          ${grades}
          <path d="${areaPath}" fill="url(#gradCombAreaGrad)"/>
          <path d="${path}" stroke="${cor.forte}" stroke-width="3" fill="none" stroke-linejoin="round"/>
          ${pontosSvg}
        </g>
      </svg>
    </div>
  `;
}

function renderResultadoRastreio(p) {
  // Definir os passos da timeline com base no status atual
  const ordem = ['expedicao', 'saiu', 'entregue'];
  const statusAtual = p.status;
  const isOcorrencia = statusAtual === 'ocorrencia';

  // Detectar tipo de ocorrência embutida na observação (sem expor o texto literal)
  // O motorista marca a ocorrência com prefixos [ITENS PENDENTES] ou [NÃO ENTREGUE]
  // que retornam o pedido pra "expedicao". Aqui só lemos o prefixo, nunca o texto.
  let tipoOcorrencia = null;
  if (p.observacao) {
    if (p.observacao.startsWith('[ITENS PENDENTES]')) tipoOcorrencia = 'itens_pendentes';
    else if (p.observacao.startsWith('[NÃO ENTREGUE]')) tipoOcorrencia = 'nao_entregue';
  }
  // Status entregue + observação não-vazia (sem prefixo) = entregue com observação
  const entregueComObs = statusAtual === 'entregue' && p.observacao && !tipoOcorrencia;

  const passos = [
    {
      key: 'expedicao',
      titulo: 'Pedido em expedição',
      desc: 'Seu pedido foi recebido e está sendo preparado para envio.'
    },
    {
      key: 'saiu',
      titulo: 'Saiu para entrega',
      desc: 'Seu pedido está a caminho do endereço de entrega.'
    },
    {
      key: 'entregue',
      titulo: entregueComObs ? 'Entregue com observação' : 'Entregue',
      desc: entregueComObs
        ? 'Seu pedido foi entregue, mas há uma observação registrada. Para mais detalhes, entre em contato conosco.'
        : 'Seu pedido foi entregue com sucesso.'
    }
  ];

  const idxAtual = ordem.indexOf(statusAtual);

  // Endereço sem expor dados sensíveis (só cidade/bairro)
  const endResumo = [p.bairro, p.cidade].filter(Boolean).join(', ') || p.endereco || '—';

  // Busca a entrega correspondente no histórico (se houver) — daí sai a URL do
  // comprovante de entrega que o motorista tirou na hora.
  const entregaHistorico = (statusAtual === 'entregue')
    ? state.historicoEntregas?.find(h => h.pedidoId === p.id)
    : null;
  const urlComprovante = entregaHistorico?.comprovanteUrl || null;

  return `
    <div class="rastreio-resultado">
      <div class="rastreio-header-result">
        <div class="pedido-id">PEDIDO ${p.id}</div>
        <h3>${p.cliente}</h3>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;">
          <span class="rastreio-status-pill ${statusAtual}">${STATUS_LABEL[statusAtual]}</span>
          ${entregueComObs ? '<span class="rastreio-status-pill" style="background:#fef3c7;color:#92400e;">com observação</span>' : ''}
          ${tipoOcorrencia === 'itens_pendentes' ? '<span class="rastreio-status-pill" style="background:#fef3c7;color:#92400e;">📦 Itens pendentes</span>' : ''}
          ${tipoOcorrencia === 'nao_entregue' ? '<span class="rastreio-status-pill" style="background:#fee2e2;color:#991b1b;">🚫 Tentativa não realizada</span>' : ''}
          <span style="font-size:12px;color:var(--ink-3);">Entrega: ${endResumo}</span>
        </div>
      </div>

      ${tipoOcorrencia === 'itens_pendentes' ? `
        <div style="background:#fef3c7;color:#92400e;padding:14px 16px;border-radius:var(--radius-lg);margin-bottom:16px;border-left:4px solid #f59e0b;">
          <div style="font-weight:600;margin-bottom:4px;">📦 Itens pendentes</div>
          <div style="font-size:13px;line-height:1.5;">
            Identificamos que alguns itens deste pedido estão pendentes. Estamos providenciando a regularização. Se tiver dúvidas, entre em contato conosco.
          </div>
        </div>
      ` : ''}

      ${tipoOcorrencia === 'nao_entregue' ? `
        <div style="background:#fee2e2;color:#991b1b;padding:14px 16px;border-radius:var(--radius-lg);margin-bottom:16px;border-left:4px solid #ef4444;">
          <div style="font-weight:600;margin-bottom:4px;">🚫 Tentativa de entrega não realizada</div>
          <div style="font-size:13px;line-height:1.5;">
            Não conseguimos concluir a entrega na última tentativa. Iremos reagendar em breve. Se quiser combinar um horário ou local diferente, entre em contato conosco.
          </div>
        </div>
      ` : ''}

      <div class="timeline">
        ${isOcorrencia ? `
          <div class="timeline-step error">
            <div class="timeline-dot">!</div>
            <div class="timeline-info">
              <div class="step-title" style="color:var(--danger);">Ocorrência na entrega</div>
              <div class="step-desc">Houve um problema na tentativa de entrega. Entre em contato conosco para mais informações.</div>
            </div>
          </div>
        ` : passos.map((passo, i) => {
          let classe = '';
          let icone = i + 1;
          if (i < idxAtual) { classe = 'done'; icone = '✓'; }
          else if (i === idxAtual) { classe = 'current'; }
          // Se há ocorrência ativa, marca o passo atual como "warning"
          if (i === idxAtual && tipoOcorrencia) classe = 'current warning';
          // Entregue com observação: ícone diferente
          if (i === idxAtual && entregueComObs) icone = '⚠';
          return `
            <div class="timeline-step ${classe}">
              <div class="timeline-dot">${icone}</div>
              <div class="timeline-info">
                <div class="step-title">${passo.titulo}</div>
                <div class="step-desc">${passo.desc}</div>
                ${passo.key === 'entregue' && urlComprovante ? `
                  <a href="${urlComprovante}" target="_blank" rel="noopener" class="rastreio-foto-link">
                    📷 Ver foto da entrega
                  </a>
                ` : ''}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function buscarRastreio() {
  const input = document.getElementById('rastreio_input');
  let busca = input.value.trim();
  if (!busca) {
    rastreioErro = 'Digite o número do pedido.';
    rastreioPedido = null;
    render();
    return;
  }

  // Normalizar: aceitar "13053", "P-13053", "p-13053"
  const buscaUpper = busca.toUpperCase();
  const buscaSemPrefixo = buscaUpper.replace(/^P-/, '');

  const encontrado = state.pedidos.find(p => {
    const pidUpper = p.id.toUpperCase();
    return pidUpper === buscaUpper ||
           pidUpper === `P-${buscaSemPrefixo}` ||
           pidUpper.replace(/^P-/, '') === buscaSemPrefixo;
  });

  if (!encontrado) {
    rastreioErro = `Pedido "${busca}" não encontrado. Verifique o número e tente novamente.`;
    rastreioPedido = null;
  } else {
    rastreioErro = null;
    rastreioPedido = encontrado;
  }
  render();
}

function bindRastreioEvents() {
  const input = document.getElementById('rastreio_input');
  if (input) {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') buscarRastreio();
    });
  }
}

const PERFIL_KEY = 'painel_expedicao_perfil';
const MOTORISTA_LOGADO_KEY = 'painel_expedicao_motorista_logado';

// perfil pode ser: null (não logado), 'cliente', 'motorista', 'gestor'
let perfilAtivo = localStorage.getItem(PERFIL_KEY) || null;
let motoristaLogado = localStorage.getItem(MOTORISTA_LOGADO_KEY) || null;

function fazerLogin(perfil, dados = {}) {
  perfilAtivo = perfil;
  localStorage.setItem(PERFIL_KEY, perfil);

  // Se é motorista, salva qual motorista logou
  if (perfil === 'motorista' && dados.nomeMotorista) {
    motoristaLogado = dados.nomeMotorista;
    localStorage.setItem(MOTORISTA_LOGADO_KEY, motoristaLogado);
  }

  // Ajustes de view padrão por perfil
  if (perfil === 'motorista') {
    currentView = 'rotas';  // motorista cai direto em Rotas
  } else if (perfil === 'gestor') {
    currentView = 'expedicao';   // gestor cai no Painel logístico
  }

  // Se for cliente, garante que o histórico foi puxado do Supabase pra exibir
  // o link da foto da entrega ("📷 Ver foto da entrega" na timeline). Sem isso,
  // se o cliente é o primeiro usuário a abrir o navegador, o histórico fica vazio.
  if (perfil === 'cliente' && supabaseMode.historico && supabaseClient) {
    dataLayer.historico.sincronizar()
      .catch(e => console.warn('[Cliente] Falha ao sincronizar histórico:', e))
      .finally(() => render()); // re-renderiza depois pra incluir as fotos quando chegarem
  }

  render();
}

function fazerLogout() {
  perfilAtivo = null;
  motoristaLogado = null;
  localStorage.removeItem(PERFIL_KEY);
  localStorage.removeItem(MOTORISTA_LOGADO_KEY);
  pedidosSelecionados.clear();
  rastreioPedido = null;
  selecaoLoginMotorista = null;
  render();
}

/* =====================================================================
   HOME — Mural de circulares / avisos
   ---------------------------------------------------------------------
   Posters de aviso organizados por data. O gestor cria/edita/apaga;
   motorista só lê. Cada circular tem texto, cor (urgente/normal) e uma
   data de expiração — depois dela o poster some da tela (mas continua
   salvo no banco). Persistido na tabela `circulares` do Supabase.
   ===================================================================== */

// Cache local das circulares (carregado do Supabase no boot)
let circulares = [];

const circularesAPI = {
  async listar() {
    if (supabaseClient) {
      try {
        const { data, error } = await supabaseClient
          .from('circulares')
          .select('*')
          .order('data_aviso', { ascending: false });
        if (error) throw error;
        circulares = data || [];
        return circulares;
      } catch (e) {
        console.error('[Supabase] Erro ao listar circulares:', e);
        return circulares;
      }
    }
    return circulares;
  },

  async salvar(circular) {
    if (!supabaseClient) {
      alert('Sem conexão com o servidor. Não foi possível salvar o aviso.');
      return false;
    }
    try {
      const dados = {
        titulo: circular.titulo,
        texto: circular.texto,
        cor: circular.cor,
        data_aviso: circular.data_aviso,
        expira_em: circular.expira_em,
      };
      if (circular.id) dados.id = circular.id;
      const { error } = await supabaseClient
        .from('circulares')
        .upsert(dados);
      if (error) throw error;
      await circularesAPI.listar();
      return true;
    } catch (e) {
      console.error('[Supabase] Erro ao salvar circular:', e);
      alert('Erro ao salvar o aviso: ' + (e.message || e));
      return false;
    }
  },

  async excluir(id) {
    if (!supabaseClient) return false;
    try {
      const { error } = await supabaseClient
        .from('circulares')
        .delete()
        .eq('id', id);
      if (error) throw error;
      await circularesAPI.listar();
      return true;
    } catch (e) {
      console.error('[Supabase] Erro ao excluir circular:', e);
      alert('Erro ao excluir o aviso: ' + (e.message || e));
      return false;
    }
  },
};

/** Retorna só as circulares ainda válidas (não expiradas). Uma circular
    expira quando a data de hoje passa de expira_em. Se expira_em estiver
    vazio, o aviso nunca expira. */
function circularesVigentes() {
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  return circulares.filter(c => {
    if (!c.expira_em) return true;
    const exp = new Date(c.expira_em + 'T23:59:59');
    return exp >= hoje;
  });
}

/** Formata 'AAAA-MM-DD' para 'DD/MM/AAAA'. */
function formatarDataBR(iso) {
  if (!iso) return '';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

function renderHome() {
  const ehGestor = perfilAtivo === 'gestor';
  const vigentes = circularesVigentes();

  // Botão de criar novo aviso — só pro gestor
  const botaoNovo = ehGestor

         <span class="btn-novo-aviso-icone">+</span>

       </button>`
    : '';

  // Monta os cards
  let cards;
  if (vigentes.length === 0) {
    cards = `
      <div class="home-vazio">
        <div class="home-vazio-icone">📭</div>
        <p>Nenhum aviso no momento.</p>
        ${ehGestor ? '<p style="font-size:13px;color:var(--ink-3);">Clique em "+ Novo aviso" para publicar uma circular.</p>' : ''}
      </div>`;
  } else {
    cards = `<div class="home-mural">` + vigentes.map(c => {
      const urgente = c.cor === 'urgente';
      const acoesGestor = ehGestor ? `
        <div class="poster-acoes">
          <button onclick="abrirFormCircular('${c.id}')" title="Editar">✏️</button>
          <button onclick="excluirCircular('${c.id}')" title="Excluir">🗑️</button>

      return `
        <div class="poster ${urgente ? 'poster-urgente' : 'poster-normal'}">
          <div class="poster-topo">
            <span class="poster-tag">${urgente ? '🔴 URGENTE' : '🔵 AVISO'}</span>
            <span class="poster-data">${formatarDataBR(c.data_aviso)}</span>
          </div>
          ${c.titulo ? `<div class="poster-titulo">${escapeHtml(c.titulo)}</div>` : ''}
          <div class="poster-texto">${escapeHtml(c.texto).replace(/\n/g, '<br>')}</div>
          ${c.expira_em ? `<div class="poster-expira">Disponível até ${formatarDataBR(c.expira_em)}</div>` : ''}
          ${acoesGestor}
        </div>`;

  return `

}

/** Mostra um toast flutuante perto do dock inferior (motorista).
 *  Auto-fecha em ~3.5s via CSS animation. Múltiplas chamadas substituem
 *  o toast anterior (não empilha). */
function mostrarToastMotorista(titulo, sub) {
  // Remove qualquer toast anterior antes de mostrar o novo
  document.querySelectorAll('.toast-motorista').forEach(el => el.remove());

  const toast = document.createElement('div');
  toast.className = 'toast-motorista';
  toast.innerHTML = `
    <span class="toast-motorista-titulo">${escapeHtml(titulo)}</span>
    ${sub ? `<span class="toast-motorista-sub">${escapeHtml(sub)}</span>` : ''}
  `;
  document.body.appendChild(toast);
  // Remove do DOM após a animação de saída terminar (~3.6s total)
  setTimeout(() => toast.remove(), 3800);
}

/** Retorna { inicio, fim } da semana vigente (segunda-feira a domingo). */
function rangeSemanaVigente() {
  const hoje = new Date();
  const diaSemana = hoje.getDay();  // 0=domingo, 1=segunda, ..., 6=sábado
  // Calcula quantos dias atrás está a segunda-feira (semana começa na seg)
  const diasParaSegunda = diaSemana === 0 ? 6 : diaSemana - 1;
  const inicio = new Date(hoje);
  inicio.setDate(hoje.getDate() - diasParaSegunda);
  inicio.setHours(0, 0, 0, 0);
  const fim = new Date(inicio);
  fim.setDate(inicio.getDate() + 7);  // exclusivo: até domingo 23:59
  return { inicio, fim };
}

/** Painel "Entregas desta semana" — só aparece pra gestor. Card resumo
 *  com totais por motorista e lista expansível com cada entrega. */
function renderPainelEntregasSemana() {
  const { inicio, fim } = rangeSemanaVigente();
  const hist = (state.historicoEntregas || []).filter(h => {
    if (!h.data) return false;
    const d = new Date(h.data);
    return d >= inicio && d < fim;
  });

  if (hist.length === 0) {
    return `
      <div class="painel-entregas-semana vazio">
        <div class="painel-entregas-icone">📦</div>
        <div>
          <div class="painel-entregas-titulo">Entregas desta semana</div>
          <div class="painel-entregas-sub">Nenhuma entrega registrada ainda esta semana.</div>
        </div>
      </div>`;
  }

  // Agrupa por motorista
  const porMotorista = {};
  hist.forEach(h => {
    const nome = h.motorista || '(sem motorista)';
    if (!porMotorista[nome]) porMotorista[nome] = [];
    porMotorista[nome].push(h);
  });

  // Ordena motoristas pelo número de entregas (descendente)
  const motoristasOrd = Object.entries(porMotorista)
    .sort((a, b) => b[1].length - a[1].length);

  // Resumo: "Daniel: 12 · Gildo: 11"
  const resumo = motoristasOrd
    .map(([nome, ent]) => `<strong>${escapeHtml(nome)}:</strong> ${ent.length}`)
    .join(' · ');

  // Range da semana formatado: "16/jun – 22/jun"
  const fmtCurto = (d) => {
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return `${d.getDate()}/${meses[d.getMonth()]}`;
  };
  const fimDisplay = new Date(fim);
  fimDisplay.setDate(fim.getDate() - 1);  // mostra o último dia inclusivo (domingo)
  const rangeStr = `${fmtCurto(inicio)} – ${fmtCurto(fimDisplay)}`;

  // Lista expansível (escondida por padrão)
  const listaItens = motoristasOrd.map(([nome, entregas]) => {
    const entregasOrd = entregas.slice().sort((a, b) => new Date(b.data) - new Date(a.data));
    const itensLi = entregasOrd.map(h => {
      const dt = new Date(h.data);
      const dataFmt = `${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
      return `
        <li class="painel-entregas-item">
          <span class="painel-entregas-pedido">${escapeHtml(h.pedidoId || '—')}</span>
          <span class="painel-entregas-cliente">${escapeHtml(h.cliente || '(sem cliente)')}</span>
          <span class="painel-entregas-hora">${dataFmt}</span>
        </li>`;
    }).join('');
    return `
      <div class="painel-entregas-motorista">
        <div class="painel-entregas-motorista-nome">${escapeHtml(nome)} · ${entregas.length} entregas</div>
        <ul class="painel-entregas-lista">${itensLi}</ul>
      </div>`;
  }).join('');

  return `
    <div class="painel-entregas-semana">
      <div class="painel-entregas-cabecalho">
        <div class="painel-entregas-icone">📦</div>
        <div style="flex:1;min-width:0;">
          <div class="painel-entregas-titulo">Entregas desta semana <span class="painel-entregas-range">${rangeStr}</span></div>
          <div class="painel-entregas-sub"><strong>${hist.length}</strong> entregas · ${resumo}</div>
        </div>
        <button class="painel-entregas-toggle" onclick="toggleEntregasSemana(this)" aria-expanded="false">
          <span class="painel-entregas-chevron">▾</span>
        </button>
      </div>
      <div class="painel-entregas-detalhes" hidden>
        ${listaItens}
      </div>
    </div>
  `;
}

/** Toggle: abre/fecha a lista de entregas detalhada. */
function toggleEntregasSemana(btn) {
  const painel = btn.closest('.painel-entregas-semana');
  if (!painel) return;
  const detalhes = painel.querySelector('.painel-entregas-detalhes');
  const chevron = btn.querySelector('.painel-entregas-chevron');
  if (!detalhes) return;
  const aberto = !detalhes.hasAttribute('hidden');
  if (aberto) {
    detalhes.setAttribute('hidden', '');
    btn.setAttribute('aria-expanded', 'false');
    if (chevron) chevron.style.transform = 'rotate(0deg)';
  } else {
    detalhes.removeAttribute('hidden');
    btn.setAttribute('aria-expanded', 'true');
    if (chevron) chevron.style.transform = 'rotate(180deg)';
  }
}

/** Escapa HTML pra evitar que texto do aviso quebre o layout. */
function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function bindHomeEvents() {
  // Os botões usam onclick inline, nada a fazer aqui por enquanto.
  // Recarrega as circulares do servidor em segundo plano e re-renderiza
  // se houver mudança (ex: outro dispositivo publicou um aviso).
  if (supabaseClient) {
    circularesAPI.listar().then(() => {
      if (currentView === 'home') {
        const app = document.getElementById('app');
        if (app) app.innerHTML = renderHome();
      }
    });
  }
}

/** Abre o formulário de criar/editar circular (modal). Se passar um id,
    carrega os dados pra edição. */
function abrirFormCircular(id) {
  const editando = id ? circulares.find(c => c.id === id) : null;
  const hoje = new Date().toISOString().slice(0, 10);

  const modal = document.createElement('div');

    <div class="modal-circular-box">
      <div class="modal-circular-header">
